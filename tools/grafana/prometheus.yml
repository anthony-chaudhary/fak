global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "prometheus-alerts.yml"

# Where firing alerts go. Prometheus evaluates prometheus-alerts.yml and hands firing
# alerts to Alertmanager, which groups/routes them and POSTs a webhook to the fak
# receiver (`fak slack alert --serve`), which delivers into the durable Slack outbox.
# See alertmanager.yml for the route + webhook target, and tools/grafana/README.md.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fleet_bottleneck
    # fleet_bottleneck.py serves the Prometheus exposition at :9095/metrics
    # (the same port + UI host as its HTML dashboard). Start it with:
    #   python tools/fleet_bottleneck.py serve --port 9095
    #
    # Default (bridge networking / Docker Desktop):
    #   "host.docker.internal" resolves to the host machine's IP.
    #
    # Linux host networking:
    #   Change to "localhost:9095" (container shares the host network stack).
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9095"]
        labels:
          fleet: claude-code-workers

  - job_name: fak_gateway
    # fak serve exposes gateway/kernel telemetry at :8080/metrics by default.
    # Start it with, for example:
    #   ./fak serve --addr 127.0.0.1:8080
    #
    # The tracked target below is the manual Compose default. When a gateway
    # starts the bundled stack from a rich-dashboard click, fak writes a
    # temporary copy with this one target changed to that gateway's actual
    # listener port and points Compose at the copy. The tracked file is never
    # rewritten, and the gateway remains bound to its configured interface.
    #
    # If the gateway is started with --require-key-env, add Prometheus auth here
    # (for example bearer_token_file) or run a separate loopback-only scrape proxy.
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: fak-gateway

  - job_name: fak_cachevalue
    # `fak cachevalue metrics --serve` re-folds the docs/nightrun/*.jsonl ledgers +
    # experiments/ablate/*.json arms on each scrape and exposes the two-track cache-value
    # P&L (Track 1 WITNESSED reuse, Track 2 OBSERVED/projected $) plus the ablation arms
    # at :9097/metrics. This is a ledger fold, not a hot request path, so a slow scrape
    # is fine. Start it with:
    #   ./fak cachevalue metrics --serve --addr 127.0.0.1:9097
    # Feeds the "FAK Cache Value — Roll-up & Ablation" dashboard (uid fak-cache-value-rollup).
    metrics_path: /metrics
    scrape_interval: 5m
    static_configs:
      - targets: ["host.docker.internal:9097"]
        labels:
          service: fak-cachevalue

  - job_name: fak_fleet
    # `fak fleet metrics --serve` re-folds the durable session registry + the
    # gateway-usage ledger on each scrape and exposes the FLEET-FIRST families at
    # :9098/metrics: the LIVE per-session inventory (fak_fleet_session_*, "which
    # sessions are alive right now") and the HISTORICAL roll-ups (fak_fleet_usage_*).
    # This is the only job carrying a per-`session` label, so it is what makes the
    # fleet dashboards drill down. Start it with:
    #   ./fak fleet metrics --serve --addr 127.0.0.1:9098
    # Feeds "FAK Fleet — Live Sessions & Roll-up" (uid fak-fleet-overview) and
    # "FAK Fleet — Session Drill-down" (uid fak-fleet-session).
    #
    # 30s (the global default) is deliberate here where the cache-value job takes 5m:
    # the live tier answers "is this session alive", and a 5m scrape would make a
    # session that started and died between scrapes invisible.
    #
    # If you run the exporter with --fleet (folding peer nodes' C2 session refs), each
    # scrape runs a BOUNDED git fetch — raise scrape_interval and scrape_timeout to
    # match, or run a second exporter on another port for the peer view.
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9098"]
        labels:
          service: fak-fleet

  - job_name: fak_native_slo
    metrics_path: /fak-native-slo.prom
    static_configs:
      - targets: ["host.docker.internal:9099"]
        labels:
          service: fak-native-slo
