# Prometheus + Grafana for fleet observability and the FAK gateway.
# Default: Docker Desktop (Windows / macOS) bridge networking — works out of the
# box when fleet_bottleneck.py and fak serve run on the same machine.
#
# Network path (default):
#   Grafana → http://prometheus:9091 → Prometheus → host.docker.internal:9095 → fleet_bottleneck.py
#   Grafana → http://prometheus:9091 → Prometheus → host.docker.internal:<gateway-port> → fak serve
#   Prometheus → alertmanager:9093 → host.docker.internal:9096 → fak slack alert (→ Slack outbox)
#
# Start the metrics sources first (on the host):
#   python tools/fleet_bottleneck.py serve --port 9095
#   ./fak serve --addr 127.0.0.1:8080
# Then bring the stack up:
#   cd tools/grafana && docker compose up -d
# Open http://<host>:3000  (anonymous Viewer)
#
# Linux / DGX (host networking): uncomment every "network_mode: host" line, comment
# out the ports/extra_hosts blocks, and update:
#   - prometheus.yml: targets → "localhost:9095" and "localhost:8080"
#   - provisioning/datasources/datasource.yml: Prometheus url → "http://localhost:9091"

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: fleet-prometheus
    restart: unless-stopped
    # network_mode: host  # [LINUX] uncomment; comment ports/extra_hosts below
    ports:
      - "9091:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
    volumes:
      # On-demand gateway startup sets FAK_PROMETHEUS_CONFIG to a generated,
      # per-process copy whose fak_gateway target uses the live listener port.
      # Manual `docker compose up` keeps using the tracked :8080 default.
      - "${FAK_PROMETHEUS_CONFIG:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro"
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - fleet-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.listen-address=:9091"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fleet-alertmanager
    restart: unless-stopped
    # network_mode: host  # [LINUX] uncomment; comment ports/extra_hosts below AND change
    #                     # alertmanager.yml webhook url → http://localhost:9096/alerts
    ports:
      - "9093:9093"
    extra_hosts:
      # Lets Alertmanager POST the webhook to `fak slack alert --serve` on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - fleet-alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.listen-address=:9093"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: fleet-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    # network_mode: host  # [LINUX] uncomment; comment ports/extra_hosts below
    ports:
      - "3000:3000"  # LAN-visible; anonymous access is read-only
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # A FRESH volume must still get an admin, or `fak-obs-stack` cannot pin the
      # default home dashboard. GF_SECURITY_ADMIN_USER/PASSWORD arrive from the
      # --env-file the supervisor passes (written 0600 outside this repo).
      # GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION defaults to TRUE here so an
      # UNSET password can never mint an admin with an empty/known password; the
      # supervisor's env-file flips it to false together with a real secret.
      # Anonymous read-only Viewer access is independent of having an admin, so
      # the login-free LAN posture is unchanged (witnessed on grafana:11.5.2).
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=${GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION:-true}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-}
      # A non-secret fingerprint of the credential above. `--env-file` only feeds
      # interpolation, so a changed credential would NOT recreate an existing
      # container; including this value in the service definition forces exactly
      # that recreation, and only when the credential actually changes.
      - FAK_GRAFANA_ADMIN_FP=${FAK_GRAFANA_ADMIN_FP:-unset}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_USERS_ALLOW_SIGN_UP=false
      # Read-heavy fleet dashboards default to the light theme (env alias of
      # [users] default_theme); anonymous Viewers may still switch per session.
      - GF_USERS_DEFAULT_THEME=light
      # NOTE: this variable is NOT what routes an anonymous visitor to the home
      # dashboard. Grafana 11's SPA bypasses the legacy server-side redirect it
      # feeds, so `/` still renders the Welcome splash when the org home
      # preference is unset — verified against grafana/grafana:11.5.2 on a fresh
      # volume with this variable set and the dashboard provisioned. It is kept
      # as a documented legacy hint; the working mechanism is the org home
      # dashboard preference, pinned idempotently by `fak-obs-stack`
      # (platform/obs/stack/grafana_home.go).
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fak-fleet-overview.json
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - fleet-grafana-data:/var/lib/grafana

volumes:
  fleet-prometheus-data:
  fleet-alertmanager-data:
  fleet-grafana-data:
