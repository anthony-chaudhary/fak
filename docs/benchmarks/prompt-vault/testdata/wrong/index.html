<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Static palette-shaped wrong page</title>
  <style>
    * { box-sizing: border-box; }
    body { display: flex; min-height: 100vh; margin: 0; }
    div { display: grid; flex: 1; place-items: center; transition: background-color 200ms ease; }
  </style>
</head>
<body>
  <div style="background:#112233;color:#fff">#112233</div>
  <div style="background:#DDEEFF;color:#111">#DDEEFF</div>
  <div style="background:#334455;color:#fff">#334455</div>
  <div style="background:#CCDDEE;color:#111">#CCDDEE</div>
  <div style="background:#556677;color:#fff">#556677</div>
</body>
</html>
