<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="kvc-title kvc-desc">
<title id="kvc-title">The KV cache as a growing table: rows are sequence positions, columns are the K and V vectors per layer, one row is appended per decode step, and the new query attends over every cached row</title>
<desc id="kvc-desc">A growing table. Rows are sequence positions; the columns are the K and V vectors for each layer, stored as flat row-major slices of NumKVHeads times HeadDim per position. The cache is the first-class object KVCache (internal/model/kvcache.go:11). It holds K (post-RoPE), Kraw (the same entries pre-RoPE, so a span can be repositioned), and V, plus a shared pos list of absolute positions. After prefill the table has P rows; each decode step appends exactly one row per layer, and the shared pos list grows by one. The new query at the newest position attends over ALL cached rows &#8212; the causal mask lets it see every position up to and including itself. The memory cost is 2 times layers times NumKVHeads times HeadDim times positions times bytes_per_element; the leading 2 is K and V. A worked example for 32 layers, 8 KV heads, HeadDim 128, 32768 positions, 2 bytes per element gives 4.29 GB. fak's own accounting charges three f32 rows per position (post-RoPE K, pre-RoPE Kraw, and V), which is 12.9 GB for the same config.</desc>

<rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

<text x="490" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#24292f">The KV cache &#8212; a table that grows one row per step</text>
<text x="490" y="60" text-anchor="middle" font-size="12.5" fill="#57606a">Rows are sequence positions; columns are K and V per layer. Decode appends one row and reads every row back. That read is why decode is fast.</text>

<!-- the growing table -->
<rect x="40" y="90" width="470" height="300" rx="10" fill="#0969da" fill-opacity="0.04" stroke="#0969da" stroke-width="1.4"/>
<text x="275" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#24292f">KVCache &#8212; kvcache.go:11</text>
<text x="275" y="130" text-anchor="middle" font-size="10" fill="#57606a">one row per position, per layer &#8212; flat row-major, NumKVHeads&#215;HeadDim wide</text>

<!-- header row -->
<rect x="60" y="142" width="70" height="26" rx="4" fill="#24292f" fill-opacity="0.06" stroke="#d0d7de" stroke-width="1"/>
<text x="95" y="159" text-anchor="middle" font-size="10.5" font-weight="700" fill="#24292f">pos</text>
<rect x="134" y="142" width="150" height="26" rx="4" fill="#0969da" fill-opacity="0.08" stroke="#d0d7de" stroke-width="1"/>
<text x="209" y="159" text-anchor="middle" font-size="10.5" font-weight="700" fill="#24292f">K row (post-RoPE)</text>
<rect x="288" y="142" width="150" height="26" rx="4" fill="#9a6700" fill-opacity="0.08" stroke="#d0d7de" stroke-width="1"/>
<text x="363" y="159" text-anchor="middle" font-size="10.5" font-weight="700" fill="#24292f">V row</text>

<!-- rows 0..3 (from prefill) -->
