<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="tg-title tg-desc">
<title id="tg-title">The three gates: a candidate optimization enters at the left and must pass Gate 1 Plug in, Gate 2 Prove correct, and Gate 3 Prove faster before it lands</title>
<desc id="tg-desc">A left-to-right funnel. A candidate optimization enters at the left. Gate 1, Plug in: the mechanism is a Register* seam plus the internal/architest layering gate; run it with fak new-leaf. Gate 2, Prove correct: the mechanism is the Reference or Approx correctness class plus a deterministic witness test; run it with the package test. Gate 3, Prove faster: the mechanism is the non-forgeable keep-bit, shipgate.Evaluate via cmd/rsicycle; run it with go run ./cmd/rsicycle. A candidate that clears all three lands (green, KEEP). A candidate that fails any gate is reverted (red, REVERT). Each gate is mechanical: a tool or a test, not a review opinion.</desc>

<rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

<text x="490" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#24292f">The three gates &#8212; plug in, prove correct, prove faster</text>
<text x="490" y="60" text-anchor="middle" font-size="12.5" fill="#57606a">Every optimization lands the same way. Each gate is mechanical: a tool or a test, not a review opinion. You do not get to skip a gate.</text>

<!-- candidate enters -->
<rect x="30" y="250" width="120" height="70" rx="10" fill="#24292f" fill-opacity="0.04" stroke="#24292f" stroke-width="1.4"/>
<text x="90" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#24292f">candidate</text>
<text x="90" y="298" text-anchor="middle" font-size="11" fill="#57606a">optimization</text>

<line x1="150" y1="285" x2="196" y2="285" stroke="#24292f" stroke-width="2"/>
<polygon points="196,278 210,285 196,292" fill="#24292f"/>

<!-- GATE 1 -->
<rect x="210" y="150" width="220" height="270" rx="10" fill="#0969da" fill-opacity="0.04" stroke="#0969da" stroke-width="1.4"/>
<rect x="210" y="150" width="220" height="34" rx="10" fill="#0969da"/>
<rect x="210" y="170" width="220" height="14" fill="#0969da"/>
<text x="320" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GATE 1 &#8212; Plug in</text>
<text x="228" y="210" font-size="11.5" font-weight="700" fill="#24292f">Where does my code attach?</text>
<text x="228" y="234" font-size="11" fill="#57606a">mechanism:</text>
<text x="228" y="252" font-size="11" fill="#24292f">a Register* seam +</text>
<text x="228" y="268" font-size="11" fill="#24292f">internal/architest</text>
<text x="228" y="284" font-size="11" fill="#24292f">layering gate</text>
<text x="228" y="312" font-size="11" fill="#57606a">run it:</text>
<rect x="228" y="322" width="184" height="24" rx="5" fill="#24292f" fill-opacity="0.05" stroke="#d0d7de" stroke-width="1"/>
<text x="236" y="338" font-size="10.5" fill="#24292f">fak new-leaf &#8230;</text>
<text x="228" y="372" font-size="10.5" fill="#57606a">a new package + one</text>
<text x="228" y="388" font-size="10.5" fill="#57606a">Register*() call, never</text>
<text x="228" y="404" font-size="10.5" fill="#57606a">an edit to the spine</text>

<line x1="430" y1="285" x2="476" y2="285" stroke="#24292f" stroke-width="2"/>
<polygon points="476,278 490,285 476,292" fill="#24292f"/>

<!-- GATE 2 -->
<rect x="490" y="150" width="220" height="270" rx="10" fill="#9a6700" fill-opacity="0.05" stroke="#9a6700" stroke-width="1.4"/>
<rect x="490" y="150" width="220" height="34" rx="10" fill="#9a6700"/>
<rect x="490" y="170" width="220" height="14" fill="#9a6700"/>
<text x="600" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GATE 2 &#8212; Prove correct</text>
<text x="508" y="210" font-size="11.5" font-weight="700" fill="#24292f">Does it preserve behavior?</text>
<text x="508" y="234" font-size="11" fill="#57606a">mechanism:</text>
<text x="508" y="252" font-size="11" fill="#24292f">the Reference / Approx</text>
<text x="508" y="268" font-size="11" fill="#24292f">correctness class + a</text>
<text x="508" y="284" font-size="11" fill="#24292f">deterministic witness</text>
<text x="508" y="312" font-size="11" fill="#57606a">run it:</text>
<rect x="508" y="322" width="184" height="24" rx="5" fill="#24292f" fill-opacity="0.05" stroke="#d0d7de" stroke-width="1"/>
<text x="516" y="338" font-size="10.5" fill="#24292f">go test ./internal/&lt;pkg&gt;/</text>
<text x="508" y="372" font-size="10.5" fill="#57606a">the model proposes,</text>
<text x="508" y="388" font-size="10.5" fill="#57606a">the test disposes; a red</text>
<text x="508" y="404" font-size="10.5" fill="#57606a">witness cannot land</text>

<line x1="710" y1="285" x2="756" y2="285" stroke="#24292f" stroke-width="2"/>
<polygon points="756,278 770,285 756,292" fill="#24292f"/>

<!-- GATE 3 -->
<rect x="770" y="150" width="180" height="270" rx="10" fill="#1a7f37" fill-opacity="0.05" stroke="#1a7f37" stroke-width="1.4"/>
<rect x="770" y="150" width="180" height="34" rx="10" fill="#1a7f37"/>
<rect x="770" y="170" width="180" height="14" fill="#1a7f37"/>
<text x="860" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GATE 3 &#8212; Prove faster</text>
<text x="788" y="210" font-size="11.5" font-weight="700" fill="#24292f">Is it actually a win?</text>
<text x="788" y="234" font-size="11" fill="#57606a">mechanism:</text>
<text x="788" y="252" font-size="11" fill="#24292f">the non-forgeable</text>
<text x="788" y="268" font-size="11" fill="#24292f">keep-bit,</text>
<text x="788" y="284" font-size="11" fill="#24292f">shipgate.Evaluate</text>
<text x="788" y="312" font-size="11" fill="#57606a">run it:</text>
<rect x="788" y="322" width="144" height="24" rx="5" fill="#24292f" fill-opacity="0.05" stroke="#d0d7de" stroke-width="1"/>
<text x="796" y="338" font-size="10.5" fill="#24292f">go run ./cmd/rsicycle</text>
<text x="788" y="372" font-size="10.5" fill="#57606a">KEEP only on a</text>
<text x="788" y="388" font-size="10.5" fill="#57606a">measured strict gain,</text>
<text x="788" y="404" font-size="10.5" fill="#57606a">green and clean</text>

<!-- land / revert outcomes -->
<line x1="860" y1="420" x2="860" y2="452" stroke="#1a7f37" stroke-width="2"/>
<polygon points="860,452 853,438 867,438" fill="#1a7f37"/>
<rect x="760" y="452" width="200" height="46" rx="8" fill="#1a7f37" fill-opacity="0.06" stroke="#1a7f37" stroke-width="1.2"/>
<text x="860" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">LANDS &#8212; KEEP</text>
<text x="860" y="489" text-anchor="middle" font-size="10.5" fill="#57606a">all three gates green</text>

<line x1="320" y1="420" x2="320" y2="452" stroke="#cf222e" stroke-width="2"/>
<polygon points="320,452 313,438 327,438" fill="#cf222e"/>
<rect x="220" y="452" width="200" height="46" rx="8" fill="#cf222e" fill-opacity="0.05" stroke="#cf222e" stroke-width="1.2"/>
<text x="320" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">REVERTED &#8212; REVERT</text>
<text x="320" y="489" text-anchor="middle" font-size="10.5" fill="#57606a">any gate red stops it</text>

<!-- footer -->
<text x="490" y="536" text-anchor="middle" font-size="11" fill="#57606a">The gates are what make it safe to accept optimizations from anyone &#8212; including autonomous coding agents. A contributor cannot land a kernel</text>
<text x="490" y="552" text-anchor="middle" font-size="11" fill="#57606a">that is plausible-but-wrong (Gate 2 catches it) or correct-but-slower (Gate 3 catches it). The keep-bit is non-forgeable: the author cannot set it.</text>
<text x="490" y="578" text-anchor="middle" font-size="11" fill="#57606a">Before you start, run the preflight: python tools/extend_preflight.py &#8212; it tells you whether all three gate entry points are wired.</text>
</svg>
