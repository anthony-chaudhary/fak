<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="t3 d3">
<title id="t3">The depth ladder: seven rungs from Go source down to silicon</title>
<desc id="d3">Seven descending rungs show the abstraction layers a fak kernel passes through: Go source, cgo and a flat C ABI, host CUDA C++, device CUDA C++, intrinsics and inline PTX, PTX virtual assembly, SASS machine code, and finally the silicon. Each rung names the tool that produces it and the file in fak where it lives.</desc>
<defs>
<linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#121a32"/></linearGradient>
<linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
</defs>
<rect width="980" height="600" rx="24" fill="url(#bg3)"/>
<g font-family="Inter,Segoe UI,sans-serif">
<text x="48" y="56" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="3">SEVEN RUNGS, ONE KERNEL</text>
<text x="48" y="98" fill="#f8fafc" font-size="30" font-weight="750">The depth ladder</text>
<text x="48" y="128" fill="#94a3b8" font-size="15">Each rung is produced by a different tool. Each one is a real artifact you can open.</text>

<rect x="60" y="150" width="6" height="392" rx="3" fill="url(#rail)"/>

<circle cx="63" cy="172" r="7" fill="#22d3ee"/>
<text x="92" y="170" fill="#f8fafc" font-size="16" font-weight="700">Go source</text>
<text x="92" y="190" fill="#94a3b8" font-size="13">the forward pass, the quantized dot product</text>
<text x="920" y="180" fill="#64748b" font-family="Consolas,monospace" font-size="12" text-anchor="end">internal/model/quant.go</text>

<circle cx="63" cy="228" r="7" fill="#22d3ee"/>
<text x="92" y="226" fill="#f8fafc" font-size="16" font-weight="700">cgo + flat C ABI</text>
<text x="92" y="246" fill="#94a3b8" font-size="13">Go types erased; device pointers and shapes only</text>
<text x="920" y="236" fill="#64748b" font-family="Consolas,monospace" font-size="12" text-anchor="end">internal/compute/cuda.go</text>

<circle cx="63" cy="284" r="7" fill="#38bdf8"/>
<text x="92" y="282" fill="#f8fafc" font-size="16" font-weight="700">host CUDA C++</text>
<text x="92" y="302" fill="#94a3b8" font-size="13">launch config, shared memory sizing, the grid</text>
<text x="920" y="292" fill="#64748b" font-family="Consolas,monospace" font-size="12" text-anchor="end">cuda_kernels.cu</text>

<circle cx="63" cy="340" r="7" fill="#38bdf8"/>
<text x="92" y="338" fill="#f8fafc" font-size="16" font-weight="700">device CUDA C++</text>
<text x="92" y="358" fill="#94a3b8" font-size="13">the __global__ kernel body, one thread's view</text>
<text x="920" y="348" fill="#64748b" font-family="Consolas,monospace" font-size="12" text-anchor="end">fattn_mma_hd256.cuh</text>

<circle cx="63" cy="396" r="7" fill="#5b9dff"/>
<text x="92" y="394" fill="#f8fafc" font-size="16" font-weight="700">intrinsics and inline PTX</text>
<text x="92" y="414" fill="#94a3b8" font-size="13">mma.sync · ldmatrix · cp.async · __dp4a</text>
<text x="920" y="404" fill="#64748b" font-family="Consolas,monospace" font-size="12" text-anchor="end">asm volatile(...)</text>

<circle cx="63" cy="452" r="7" fill="#5b9dff"/>
<text x="92" y="450" fill="#f8fafc" font-size="16" font-weight="700">PTX</text>
<text x="92" y="470" fill="#94a3b8" font-size="13">virtual assembly, forward-compatible across chips</text>
<text x="920" y="460" fill="#64748b" font-family="Consolas,monospace" font-size="12" text-anchor="end">code=compute_89</text>

<circle cx="63" cy="508" r="7" fill="#a78bfa"/>
<text x="92" y="506" fill="#f8fafc" font-size="16" font-weight="700">SASS</text>
<text x="92" y="526" fill="#94a3b8" font-size="13">real machine code, valid for exactly one chip</text>
<text x="920" y="516" fill="#64748b" font-family="Consolas,monospace" font-size="12" text-anchor="end">code=sm_89</text>

<circle cx="63" cy="556" r="7" fill="#a78bfa"/>
<text x="92" y="554" fill="#f8fafc" font-size="16" font-weight="700">silicon</text>
<text x="92" y="574" fill="#94a3b8" font-size="13">CUDA cores, tensor cores, the memory system</text>
<text x="920" y="564" fill="#64748b" font-family="Consolas,monospace" font-size="12" text-anchor="end">sm_89 · sm_120</text>
</g>
</svg>
