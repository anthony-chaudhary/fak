<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="sb-title sb-desc">
<title id="sb-title">One static binary vs a multi-process governed-serving stack</title>
<desc id="sb-desc">Two columns with the same four responsibilities labeled identically on both sides, so the only difference is the box count. LEFT "the usual governed-serving stack" is four separate processes you deploy, wire, and patch: reverse proxy / gateway, policy / capability floor, result quarantine, audit journal — each its own service, port, and config, joined by network hops. RIGHT "one fak binary" holds the same four responsibilities as in-process stages inside a single static Go binary: one process, one config, in-process calls. A blue arrow carries the rule: you add flags, not components.</desc>
<rect x="0" y="0" width="920" height="560" fill="#ffffff"/>
<text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#24292f">One binary vs a multi-process stack &#8212; same job, one box</text>
<text x="460" y="58" text-anchor="middle" font-size="12.5" fill="#57606a">The same four responsibilities, labeled identically on both sides &#8212; so the collapse is the only difference.</text>

<!-- LEFT: the multi-process governed-serving stack -->
<rect x="40" y="86" width="380" height="404" rx="10" fill="#cf222e" fill-opacity="0.04" stroke="#cf222e" stroke-width="1.2"/>
<text x="60" y="116" font-size="14" font-weight="700" fill="#cf222e">THE USUAL GOVERNED-SERVING STACK</text>
<text x="60" y="136" font-size="11.5" fill="#57606a">four processes you deploy, wire, and patch</text>
<line x1="60" y1="150" x2="400" y2="150" stroke="#d0d7de" stroke-width="1"/>

<rect x="60" y="168" width="340" height="54" rx="7" fill="#ffffff" stroke="#cf222e" stroke-width="1"/>
<rect x="60" y="168" width="12" height="54" rx="0" fill="#cf222e"/>
<text x="84" y="192" font-size="13" font-weight="600" fill="#24292f">reverse proxy / gateway</text>
<text x="84" y="210" font-size="10.5" fill="#57606a">separate process &#183; own port + config</text>

<rect x="60" y="240" width="340" height="54" rx="7" fill="#ffffff" stroke="#cf222e" stroke-width="1"/>
<rect x="60" y="240" width="12" height="54" rx="0" fill="#cf222e"/>
<text x="84" y="264" font-size="13" font-weight="600" fill="#24292f">policy / capability floor</text>
<text x="84" y="282" font-size="10.5" fill="#57606a">separate process &#183; own port + config</text>

<rect x="60" y="312" width="340" height="54" rx="7" fill="#ffffff" stroke="#cf222e" stroke-width="1"/>
<rect x="60" y="312" width="12" height="54" rx="0" fill="#cf222e"/>
<text x="84" y="336" font-size="13" font-weight="600" fill="#24292f">result quarantine</text>
<text x="84" y="354" font-size="10.5" fill="#57606a">separate process &#183; own port + config</text>

<rect x="60" y="384" width="340" height="54" rx="7" fill="#ffffff" stroke="#cf222e" stroke-width="1"/>
<rect x="60" y="384" width="12" height="54" rx="0" fill="#cf222e"/>
<text x="84" y="408" font-size="13" font-weight="600" fill="#24292f">audit journal</text>
<text x="84" y="426" font-size="10.5" fill="#57606a">separate process &#183; writes its own journal</text>

<text x="60" y="462" font-size="11" font-weight="600" fill="#cf222e">4 configs &#183; 4 ports &#183; network hops between them &#183; 4 things to patch</text>

<!-- RIGHT: one fak binary -->
<rect x="500" y="86" width="380" height="404" rx="10" fill="#1a7f37" fill-opacity="0.04" stroke="#1a7f37" stroke-width="1.2"/>
<text x="520" y="116" font-size="14" font-weight="700" fill="#1a7f37">ONE fak BINARY</text>
<text x="520" y="136" font-size="11.5" fill="#57606a">same responsibilities, one process</text>
<line x1="520" y1="150" x2="860" y2="150" stroke="#d0d7de" stroke-width="1"/>

<rect x="520" y="168" width="340" height="270" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.4"/>
<text x="540" y="192" font-size="12.5" font-weight="700" fill="#1a7f37">fak &#8212; one static Go binary &#183; one process</text>

<rect x="540" y="206" width="12" height="12" fill="#1a7f37"/>
<text x="560" y="217" font-size="13" font-weight="600" fill="#24292f">reverse proxy / gateway</text>
<text x="560" y="234" font-size="10.5" fill="#57606a">in-process stage &#8212; a flag, not a service</text>

<rect x="540" y="258" width="12" height="12" fill="#1a7f37"/>
<text x="560" y="269" font-size="13" font-weight="600" fill="#24292f">policy / capability floor</text>
<text x="560" y="286" font-size="10.5" fill="#57606a">in-process stage &#8212; a flag, not a service</text>

<rect x="540" y="310" width="12" height="12" fill="#1a7f37"/>
<text x="560" y="321" font-size="13" font-weight="600" fill="#24292f">result quarantine</text>
<text x="560" y="338" font-size="10.5" fill="#57606a">in-process stage &#8212; a flag, not a service</text>

<rect x="540" y="362" width="12" height="12" fill="#1a7f37"/>
<text x="560" y="373" font-size="13" font-weight="600" fill="#24292f">audit journal</text>
<text x="560" y="390" font-size="10.5" fill="#57606a">in-process stage &#8212; a flag, not a service</text>

<text x="520" y="462" font-size="11" font-weight="600" fill="#1a7f37">1 config &#183; 1 port &#183; in-process calls &#183; 1 thing to patch</text>

<!-- collapse arrow -->
<line x1="424" y1="288" x2="492" y2="288" stroke="#0969da" stroke-width="3"/>
<polygon points="492,280 506,288 492,296" fill="#0969da"/>
<text x="460" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">four processes</text>
<text x="460" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">&#8594; one</text>

<text x="460" y="516" text-anchor="middle" font-size="11" fill="#57606a">Same four responsibilities on both sides. Left = four cooperating services; right = one process. The collapse is the only difference.</text>
<text x="460" y="534" text-anchor="middle" font-size="10.5" fill="#57606a">You add flags, not components: fak guard -- claude &#183; fak serve &#183; fak preflight. One binary drops in front of the agent you already run.</text>
</svg>
