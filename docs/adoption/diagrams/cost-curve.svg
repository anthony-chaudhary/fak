<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="cc-title cc-desc">
<title id="cc-title">Long-session cost curve: naive re-send vs fak prefix-preserving</title>
<desc id="cc-desc">Billed prompt tokens per turn over a 50-turn session. The naive full-price re-send line rises steeply; the fak prefix-preserving line (provider prompt-cache prefix kept byte-identical so the discount holds) stays shallow. Curves are the cache_curve.py modeled per-turn bill; witnessed anchors (96.6% machine-wide cache-read share; ~4.1x vs tuned warm-cache fleet) are annotated separately.</desc>
<rect x="0" y="0" width="920" height="580" fill="#ffffff"/>
<text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#24292f">Long-session cost: naive re-send vs fak prefix-preserving</text>
<text x="460" y="58" text-anchor="middle" font-size="12.5" fill="#57606a">Billed prompt tokens per turn over a 50-turn session (delta=2,000 tok/turn, cache-read 0.1&#215; base). Curves = modeled; box = witnessed.</text>
