  <text x="40.00" y="44.00" font-size="18.00" font-weight="bold" fill="#111111" text-anchor="start">Batched serving on one RTX 5080 16 GB</text>
  <text x="40.00" y="62.00" font-size="12.00" fill="#444444" text-anchor="start">Aggregate tok/s across streams, and the cohort prefill end to end; a single stream is the per-stream reference.</text>
  <text x="40.00" y="88.00" font-size="13.00" font-weight="bold" fill="#111111" text-anchor="start">Aggregate decode</text>
  <text x="40.00" y="102.00" font-size="10.50" fill="#444444" text-anchor="start">summed across streams; single stream is per stream</text>
