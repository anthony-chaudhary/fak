  <text x="71.00" y="458.50" font-size="10.00" fill="#444444" text-anchor="end">200</text>
  <line x1="76.00" y1="424.50" x2="436.00" y2="424.50" stroke="#e5e7eb" stroke-width="1.00"/>
  <text x="71.00" y="428.00" font-size="10.00" fill="#444444" text-anchor="end">300</text>
  <line x1="76.00" y1="394.00" x2="436.00" y2="394.00" stroke="#e5e7eb" stroke-width="1.00"/>
  <text x="71.00" y="397.50" font-size="10.00" fill="#444444" text-anchor="end">400</text>
  <text x="71.00" y="364.00" font-size="10.00" fill="#444444" text-anchor="end">tok/s</text>
  <line x1="76.00" y1="516.00" x2="436.00" y2="516.00" stroke="#333333" stroke-width="1.00"/>
  <rect class="lv-bar" x="102.40" y="474.00" width="67.20" height="42.00" fill="#6e7781"/>
  <text x="136.00" y="468.00" font-size="11.00" font-weight="bold" fill="#111111" text-anchor="middle">137.7</text>
  <text x="136.00" y="530.00" font-size="10.50" fill="#444444" text-anchor="middle">lockstep</text>
  <rect class="lv-bar" x="222.40" y="402.52" width="67.20" height="113.48" fill="#1f6feb"/>
  <text x="256.00" y="396.52" font-size="11.00" font-weight="bold" fill="#111111" text-anchor="middle">372.1</text>
  <text x="256.00" y="383.52" font-size="10.50" font-weight="bold" fill="#1f6feb" text-anchor="middle">2.70x</text>
  <text x="256.00" y="530.00" font-size="10.50" fill="#444444" text-anchor="middle">ragged</text>
  <rect class="lv-bar" x="342.40" y="408.53" width="67.20" height="107.47" fill="#6e7781"/>
  <text x="376.00" y="402.53" font-size="11.00" font-weight="bold" fill="#111111" text-anchor="middle">352.36</text>
  <text x="376.00" y="530.00" font-size="10.50" fill="#444444" text-anchor="middle">OSS e2e</text>
  <rect x="40.00" y="573.00" width="12.00" height="10.00" fill="#b42318"/>
  <text x="62.00" y="582.00" font-size="11.00" fill="#444444" text-anchor="start">loss</text>
  <text x="40.00" y="604.00" font-size="10.00" fill="#444444" text-anchor="start">Inkling-2-Mini UD-Q3_K_XL, RTX 5080 16 GB.</text>
  <text x="40.00" y="615.00" font-size="10.00" fill="#444444" text-anchor="start">Aggregate rows are summed across streams and are not per-stream rates; the cohort rows use chat prompts, the OSS row uses raw</text>
  <text x="40.00" y="626.00" font-size="10.00" fill="#444444" text-anchor="start">prompts.</text>
  <text x="40.00" y="637.00" font-size="10.00" fill="#444444" text-anchor="start">The C1 batch row is the batch path at one stream: a loss by design, since the batch path only wins at width.</text>
  <text x="40.00" y="648.00" font-size="10.00" fill="#444444" text-anchor="start">reference for the batch rows; the resident single-stream reader, not the batch path</text>
  <text x="40.00" y="659.00" font-size="10.00" fill="#444444" text-anchor="start">loss: the batch path at one stream runs at about half the resident single-stream rate; the batch path only wins at width</text>
  <text x="40.00" y="670.00" font-size="10.00" fill="#444444" text-anchor="start">aggregate across 8 streams, not per-stream. aggregate across 24 streams, not a per-stream rate; opt-in f16 KV; single run</text>
  <text x="40.00" y="681.00" font-size="10.00" fill="#444444" text-anchor="start">aggregate across 16 streams, not per-stream; 82-88-token chat prompts, not the 19-token OSS prompts</text>
  <text x="40.00" y="692.00" font-size="10.00" fill="#444444" text-anchor="start">aggregate across 16 streams, not per-stream; 82-88-token chat prompts; B adds the cohort prefill to the same serve path as A</text>
  <text x="40.00" y="703.00" font-size="10.00" fill="#444444" text-anchor="start">aggregate across 16 streams, not per-stream; 19-token raw prompts, so the prompt shape differs from the fak C16 rows; absolute</text>
  <text x="40.00" y="714.00" font-size="10.00" fill="#444444" text-anchor="start">value, no ratio</text>
</svg>
