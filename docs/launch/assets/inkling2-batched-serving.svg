  <text x="309.40" y="280.00" font-size="10.50" fill="#444444" text-anchor="middle">C1 batch</text>
  <rect class="lv-bar" x="429.00" y="218.32" width="72.00" height="47.68" fill="#6e7781"/>
  <text x="465.00" y="212.32" font-size="11.00" font-weight="bold" fill="#111111" text-anchor="middle">312.7</text>
  <text x="465.00" y="280.00" font-size="10.50" fill="#444444" text-anchor="middle">C8 rows off</text>
  <rect class="lv-bar" x="584.60" y="215.12" width="72.00" height="50.88" fill="#1f6feb"/>
  <text x="620.60" y="209.12" font-size="11.00" font-weight="bold" fill="#111111" text-anchor="middle">333.7</text>
  <text x="620.60" y="196.12" font-size="10.50" font-weight="bold" fill="#1f6feb" text-anchor="middle">1.07x</text>
  <text x="620.60" y="280.00" font-size="10.50" fill="#444444" text-anchor="middle">C8 rows on</text>
  <rect class="lv-bar" x="740.20" y="146.49" width="72.00" height="119.51" fill="#1f6feb"/>
  <text x="776.20" y="140.49" font-size="11.00" font-weight="bold" fill="#111111" text-anchor="middle">783.7</text>
  <text x="776.20" y="280.00" font-size="10.50" fill="#444444" text-anchor="middle">C24 f16</text>
  <text x="40.00" y="338.00" font-size="13.00" font-weight="bold" fill="#111111" text-anchor="start">Cohort prefill, end to end</text>
  <text x="40.00" y="352.00" font-size="10.50" fill="#444444" text-anchor="start">C16 HTTP cohort, aggregate tok/s</text>
  <text x="71.00" y="519.50" font-size="10.00" fill="#444444" text-anchor="end">0</text>
  <line x1="76.00" y1="485.50" x2="436.00" y2="485.50" stroke="#e5e7eb" stroke-width="1.00"/>
