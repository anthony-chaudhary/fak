# Garden bundle gate + cadence — the default-on fold over the gardening passes.
#
# `fak garden` (internal/gardenbundle, the Go port of the retired
# tools/garden_bundle.py) folds the repo's three read-only self-maintenance
# orchestrators — the scorecard control pane (13-scorecard portfolio ratchet), the
# fresh-status cross-domain rollup, and the fleet loop-audit — into ONE
# `schema/ok/verdict/finding/reason/next_action` control-pane verdict, so "is the
# garden tended?" is one query. It was a hand-run command; this workflow makes the
# fold default-on, mirroring dogfood-coverage.yml:
#
#   * GATE     — `--check` exits 1 when a GATING member regressed (today only the
#                scorecard ratchet gates) or a member failed to RUN. Advisory panes
#                (fresh-status, loop-audit surfacing a condition) do NOT fail the
#                build — a pass surfacing a condition is the pass working. The
#                hermetic proof that the fold/gate logic is correct is
#                `go test ./internal/gardenbundle/` (run first, below).
#   * CADENCE  — `schedule:` re-runs it daily so the rolled-up verdict can't silently
#                rot, and the `--json` payload is written to the run's step summary
#                so the garden state is surfaced over time without anyone re-running.
#
# `fak garden` folds the member passes (read-only, over the git-tracked tree, no
# network, no GPU) into one deterministic verdict. Full design:
# docs/notes/GARDENING-BUNDLE-DEFAULT-ON-2026-06-25.md.
name: garden

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Daily at 06:23 UTC — an off-the-hour minute so the fleet's scheduled jobs
    # don't all land on :00 (dogfood-coverage is 07:13). The cadence half: the
    # garden verdict is re-emitted to the step summary daily so it's tracked.
    - cron: "23 6 * * *"

# Supersede stale branch/PR work, but preserve every scheduled or manual audit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ref-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  garden:
    name: garden bundle gate + payload
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          # The scorecard member asks git what shipped after the learning-scorecard
          # stamp; a shallow checkout makes the boundary commit look like a mass add.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The fold/gate logic FIRST: this asserts the bundle gates RED on a regressed
      # gating member and stays green on an advisory-only condition, so a green
      # `--check` below is a real signal and not a tool that always passes.
      - name: garden bundle self-test
        run: go test ./internal/gardenbundle/

      # Collect once: the gate's source-bound payload also supplies the summary.
      # Explicit Bash keeps pipefail enabled so tee cannot hide a failed gate.
      - name: garden bundle gate (--check)
        shell: bash
        run: go run ./cmd/fak garden --check --json | tee "$RUNNER_TEMP/garden-payload.json"

      # Render the captured verdict even after a red gate, without recollecting.
      # Missing or invalid evidence is a reporting failure, never a green substitute.
      - name: garden bundle payload -> step summary
        if: always()
        shell: bash
        run: |
          payload="$RUNNER_TEMP/garden-payload.json"
          if [ ! -s "$payload" ]; then
            echo "::error::garden gate payload is missing or empty; collection was not completed"
            echo "Garden summary unavailable: the gate produced no complete payload." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! jq -e -s 'length == 1 and (.[0] |
            type == "object" and .schema == "fak-garden-bundle/1" and
            (.gate_exit == 0 or .gate_exit == 1) and
            (.gate_message | type == "string") and
            (.commit | type == "string") and
            (.next_action | type == "string") and
            (.members | type == "array"))' "$payload" > /dev/null; then
            echo "::error::garden gate payload is invalid or incomplete; refusing to recollect"
            echo "Garden summary unavailable: the captured gate payload is invalid or incomplete." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## garden bundle"
            echo '```'
            jq -r '.gate_message, ("Source commit: " + .commit), ("Next action: " + .next_action)' "$payload"
            echo '```'
            echo '<details><summary>control-pane payload</summary>'
            echo
            echo '```json'
            cat "$payload"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
