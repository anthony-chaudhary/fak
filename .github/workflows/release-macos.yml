name: release-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)build, notarize, and package macOS assets for"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: build-universal-and-notarize
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: auto
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build darwin/arm64 and darwin/amd64 binaries
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist/arm64 dist/amd64 dist/universal

          # Build arm64
          GOOS=darwin GOARCH=arm64 OUT="dist/arm64/fak" VERSION="${VERSION}" sh scripts/build.sh

          # Build amd64
          GOOS=darwin GOARCH=amd64 OUT="dist/amd64/fak" VERSION="${VERSION}" sh scripts/build.sh

          # Build darwin/arm64 with the Metal GPU backend. The per-command CGO_ENABLED=1
          # overrides the job-level CGO_ENABLED=0; internal/compute/metal.go is gated on
          # `darwin && arm64 && cgo` and compiles by default once cgo is on (no extra tag),
          # linking Metal.framework + MetalPerformanceShaders.framework (witnessed locally
          # via `otool -L`). build.sh is CGO-agnostic (env passthrough) so no changes there.
          mkdir -p dist/arm64-metal
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 OUT="dist/arm64-metal/fak" VERSION="${VERSION}" sh scripts/build.sh

          # Apple Silicon is the useful default slice: include the Metal-enabled
          # binary in the universal archive while retaining the CPU-only amd64
          # reference slice for Intel Macs.
          lipo -create -output dist/universal/fak dist/arm64-metal/fak dist/amd64/fak
          file dist/universal/fak

      - name: Sign macOS Universal Binary
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          APPLE_KEYCHAIN_PASS: ${{ secrets.APPLE_KEYCHAIN_PASS }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Importing Developer ID Certificate..."
            KEYCHAIN="build.keychain"
            security create-keychain -p "${APPLE_KEYCHAIN_PASS:-build}" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p "${APPLE_KEYCHAIN_PASS:-build}" "$KEYCHAIN"
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            security import certificate.p12 -k "$KEYCHAIN" -P "${APPLE_CERTIFICATE_PASS:-}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "${APPLE_KEYCHAIN_PASS:-build}" "$KEYCHAIN"
            codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" --timestamp dist/arm64-metal/fak
            codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" --timestamp dist/universal/fak
            codesign --verify --verbose dist/arm64-metal/fak
            codesign --verify --verbose dist/universal/fak
          else
            echo "Apple signing identity not configured; signing ad-hoc for local/CI validation"
            codesign --force --options runtime --sign - dist/arm64-metal/fak
            codesign --force --options runtime --sign - dist/universal/fak
          fi

      - name: Notarize macOS Binary with Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Submitting binary to Apple Notary Service..."
            ditto -c -k --keepParent dist/universal/fak dist/fak.zip
            xcrun notarytool submit dist/fak.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            ditto -c -k --keepParent dist/arm64-metal/fak dist/fak-metal.zip
            xcrun notarytool submit dist/fak-metal.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple dist/universal/fak || true
            xcrun stapler staple dist/arm64-metal/fak || true
          else
            echo "Apple notarization credentials not configured; skipping notarytool submission in unprovisioned environment"
          fi

      - name: Package Universal and per-arch Archives
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Coordination constant: the Metal asset filename is referenced verbatim by the
          # docs/install.sh wave; do not rename without syncing that wave. Defined once here
          # and handed to the upload step via the METAL_ARCHIVE/METAL_SUM env exports below.
          METAL_ASSET_NAME="fak_${VERSION}_darwin_arm64_metal.tar.gz"

          # Package universal binary
          cp LICENSE GETTING-STARTED.md dist/universal/
          ( cd dist/universal && tar -czf "../fak_${VERSION}_darwin_universal.tar.gz" . )
          # Emit the .sha256 sidecar with the BARE filename in its content (run shasum from
          # inside dist/): `sha256sum -c` resolves names relative to the sidecar's directory,
          # so a dist/-prefixed hash line breaks verification (quarantined v0.55.0).
          ( cd dist && shasum -a 256 "fak_${VERSION}_darwin_universal.tar.gz" > "fak_${VERSION}_darwin_universal.tar.gz.sha256" )

          # Package the separately signed/notarized Metal-enabled darwin/arm64 binary.
          cp LICENSE GETTING-STARTED.md dist/arm64-metal/
          ( cd dist/arm64-metal && tar -czf "../${METAL_ASSET_NAME}" . )
          # Bare-filename sidecar content, same reasoning as the universal sidecar above.
          ( cd dist && shasum -a 256 "${METAL_ASSET_NAME}" > "${METAL_ASSET_NAME}.sha256" )

          echo "UNIVERSAL_ARCHIVE=dist/fak_${VERSION}_darwin_universal.tar.gz" >> "$GITHUB_ENV"
          echo "UNIVERSAL_SUM=dist/fak_${VERSION}_darwin_universal.tar.gz.sha256" >> "$GITHUB_ENV"
          echo "METAL_ARCHIVE=dist/${METAL_ASSET_NAME}" >> "$GITHUB_ENV"
          echo "METAL_SUM=dist/${METAL_ASSET_NAME}.sha256" >> "$GITHUB_ENV"

      - name: Validate Homebrew Formula and Executable Functionality
        run: |
          set -euo pipefail
          ruby -c Formula/fak.rb
          # Test local execution and completions of built universal binary
          ./dist/universal/fak version
          ./dist/universal/fak completion bash >/dev/null
          ./dist/universal/fak completion zsh >/dev/null
          ./dist/universal/fak completion fish >/dev/null
          # The public GPU artifact must contain the compiled native Metal path.
          # The compute registry's `metal` entry is a separate opt-in MPS HAL and
          # is not the default pure-MSL model path, so framework linkage is the
          # correct packaged-binary assertion on hosted runners.
          ./dist/arm64-metal/fak version
          ./dist/arm64-metal/fak completion bash >/dev/null
          otool -L ./dist/arm64-metal/fak | grep -q '/Metal.framework/'
          otool -L ./dist/arm64-metal/fak | grep -q '/MetalPerformanceShaders.framework/'

      - name: Upload validated macOS binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Wait up to 2 min for release page if running concurrently
          for i in $(seq 1 24); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "release $TAG not visible yet (attempt $i/24); waiting 5s..."
            sleep 5
          done
          gh release upload "$TAG" "$UNIVERSAL_ARCHIVE" "$UNIVERSAL_SUM" --clobber
          gh release upload "$TAG" "$METAL_ARCHIVE" "$METAL_SUM" --clobber
