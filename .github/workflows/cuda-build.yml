# cuda-build.yml — the AUTOMATIC, GPU-FREE compile gate for the `-tags cuda` variant.
#
# WHY THIS EXISTS: the only other cuda CI is windows-cuda.yml — manual `workflow_dispatch`
# on a self-hosted GPU runner — so on a normal push NOTHING checks that the CUDA seam still
# compiles. A peer can break the cgo agreement between cuda_backend.h and cuda.go, or break a
# kernel in cuda_kernels.cu, and CI stays green until someone runs a manual GPU job. This
# workflow closes that gap with checks that need NO GPU and NO secrets, so they run on plain
# GitHub-hosted runners on every CUDA-touching push/PR.
#
# THE GPU-FREE BOUNDARY (why this is sound — see the infra review in docs/cuda-dev.md):
#   - `go vet -tags cuda` type-checks the cgo seam. The header is deliberately TOOLKIT-FREE
#     (only <stddef.h>/<stdint.h>, __half as void*), so a plain host compiler parses it with
#     no CUDA toolkit at all. This catches the most common real break (a signature changed in
#     cuda_backend.h but not in cuda.go) in seconds.
#   - The nvcc job COMPILES the kernels and LINKS `go build -tags cuda` against the -devel
#     image's cudart/cublas STUB libs. Nothing links -lcuda and the job NEVER runs the binary,
#     so no GPU / driver is ever needed — only fcuda_init()/cublasCreate() at RUN time need a
#     device, and that is the windows-cuda.yml / tools/cuda_acceptance.sh GPU lane, not here.
#   - The container is the FIRST automatic check of the uint8_t header-hygiene trap that
#     cuda_backend.h documents but only WSL currently hides (a datacenter toolchain does not
#     transitively pull <stdint.h>).
#
# NOT a required check while paths-filtered (a filtered required check deadlocks branch
# protection on PRs that touch none of the paths). It gates the people editing CUDA without
# blocking the PRs that don't.
name: cuda-build

on:
  push:
    paths:
      - "internal/compute/**"
      - "internal/model/**"
      - "tools/cuda_abi_parity.py"
      - "tools/cuda_acceptance.sh"
      - ".github/workflows/cuda-build.yml"
  pull_request:
    paths:
      - "internal/compute/**"
      - "internal/model/**"
      - "tools/cuda_abi_parity.py"
      - "tools/cuda_acceptance.sh"
      - ".github/workflows/cuda-build.yml"

permissions:
  contents: read

concurrency:
  group: cuda-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- cheap tier: hosted runner, NO CUDA toolkit, seconds ---------------------------------
  static:
    name: ABI parity · pure-Go guard · cgo type-check (-tags cuda, no toolkit)
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'anthony-chaudhary/fak' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The offline preflight (header <-> kernels <-> cgo binding, plus standalone
      # cuda_backend.h portability). No CUDA toolkit, no GPU; on hosted Ubuntu it also runs
      # the strict `gcc -fsyntax-only` parse of the header alone.
      - name: CUDA ABI/header preflight (build_cuda.sh check)
        run: bash internal/compute/build_cuda.sh check

      # DIRECTION reviewer check 3: the DEFAULT build must stay pure-Go and pull ZERO cgo
      # files, so the shipped artifact is one pure-Go binary. Today this guard lives only in
      # the MANUAL windows-cuda.yml job; here it runs automatically.
      - name: default build stays pure-Go (no cgo leak)
        run: |
          go build ./cmd/fak
          cgo="$(go list -f '{{.CgoFiles}}' ./internal/compute)"
          if [ "$cgo" != "[]" ]; then echo "default build pulled cgo files: $cgo"; exit 1; fi
          echo "default build pure-Go: OK"

      # The cgo type-check of the cuda seam — needs a C compiler (ubuntu ships gcc) but NO
      # CUDA toolkit, because the header is toolkit-free. Building the LIBRARY package does not
      # link the external cudart/cublas, so this passes GPU-free.
      - name: cgo type-check the cuda binding (go vet -tags cuda)
        run: go vet -tags cuda ./internal/compute/ ./internal/model/

  # ---- deep tier: nvcc container, NO GPU, paths-filtered -----------------------------------
  # A matrix over the arches whose codegen we must guard. sm_89 stays on the 12.6 line so it
  # AGREES with internal/compute/setup_cuda_wsl.sh's local-dev pin; the Blackwell arches
  # (sm_100 datacenter B200/GB200, sm_120 consumer) run on a 12.8 toolkit because the
  # compute_100/compute_120 targets simply do not exist in 12.6's nvcc. That is deliberate:
  # a tcgen05/TMEM/NVFP4 intrinsic that is invalid for Blackwell (added under #4189/#4190)
  # only fails to compile on the sm_100/sm_120 legs, which is the whole point of #4186.
  # fail-fast: false so one arch's break still lets the others report.
  nvcc:
    name: nvcc compile kernels (${{ matrix.arch }}) · go build -tags cuda (stub libs, no GPU)
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'anthony-chaudhary/fak' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: sm_89
            image: nvidia/cuda:12.6.2-devel-ubuntu22.04
          - arch: sm_100
            image: nvidia/cuda:12.8.1-devel-ubuntu22.04
          - arch: sm_120
            image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    # -devel ships nvcc + cuBLAS headers + the cudart/cublas stub libs the cgo link needs (no
    # GPU). The image is pinned per-arch (above) and documented; keep the arch set consistent
    # with internal/compute/cuda_arch.txt (the authoritative set) and Dockerfile.cuda. The
    # 12.8 pin for the Blackwell legs is intentionally NEWER than the 12.6 local-dev pin —
    # 12.6 cannot emit compute_100/compute_120 at all.
    container: ${{ matrix.image }}
    steps:
      - name: toolchain (the -devel image lacks git/build-essential by default)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Compile the kernels with build_cuda.sh's EXACT gencode shape for this arch so the gate
      # exercises the real build path: arch=compute_<cc>,code=sm_<cc> matches build_cuda.sh's
      # single-arch form (code=${ARCH}). The Blackwell legs additionally prove that
      # compute_100/compute_120 are reachable in the pinned toolkit.
      - name: nvcc compile cuda_kernels.cu -> libfakcuda.a (${{ matrix.arch }})
        working-directory: internal/compute
        run: |
          cc="${{ matrix.arch }}"; cc="${cc#sm_}"
          nvcc -O3 -std=c++14 -gencode "arch=compute_${cc},code=${{ matrix.arch }}" \
            -ccbin g++ -Xcompiler -fPIC -c cuda_kernels.cu -o cuda_kernels.o
          ar rcs libfakcuda.a cuda_kernels.o
          echo "built libfakcuda.a for ${{ matrix.arch }} ($(wc -c < libfakcuda.a) bytes)"

      # Link the -tags cuda variant against the resident archive + the image's cudart/cublas
      # STUB libs. This LINKS but never RUNS — no device is touched.
      - name: go build -tags cuda (cgo link, no GPU, no run)
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-I/usr/local/cuda/include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/internal/compute -L/usr/local/cuda/lib64"
        run: go build -tags cuda ./internal/compute/

      # #4186 DoD item 2 — the teeth-check. The compile step above proves this arch's codegen
      # is REACHABLE; this proves it has TEETH: nvcc must REJECT a Blackwell-invalid intrinsic
      # for this arch. cicc passes inline PTX through verbatim to ptxas, and ptxas only runs for
      # a concrete `code=sm_XX` SASS target — so a bogus tcgen05 mnemonic MUST fail nvcc here.
      # If nvcc instead exits 0, the leg is not doing real per-arch codegen and the gate is
      # toothless, so we FAIL the step. This runs GREEN on every CUDA-touching PR (the invalid
      # probe is EXPECTED to be rejected), which is a stronger, continuous form of the one-shot
      # "scratch-branch invalid-intrinsic" witness the issue described — GPU-free, no scratch
      # branch, self-verifying on trunk. The sm_100/sm_120 legs' logs are the DoD-2 witness.
      - name: negative-compile teeth-check — an invalid Blackwell intrinsic must fail nvcc (${{ matrix.arch }})
        working-directory: internal/compute
        run: |
          cc="${{ matrix.arch }}"; cc="${cc#sm_}"
          cat > _fak_blackwell_negative_probe.cu <<'PROBE'
          __global__ void fak_blackwell_negative_probe() {
              // Deliberately-invalid Blackwell tcgen05 mnemonic: ptxas must reject it for a
              // concrete SASS target. Inline PTX is passed through cicc verbatim to ptxas.
              asm volatile("tcgen05.not_a_real_mnemonic.b32;");
          }
          PROBE
          if nvcc -O3 -std=c++14 -gencode "arch=compute_${cc},code=${{ matrix.arch }}" \
               -ccbin g++ -Xcompiler -fPIC -c _fak_blackwell_negative_probe.cu -o _fak_probe.o 2>_fak_probe.log; then
            echo "TOOTHLESS: nvcc ACCEPTED an invalid Blackwell intrinsic for ${{ matrix.arch }} — the compile gate is not doing real per-arch codegen." >&2
            sed 's/^/  nvcc| /' _fak_probe.log || true
            exit 1
          fi
          echo "OK: nvcc REJECTED the invalid Blackwell intrinsic for ${{ matrix.arch }} — the compile gate has teeth. nvcc diagnostics:"
          sed 's/^/  nvcc| /' _fak_probe.log || true
          rm -f _fak_blackwell_negative_probe.cu _fak_probe.o _fak_probe.log
