# ci-fast: the release-critical CI SUBSET (issue #1374). This is the FAST
# decisive signal `tools/release_decide.py` gates on so an auto-cut on a green
# trunk no longer waits on the slow `-race` tail in ci.yml.
#
# It runs the same correctness-gating steps as ci.yml's build-vet-test job —
# build + vet + `go test ./...` WITHOUT `-race` — and nothing else. The slow
# `-race` job stays in ci.yml as a non-blocking post-merge guard: it still runs
# on every push, it just no longer sits on the release-decide critical path.
#
# Contract: release_decide reads this workflow's latest decisive (completed)
# conclusion on main — the RUN-level conclusion + headSha from `gh run list`
# (tools/release_context.py), never a job name. A
# green ci-fast run clears CI_BASE_RED even while the `-race` job in ci.yml is
# still in flight; a red ci-fast run still holds the cut. If this signal is
# missing/unknown, release_decide FALLS BACK to the whole ci.yml run, so a
# missing fast signal never cuts on a blind base.
#
# Shape (decisive on a 2-core hosted runner): the run's wall is the slowest test
# job, so the test set is divided by measured cost, not by package name. Eight
# package shards fill greedily from committed per-package seconds
# (.github/ci-fast-package-weights.json, via cmd/cifastshard); packages too slow
# to share a shard (CI_FAST_SPLIT_PACKAGES) instead run as disjoint `-run`
# buckets of their own `go test -list` names. build/vet/architest stay in one
# job; and the final `build-vet-test-fast` job (same id and check name as
# before) needs every job and is red unless all of them are green, so the run
# conclusion stays the one meaningful verdict. Its evidence check re-proves from
# the receipts alone that every package and every split test ran exactly once,
# so a stale weights file can only slow the gate, never shrink what it tests.
# Each test job runs `go test -timeout=20m` INSIDE a 35m step bound: a hung test
# binary dies as a decisive, diagnosable go-test failure (with its goroutine
# dump) before the runner kills the step.
name: ci-fast
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.intent == 'release' && inputs.sha != '' && 'ci-fast release' || (github.event_name == 'workflow_dispatch' && 'ci-fast diagnostic (non-release)' || 'ci-fast') }} · ${{ github.sha }}

on:
  push:
    branches: [main, master, fak-v0.1]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA for a diagnostic, non-release run"
        required: false
        type: string
      intent:
        description: "release = exact-sha release dispatch (requires sha); any other manual run is diagnostic, non-release"
        required: false
        default: "release"
        type: string

permissions:
  contents: read

# Queue control (CI/CD run-speed): converge each PR ref on its newest head.
# Normal PRs coalesce and cancel in-progress runs so obsolete runs don't waste
# capacity. Pushes to main and declared release intents (workflow_dispatch) run
# uncancelled (cancel-in-progress: false) so push churn cannot cancel in-flight
# trunk runs or starve release readiness (#12169, #7324).
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && (inputs.intent == 'release' || inputs.intent == '')) && format('release-{0}', inputs.sha != '' && inputs.sha || github.run_id) || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !(github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && (inputs.intent == 'release' || inputs.intent == ''))) }}

env:
  # The exact toolchain comes from go.mod (go 1.26); GOTOOLCHAIN=auto lets
  # `go` fetch it if the runner's Go is older.
  GOTOOLCHAIN: auto
  # Bound package/compiler fan-out to each job's explicit two-way runtime budget.
  # Matching -p to GOMAXPROCS lets independent packages make progress
  # without unbounded process pressure or changing the package/test set.
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2"
  # Live-tree ratchets grade the repository's current shape or history (god-file
  # LOC caps, the enum-exhaustiveness floor, lane-tree taxonomy parity, generated
  # verb-page freshness, live commit-subject parsing, the change-detector test
  # ratchet), not shipped behavior. Any unrelated landing can red them, which
  # held every release for 7+ main runs on 2026-10-12. The decisive shards skip exactly these names; ci.yml's full
  # `go test ./...` still runs them on every push. Receipts record the -skip argv
  # and the verifier refuses any other value. The list is pinned, name by name, by
  # internal/releasereadiness TestFastReleaseGateSkipsOnlyPinnedLiveTreeRatchets.
  CI_FAST_ADVISORY_TESTS: "^(TestLiveTreeUnderCeiling|TestTreeEnumExhaustivenessNotGrowing|TestLiveInternalGoPackagesResolveToExplicitLaneTrees|TestCheckedInPageIsFresh|TestLiveGitGatherIsWellFormed|TestTestSuitePolicy)$"
  # Each package here alone outlasts a whole shard, so the package shards skip it
  # and the matrix `split` entries run it as buckets. The evidence check refuses
  # a run where this list and the bucket jobs disagree.
  CI_FAST_SPLIT_PACKAGES: "./cmd/fak ./internal/agentbench/taskrun"

# These receipts bind checkout commits and reported job execution. They do not
# seal generated/untracked files or external Go inputs, and grant no release
# admission by themselves; trusted consumer qualification is tracked in #12373.
jobs:
  candidate:
    name: resolve immutable tested candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
      ci_class: ${{ steps.source.outputs.ci_class }}
    steps:
      - name: require an immutable requested revision
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_SHA" && ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full lowercase commit SHA, never a moving ref"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
      - name: bind actual commit and tree to this run
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          REQUESTED_INTENT: ${{ inputs.intent }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          expected=${REQUESTED_SHA:-$GITHUB_SHA}
          [[ "$sha" == "$expected" && "$sha" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ ]]
          ci_class=fast
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then ci_class=diagnostic; fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_INTENT" == release && -n "$REQUESTED_SHA" ]]; then ci_class=release; fi
          printf 'sha=%s\ntree=%s\nci_class=%s\n' "$sha" "$tree" "$ci_class" >> "$GITHUB_OUTPUT"
          printf 'Tested commit: %s\nTested tree: %s\nRepresented event SHA: %s\nCI class: %s\n' "$sha" "$tree" "$GITHUB_SHA" "$ci_class" >> "$GITHUB_STEP_SUMMARY"

  build-vet-fast:
    needs: candidate
    name: build · vet · tier gate (fast release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Build and all shards consume the one resolved immutable commit and tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          # Full history + tags: the release-substrate tests read the release
          # note AT the tag, which a default shallow checkout doesn't fetch.
          fetch-depth: 0

      - name: verify tested candidate identity
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.sha }}
          EXPECTED_TREE: ${{ needs.candidate.outputs.tree }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          printf 'sha=%s\ntree=%s\n' "$sha" "$tree" >> "$GITHUB_OUTPUT"
          [[ "$sha" == "$EXPECTED_SHA" && "$tree" == "$EXPECTED_TREE" ]]

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # zero external deps -> no go.sum to key a cache on

      - name: record verification environment
        shell: bash
        run: |
          go env -json GOVERSION GOOS GOARCH CGO_ENABLED GOFLAGS GOTOOLCHAIN | jq --arg gomaxprocs "$GOMAXPROCS" '. + {GOMAXPROCS:$gomaxprocs}' > "$RUNNER_TEMP/ci-fast-environment.json"

      # Build/test cache: share the SAME content-addressed GOCACHE key as
      # ci.yml's build-vet-test job (gobuild, non-race) so a warm cache skips
      # unchanged packages. A restored entry is never wrong — a miss just
      # rebuilds. Restore-only: ci.yml is the sole saver, and a multi-GiB
      # post-job save here would sit on the verdict's critical path.
      - name: cache Go build/test artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      # No Go/network dependency: proves the release-artifacts post-publish
      # checksum verifier (#1369) still catches a corrupted asset, on every
      # PR — not just when a real tag is cut.
      - name: verify-release-checksums self-test
        id: checksum
        run: bash .github/scripts/verify-release-checksums_test.sh

      - name: build
        id: build
        run: go build ./...

      - name: vet
        id: vet
        run: go vet ./...

      # The architest tier/root/chat-client gates read the repository filesystem;
      # run them uncached so a new internal leaf or a stale tier-table row cannot
      # inherit a cached PASS from a previous commit.
      - name: architest tier gate (uncached)
        id: tier
        run: go test -count=1 ./internal/architest/ -run '^(TestEveryPackageDeclaresTier|TestNoUpwardImports|TestRootImportsNothingInternal|TestSingleOpenAIChatClient)$'

      - name: record exact job provenance
        if: always()
        shell: bash
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          TESTED_TREE: ${{ steps.source.outputs.tree }}
          CI_CLASS: ${{ needs.candidate.outputs.ci_class }}
          REQUESTED_INTENT: ${{ inputs.intent }}
          JOB_RESULT: ${{ job.status }}
          JOB_ID: build-vet-fast
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" && "$(git rev-parse HEAD^{tree})" == "$TESTED_TREE" ]]
          test -s "$RUNNER_TEMP/ci-fast-environment.json" || echo '{}' > "$RUNNER_TEMP/ci-fast-environment.json"
          # Test lists outgrow one argv string, so receipts are assembled from files.
          commands_file="$RUNNER_TEMP/ci-fast-commands.json"
          coverage_file="$RUNNER_TEMP/ci-fast-coverage.json"
          if [[ "$JOB_ID" == build-vet-fast ]]; then
            echo '[["bash",".github/scripts/verify-release-checksums_test.sh"],["go","build","./..."],["go","vet","./..."],["go","test","-count=1","./internal/architest/","-run","^(TestEveryPackageDeclaresTier|TestNoUpwardImports|TestRootImportsNothingInternal|TestSingleOpenAIChatClient)$"]]' > "$commands_file"
            echo '{"kind":"build-vet","package_scope":"./..."}' > "$coverage_file"
          else
            for name in packages shard-packages split-packages all-tests bucket-tests go-test-args; do
              test -f "$RUNNER_TEMP/ci-fast-$name.txt" || : > "$RUNNER_TEMP/ci-fast-$name.txt"
              jq -Rs 'split("\n") | map(select(length > 0))' "$RUNNER_TEMP/ci-fast-$name.txt" > "$RUNNER_TEMP/ci-fast-$name.json"
            done
            jq '. + {FAK_REQUIRE_OPENAPI_VALIDATOR:"1"}' "$RUNNER_TEMP/ci-fast-environment.json" > "$RUNNER_TEMP/ci-fast-environment-complete.json"
            mv "$RUNNER_TEMP/ci-fast-environment-complete.json" "$RUNNER_TEMP/ci-fast-environment.json"
            jq -n --arg skip "$CI_FAST_ADVISORY_TESTS" --slurpfile args "$RUNNER_TEMP/ci-fast-go-test-args.json" '[["go","test","-timeout=20m","-skip",$skip] + $args[0]]' > "$commands_file"
            if [[ -n "$SPLIT" ]]; then
              jq -n --slurpfile packages "$RUNNER_TEMP/ci-fast-shard-packages.json" --slurpfile tests "$RUNNER_TEMP/ci-fast-bucket-tests.json" \
                --slurpfile all_tests "$RUNNER_TEMP/ci-fast-all-tests.json" --argjson index "$((BUCKET - 1))" --argjson total "$BUCKETS" \
                '{kind:"go-test-bucket",package:($packages[0][0] // ""),bucket_index:$index,bucket_total:$total,tests:$tests[0],all_tests:$all_tests[0]}' > "$coverage_file"
            else
              jq -n --slurpfile packages "$RUNNER_TEMP/ci-fast-shard-packages.json" --slurpfile all_packages "$RUNNER_TEMP/ci-fast-packages.json" \
                --slurpfile split_packages "$RUNNER_TEMP/ci-fast-split-packages.json" --argjson index "$((SHARD - 1))" --argjson total "$SHARDS" \
                '{kind:"go-test-shard",shard_index:$index,shard_total:$total,packages:$packages[0],all_packages:$all_packages[0],split_packages:$split_packages[0]}' > "$coverage_file"
            fi
          fi
          jq -n --arg job "$JOB_ID" --arg sha "$TESTED_SHA" --arg tree "$TESTED_TREE" \
            --arg represented "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg ci_class "$CI_CLASS" \
            --arg intent "$REQUESTED_INTENT" --arg result "$JOB_RESULT" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg runner_os "$RUNNER_OS" --arg runner_arch "$RUNNER_ARCH" \
            --slurpfile commands "$commands_file" --slurpfile coverage "$coverage_file" --argjson steps "$STEPS_JSON" \
            --slurpfile environment "$RUNNER_TEMP/ci-fast-environment.json" \
            '{schema:"fak.ci-provenance.v1",workflow:"ci-fast",job:$job,tested_sha:$sha,tested_tree:$tree,represented_sha:$represented,event:$event,ref:$ref,run_id:$run,run_attempt:$attempt,ci_class:$ci_class,requested_intent:$intent,result:$result,release_eligible:false,source_scope:"git-commit-tree",effective_inputs_verified:false,workflow_ref:$workflow_ref,workflow_sha:$workflow_sha,runner:{os:$runner_os,arch:$runner_arch},commands:$commands[0],coverage:$coverage[0],environment:$environment[0],steps:($steps | with_entries(.value |= {outcome,conclusion}))}' \
            > "$RUNNER_TEMP/ci-fast-$JOB_ID.json"
      - name: upload job provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-job-${{ github.run_id }}-${{ github.run_attempt }}-build-vet-fast
          path: ${{ runner.temp }}/ci-fast-build-vet-fast.json
          if-no-files-found: error

  go-test-shard:
    needs: candidate
    name: go test ./... (no -race) · ${{ matrix.split && format('{0} bucket {1}/{2}', matrix.split, matrix.bucket, matrix.buckets) || format('shard {0}/{1}', matrix.shard, matrix.shards) }}
    runs-on: ubuntu-latest
    # Outlasts the 35m step bound below, so the step (not the job) is what ends
    # a stuck shard and the failure keeps its step identity in the run log.
    timeout-minutes: 45
    strategy:
      # Every shard runs to its own verdict: one red shard must not cancel the
      # others and hide their failures from the same run.
      fail-fast: false
      matrix:
        # A shard entry runs its share of the weighted package partition; a
        # split entry runs one bucket of a CI_FAST_SPLIT_PACKAGES package. The
        # verdict job pins the job count and proves the numbers here cover each
        # package and each split test exactly once, so a typo cannot drop work.
        include:
          - { shard: 1, shards: 8 }
          - { shard: 2, shards: 8 }
          - { shard: 3, shards: 8 }
          - { shard: 4, shards: 8 }
          - { shard: 5, shards: 8 }
          - { shard: 6, shards: 8 }
          - { shard: 7, shards: 8 }
          - { shard: 8, shards: 8 }
          - { split: ./cmd/fak, bucket: 1, buckets: 4 }
          - { split: ./cmd/fak, bucket: 2, buckets: 4 }
          - { split: ./cmd/fak, bucket: 3, buckets: 4 }
          - { split: ./cmd/fak, bucket: 4, buckets: 4 }
          - { split: ./internal/agentbench/taskrun, bucket: 1, buckets: 2 }
          - { split: ./internal/agentbench/taskrun, bucket: 2, buckets: 2 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          # Full history + tags: the release-substrate tests read the release
          # note AT the tag, which a default shallow checkout doesn't fetch.
          fetch-depth: 0

      - name: verify tested candidate identity
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.sha }}
          EXPECTED_TREE: ${{ needs.candidate.outputs.tree }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          printf 'sha=%s\ntree=%s\n' "$sha" "$tree" >> "$GITHUB_OUTPUT"
          [[ "$sha" == "$EXPECTED_SHA" && "$tree" == "$EXPECTED_TREE" ]]

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # zero external deps -> no go.sum to key a cache on

      - name: record verification environment
        shell: bash
        run: |
          go env -json GOVERSION GOOS GOARCH CGO_ENABLED GOFLAGS GOTOOLCHAIN | jq --arg gomaxprocs "$GOMAXPROCS" '. + {GOMAXPROCS:$gomaxprocs}' > "$RUNNER_TEMP/ci-fast-environment.json"

      # Restore-only: every shard starts from the shared gobuild GOCACHE key
      # (ci.yml build-vet-test saves it). Shards never save, so N parallel jobs
      # do not multiply the repository's cache footprint.
      - name: restore Go build/test cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      - name: install pinned OpenAPI validator
        run: python -m pip install --quiet --disable-pip-version-check PyYAML==6.0.2 openapi-spec-validator==0.7.2

      # The correctness gate: the same `go test ./...` package set as ci.yml,
      # WITHOUT `-race`. A shard runs its weighted share of `go list ./...` minus
      # the split packages; a bucket runs one disjoint `-run` slice of a split
      # package's `go test -list` names (sorted, name i in bucket i mod N). Every
      # job checks out the same commit, so all derive from one package list. The
      # exact argv is written out for the provenance receipt. Keep the command
      # observable: hosted runners have otherwise ended a 20-minute silent step
      # without retaining the package failure output (#6982). -timeout=20m is the
      # per-test-binary bound (the default 10m already clipped cmd/fak at
      # 600.06s); the 35m step bound outlasts it plus compile/link.
      - name: go test ./... (no -race)
        id: tests
        timeout-minutes: 35
        shell: bash
        env:
          FAK_REQUIRE_OPENAPI_VALIDATOR: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          SPLIT: ${{ matrix.split }}
          BUCKET: ${{ matrix.bucket }}
          BUCKETS: ${{ matrix.buckets }}
        run: |
          set -uo pipefail
          all_file="$RUNNER_TEMP/ci-fast-packages.txt"
          shard_file="$RUNNER_TEMP/ci-fast-shard-packages.txt"
          split_file="$RUNNER_TEMP/ci-fast-split-packages.txt"
          args_file="$RUNNER_TEMP/ci-fast-go-test-args.txt"
          if ! go list ./... > "$all_file" || ! go list $CI_FAST_SPLIT_PACKAGES > "$split_file"; then
            echo "::error::go list failed; cannot partition the package set"
            exit 1
          fi
          if [ -n "$SPLIT" ]; then
            label="$SPLIT bucket $BUCKET/$BUCKETS"
            tests_file="$RUNNER_TEMP/ci-fast-all-tests.txt"
            bucket_file="$RUNNER_TEMP/ci-fast-bucket-tests.txt"
            if ! go list "$SPLIT" > "$shard_file" || ! go test -list '.*' "$SPLIT" > "$RUNNER_TEMP/ci-fast-test-list.txt"; then
              echo "::error::$label: cannot list the tests of $SPLIT"
              exit 1
            fi
            # A listed name the ASCII pattern cannot select would otherwise vanish
            # from both the buckets and the evidence universe.
            if ! LC_ALL=C awk '/^(Test|Benchmark|Example|Fuzz)/ && !/^(Test|Benchmark|Example|Fuzz)[A-Za-z0-9_]*$/ { print "::error::unselectable test name: " $0; bad = 1 } END { exit bad }' "$RUNNER_TEMP/ci-fast-test-list.txt"; then
              exit 1
            fi
            grep -E '^(Test|Benchmark|Example|Fuzz)[A-Za-z0-9_]*$' "$RUNNER_TEMP/ci-fast-test-list.txt" | LC_ALL=C sort -u > "$tests_file"
            if ! go run ./cmd/cifastshard buckets -buckets "$BUCKETS" -index "$((BUCKET - 1))" < "$tests_file" > "$bucket_file" || [ ! -s "$bucket_file" ]; then
              echo "::error::$label selected no tests from go test -list"
              exit 1
            fi
            run_regex="^($(paste -sd'|' "$bucket_file"))\$"
            # Linux caps one argv string at 128 KiB; fail here, not as an exec error.
            if [ "${#run_regex}" -gt 120000 ]; then
              echo "::error::$label -run pattern is ${#run_regex} bytes; raise the bucket count for $SPLIT"
              exit 1
            fi
            go_test_args=(-run "$run_regex" "$(cat "$shard_file")")
            echo "$label: $(wc -l < "$bucket_file") of $(wc -l < "$tests_file") top-level tests at $(git rev-parse HEAD)"
          else
            label="shard $SHARD/$SHARDS"
            if ! go run ./cmd/cifastshard partition -weights .github/ci-fast-package-weights.json -shards "$SHARDS" -index "$((SHARD - 1))" -exclude-file "$split_file" < "$all_file" > "$shard_file" || [ ! -s "$shard_file" ]; then
              echo "::error::$label selected no packages from go list ./..."
              exit 1
            fi
            mapfile -t go_test_args < "$shard_file"
            echo "$label: $(wc -l < "$shard_file") of $(wc -l < "$all_file") packages at $(git rev-parse HEAD)"
          fi
          printf '%s\n' "${go_test_args[@]}" > "$args_file"
          status_file="$RUNNER_TEMP/ci-fast-go-test.status"
          (
            set +e
            go test -timeout=20m -skip "$CI_FAST_ADVISORY_TESTS" "${go_test_args[@]}" 2>&1 | tee "$RUNNER_TEMP/ci-fast-go-test.log"
            printf '%s\n' "${PIPESTATUS[0]}" > "$status_file"
          ) &
          test_pid=$!
          while kill -0 "$test_pid" 2>/dev/null; do
            sleep 60
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "::notice::go test ./... $label is still running ($(date -u +%FT%TZ))"
            fi
          done
          wait "$test_pid" || true
          test -s "$status_file"
          exit "$(cat "$status_file")"

      - name: record exact job provenance
        if: always()
        shell: bash
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          TESTED_TREE: ${{ steps.source.outputs.tree }}
          CI_CLASS: ${{ needs.candidate.outputs.ci_class }}
          REQUESTED_INTENT: ${{ inputs.intent }}
          JOB_RESULT: ${{ job.status }}
          JOB_ID: go-test-shard-${{ strategy.job-index }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          SPLIT: ${{ matrix.split }}
          BUCKET: ${{ matrix.bucket }}
          BUCKETS: ${{ matrix.buckets }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" && "$(git rev-parse HEAD^{tree})" == "$TESTED_TREE" ]]
          test -s "$RUNNER_TEMP/ci-fast-environment.json" || echo '{}' > "$RUNNER_TEMP/ci-fast-environment.json"
          # Test lists outgrow one argv string, so receipts are assembled from files.
          commands_file="$RUNNER_TEMP/ci-fast-commands.json"
          coverage_file="$RUNNER_TEMP/ci-fast-coverage.json"
          if [[ "$JOB_ID" == build-vet-fast ]]; then
            echo '[["bash",".github/scripts/verify-release-checksums_test.sh"],["go","build","./..."],["go","vet","./..."],["go","test","-count=1","./internal/architest/","-run","^(TestEveryPackageDeclaresTier|TestNoUpwardImports|TestRootImportsNothingInternal|TestSingleOpenAIChatClient)$"]]' > "$commands_file"
            echo '{"kind":"build-vet","package_scope":"./..."}' > "$coverage_file"
          else
            for name in packages shard-packages split-packages all-tests bucket-tests go-test-args; do
              test -f "$RUNNER_TEMP/ci-fast-$name.txt" || : > "$RUNNER_TEMP/ci-fast-$name.txt"
              jq -Rs 'split("\n") | map(select(length > 0))' "$RUNNER_TEMP/ci-fast-$name.txt" > "$RUNNER_TEMP/ci-fast-$name.json"
            done
            jq '. + {FAK_REQUIRE_OPENAPI_VALIDATOR:"1"}' "$RUNNER_TEMP/ci-fast-environment.json" > "$RUNNER_TEMP/ci-fast-environment-complete.json"
            mv "$RUNNER_TEMP/ci-fast-environment-complete.json" "$RUNNER_TEMP/ci-fast-environment.json"
            jq -n --arg skip "$CI_FAST_ADVISORY_TESTS" --slurpfile args "$RUNNER_TEMP/ci-fast-go-test-args.json" '[["go","test","-timeout=20m","-skip",$skip] + $args[0]]' > "$commands_file"
            if [[ -n "$SPLIT" ]]; then
              jq -n --slurpfile packages "$RUNNER_TEMP/ci-fast-shard-packages.json" --slurpfile tests "$RUNNER_TEMP/ci-fast-bucket-tests.json" \
                --slurpfile all_tests "$RUNNER_TEMP/ci-fast-all-tests.json" --argjson index "$((BUCKET - 1))" --argjson total "$BUCKETS" \
                '{kind:"go-test-bucket",package:($packages[0][0] // ""),bucket_index:$index,bucket_total:$total,tests:$tests[0],all_tests:$all_tests[0]}' > "$coverage_file"
            else
              jq -n --slurpfile packages "$RUNNER_TEMP/ci-fast-shard-packages.json" --slurpfile all_packages "$RUNNER_TEMP/ci-fast-packages.json" \
                --slurpfile split_packages "$RUNNER_TEMP/ci-fast-split-packages.json" --argjson index "$((SHARD - 1))" --argjson total "$SHARDS" \
                '{kind:"go-test-shard",shard_index:$index,shard_total:$total,packages:$packages[0],all_packages:$all_packages[0],split_packages:$split_packages[0]}' > "$coverage_file"
            fi
          fi
          jq -n --arg job "$JOB_ID" --arg sha "$TESTED_SHA" --arg tree "$TESTED_TREE" \
            --arg represented "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg ci_class "$CI_CLASS" \
            --arg intent "$REQUESTED_INTENT" --arg result "$JOB_RESULT" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg runner_os "$RUNNER_OS" --arg runner_arch "$RUNNER_ARCH" \
            --slurpfile commands "$commands_file" --slurpfile coverage "$coverage_file" --argjson steps "$STEPS_JSON" \
            --slurpfile environment "$RUNNER_TEMP/ci-fast-environment.json" \
            '{schema:"fak.ci-provenance.v1",workflow:"ci-fast",job:$job,tested_sha:$sha,tested_tree:$tree,represented_sha:$represented,event:$event,ref:$ref,run_id:$run,run_attempt:$attempt,ci_class:$ci_class,requested_intent:$intent,result:$result,release_eligible:false,source_scope:"git-commit-tree",effective_inputs_verified:false,workflow_ref:$workflow_ref,workflow_sha:$workflow_sha,runner:{os:$runner_os,arch:$runner_arch},commands:$commands[0],coverage:$coverage[0],environment:$environment[0],steps:($steps | with_entries(.value |= {outcome,conclusion}))}' \
            > "$RUNNER_TEMP/ci-fast-$JOB_ID.json"
      - name: upload job provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-job-${{ github.run_id }}-${{ github.run_attempt }}-go-test-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-fast-go-test-shard-${{ strategy.job-index }}.json
          if-no-files-found: error

  # The single verdict job, kept at the pre-shard job id and check name. It runs
  # whenever the run itself was not cancelled — including after a failed or
  # timed-out dependency — and is red unless build/vet/architest AND every go
  # test shard concluded success, so a skipped or cancelled shard can never pass
  # as green. A cancelled run (PR supersession) skips it and stays indecisive.
  build-vet-test-fast:
    name: ${{ github.event_name == 'workflow_dispatch' && 'diagnostic · build · vet · test (non-release)' || 'build · vet · test (no -race, fast release gate)' }}
    needs: [candidate, build-vet-fast, go-test-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Keep this step's name and text free of the step/cause keywords the
      # release-status classifiers match (vet, architest, cache, timeout, ...):
      # the failing shard or gate job carries the real cause, and this verdict
      # step should only ever read as the go test gate.
      - name: require every go test shard and the build gate green
        shell: bash
        env:
          BUILD_VET_RESULT: ${{ needs.build-vet-fast.result }}
          GO_TEST_SHARDS_RESULT: ${{ needs.go-test-shard.result }}
        run: |
          echo "build-vet-fast: $BUILD_VET_RESULT"
          echo "go-test-shard (all shards): $GO_TEST_SHARDS_RESULT"
          if [ "$BUILD_VET_RESULT" != "success" ] || [ "$GO_TEST_SHARDS_RESULT" != "success" ]; then
            echo "::error::fast release gate is red: build-vet-fast=$BUILD_VET_RESULT, go-test-shard=$GO_TEST_SHARDS_RESULT"
            exit 1
          fi
      - name: collect exact job provenance
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: ci-fast-job-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/ci-fast-provenance
          merge-multiple: true
      - name: verify complete candidate evidence
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.sha }}
          EXPECTED_TREE: ${{ needs.candidate.outputs.tree }}
          CI_CLASS: ${{ needs.candidate.outputs.ci_class }}
          REQUESTED_INTENT: ${{ inputs.intent }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          BUILD_VET_RESULT: ${{ needs.build-vet-fast.result }}
          GO_TEST_SHARDS_RESULT: ${{ needs.go-test-shard.result }}
        run: |
          # ci-provenance: verify-fast-begin
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP/ci-fast-provenance/"*.json)
          qualified=false
          if [[ "$CANDIDATE_RESULT" == success && "$BUILD_VET_RESULT" == success && "$GO_TEST_SHARDS_RESULT" == success && ${#files[@]} == 15 ]]; then
            qualified=$(jq -se --arg sha "$EXPECTED_SHA" --arg tree "$EXPECTED_TREE" \
              --arg represented "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
              --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg ci_class "$CI_CLASS" \
              --arg intent "$REQUESTED_INTENT" --arg skip "$CI_FAST_ADVISORY_TESTS" '
              ([.[] | select(.job == "build-vet-fast")][0].environment) as $environment |
              [.[] | select(.coverage.kind == "go-test-shard")] as $shards |
              [.[] | select(.coverage.kind == "go-test-bucket")] as $buckets |
              ($shards[0].coverage.all_packages) as $all |
              ($shards[0].coverage.split_packages) as $split |
              ($sha | test("^[0-9a-f]{40}$")) and ($tree | test("^[0-9a-f]{40}$")) and
              ($run | test("^[1-9][0-9]*$")) and ($attempt | test("^[1-9][0-9]*$")) and
              (($event == "workflow_dispatch" and ($ci_class == "diagnostic" or ($ci_class == "release" and $intent == "release"))) or (($event == "push" or $event == "pull_request") and $ci_class == "fast" and $sha == $represented)) and
              (map(.job) | sort == (["build-vet-fast"] + [range(14) | "go-test-shard-\(.)"] | sort)) and
              ($all | type == "array" and length >= 4 and length == (unique | length) and all(.[]; type == "string" and length > 0)) and
              ($split | type == "array" and length >= 1 and length == (unique | length)) and
              ($shards | length == 8) and ([$shards[].coverage.shard_index] | sort == [range(8)]) and
              (([$shards[].coverage.packages[]] + $split | sort) == ($all | sort)) and
              ([$buckets[].coverage.package] | unique == ($split | sort)) and
              all($split[]; . as $p | [$buckets[] | select(.coverage.package == $p)] as $b | ($b[0].coverage.all_tests) as $tests |
                ($tests | type == "array" and length >= 1 and length == (unique | length) and all(.[]; type == "string" and test("^(Test|Benchmark|Example|Fuzz)[A-Za-z0-9_]*$"))) and
                ([$b[].coverage.bucket_index] | sort == [range($b | length)]) and
                all($b[]; .coverage.bucket_total == ($b | length) and .coverage.all_tests == $tests) and
                (([$b[].coverage.tests[]] | sort) == ($tests | sort))) and
              all(.[];
                .schema == "fak.ci-provenance.v1" and .workflow == "ci-fast" and .result == "success" and .release_eligible == false and
                .source_scope == "git-commit-tree" and .effective_inputs_verified == false and
                .tested_sha == $sha and .tested_tree == $tree and .represented_sha == $represented and .event == $event and .ref == $ref and
                .run_id == $run and .run_attempt == $attempt and .ci_class == $ci_class and .requested_intent == $intent and
                (.environment | [.GOVERSION,.GOOS,.GOARCH,.CGO_ENABLED,.GOFLAGS,.GOTOOLCHAIN,.GOMAXPROCS] | all(.[]; type == "string" and length > 0)) and
                .environment.GOFLAGS == "-p=2" and .environment.GOMAXPROCS == "2" and .environment.GOTOOLCHAIN == "auto" and
                (.environment | del(.FAK_REQUIRE_OPENAPI_VALIDATOR)) == $environment and
                (if .job == "build-vet-fast" then
                  .steps as $steps | all(["checksum","build","vet","tier"][]; $steps[.].outcome == "success" and $steps[.].conclusion == "success") and
                  .coverage == {kind:"build-vet",package_scope:"./..."} and
                  .commands == [["bash",".github/scripts/verify-release-checksums_test.sh"],["go","build","./..."],["go","vet","./..."],["go","test","-count=1","./internal/architest/","-run","^(TestEveryPackageDeclaresTier|TestNoUpwardImports|TestRootImportsNothingInternal|TestSingleOpenAIChatClient)$"]]
                elif .coverage.kind == "go-test-shard" then
                  .steps.tests.outcome == "success" and .steps.tests.conclusion == "success" and
                  (.coverage as $c | .environment.FAK_REQUIRE_OPENAPI_VALIDATOR == "1" and $c.shard_total == 8 and
                  ($c.shard_index | type == "number" and . >= 0 and . < 8 and . == floor) and
                  .job == ("go-test-shard-" + ($c.shard_index|tostring)) and $c.all_packages == $all and $c.split_packages == $split and
                  ($c.packages | type == "array" and length >= 1) and
                  .commands == [["go","test","-timeout=20m","-skip",$skip] + $c.packages])
                elif .coverage.kind == "go-test-bucket" then
                  .steps.tests.outcome == "success" and .steps.tests.conclusion == "success" and
                  (.coverage as $c | .environment.FAK_REQUIRE_OPENAPI_VALIDATOR == "1" and
                  ($c.bucket_index | type == "number" and . >= 0 and . == floor) and
                  ($c.tests | type == "array" and length >= 1) and
                  .commands == [["go","test","-timeout=20m","-skip",$skip,"-run",("^(" + ($c.tests | join("|")) + ")$"),$c.package]])
                else false
                end))' "${files[@]}" || echo false)
          fi
          [[ "$qualified" == true ]] || qualified=false
          jq -n --argjson qualified "$qualified" --arg sha "$EXPECTED_SHA" --arg tree "$EXPECTED_TREE" \
            --arg represented "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg ci_class "$CI_CLASS" --arg intent "$REQUESTED_INTENT" \
            '{schema:"fak.ci-provenance.v1",workflow:"ci-fast",ci_class:$ci_class,requested_intent:$intent,tested_sha:$sha,tested_tree:$tree,represented_sha:$represented,event:$event,ref:$ref,run_id:$run,run_attempt:$attempt,required_jobs:(["build-vet-fast"] + [range(14) | "go-test-shard-\(.)"]),verified:$qualified,release_eligible:false,source_scope:"git-commit-tree",effective_inputs_verified:false,release_ineligibility_reason:(if $event == "workflow_dispatch" then "diagnostic-run" elif $qualified then "effective-input-identity-not-sealed" else "incomplete-evidence" end)}' \
            > "$RUNNER_TEMP/ci-fast-provenance.json"
          cat "$RUNNER_TEMP/ci-fast-provenance.json" >> "$GITHUB_STEP_SUMMARY"
          # Successful jobs from an earlier attempt are deliberately not reused.
          if [[ "$qualified" != true ]]; then
            echo "::error::CI provenance incomplete or mismatched. Re-run all jobs to produce one complete run attempt."
            exit 1
          fi
          # ci-provenance: verify-fast-end
      - name: upload aggregate provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-fast-provenance.json
          if-no-files-found: error
