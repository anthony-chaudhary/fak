            'heavy-1 cmd/fak/startuptest,internal/unwiredscore - -'
            'heavy-2 experiments/negframe-steerability-ab,internal/seoaeoscore - -'
            'heavy-3 internal/serverlifecycle,internal/enumlint - -'
            'heavy-4 internal/debtlane,cmd/fak-dev,cmd/fak-validate - -'
            'heavy-5 internal/selfupdate,internal/boundarylint,internal/agentbench,experiments/qwen36/gdn-quant-length-sensitivity - -'
            'heavy-6 cmd/agenticbench,internal/allinone,cmd/verbsdoc,cmd/cfgprobe,internal/toolproc,internal/validate - -'
