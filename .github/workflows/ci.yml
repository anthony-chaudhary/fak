          : > "$RUNNER_TEMP/excluded.txt"
          for l in "${legs[@]}"; do
            read -r name p _ _ <<< "$l"
            for rel in ${p//,/ }; do printf '%s/%s\n' "$mod" "$rel" >> "$RUNNER_TEMP/excluded.txt"; done
          done
          pkgs=""; run="-"; skip="-"
          for l in "${legs[@]}"; do
            read -r name p r s <<< "$l"
            if [[ "$name" == "$SHARD" ]]; then pkgs="$p"; run="$r"; skip="$s"; fi
          done
          if [[ -n "$pkgs" ]]; then
            for rel in ${pkgs//,/ }; do printf '%s/%s\n' "$mod" "$rel"; done > "$RUNNER_TEMP/race-packages.txt"
          elif [[ "$SHARD" =~ ^rest-[0-9]+$ ]]; then
            go list ./... | grep -vxF -f "$RUNNER_TEMP/excluded.txt" \
              | awk -v n="$RACE_REST_SHARDS" -v i="${SHARD#rest-}" '(NR-1)%n==i' > "$RUNNER_TEMP/race-packages.txt"
          else
            echo "::error::unknown race shard $SHARD"; exit 1
          fi
          test -s "$RUNNER_TEMP/race-packages.txt"
          {
            if [[ "$run" != "-" ]]; then printf '%s\n' -run "$run"; fi
            if [[ "$skip" != "-" ]]; then printf '%s\n' -skip "$skip"; fi
            cat "$RUNNER_TEMP/race-packages.txt"
          } > "$RUNNER_TEMP/race-args.txt"
          echo "shard $SHARD: $(wc -l < "$RUNNER_TEMP/race-packages.txt") packages, run=$run skip=${skip:0:40}"

      - name: go test -race <shard> (zero data races)
        id: race_tests
        shell: bash
        # -count=1 forces a real, uncached run — the honest "fresh read-back" of
        # the race-free claim on every push/PR, never a cached green from before.
        # -timeout=25m: ThreadSanitizer instrumentation makes CPU-bound packages
        # 5-10x slower than plain go test. This only grants wall-clock; it
        # changes nothing about which tests run.
        run: |
          set -euo pipefail
          mapfile -t args < "$RUNNER_TEMP/race-args.txt"
          go test -race -count=1 -timeout=25m "${args[@]}"

      - name: record exact verification provenance
        if: always()
        shell: bash
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          TESTED_TREE: ${{ steps.source.outputs.tree }}
          JOB_RESULT: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_ID: race-detector
          CI_CLASS: full
          CORE_COMMANDS_JSON: '[["go","test","-race","-count=1","-timeout=25m","./..."]]'
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" && "$(git rev-parse HEAD^{tree})" == "$TESTED_TREE" ]]
          test -s "$RUNNER_TEMP/ci-environment.json" || echo '{}' > "$RUNNER_TEMP/ci-environment.json"
          if [[ "$JOB_ID" != race-detector ]]; then
            jq '. + {FAK_REQUIRE_OPENAPI_VALIDATOR:"1"}' "$RUNNER_TEMP/ci-environment.json" > "$RUNNER_TEMP/ci-environment-complete.json"
            mv "$RUNNER_TEMP/ci-environment-complete.json" "$RUNNER_TEMP/ci-environment.json"
          fi
          commands="$CORE_COMMANDS_JSON"
          if [[ -s "$RUNNER_TEMP/race-args.txt" ]]; then
            commands=$(jq -Rn '[["go","test","-race","-count=1","-timeout=25m"] + [inputs]]' < "$RUNNER_TEMP/race-args.txt")
          fi
          if [[ "$CI_CLASS" == diagnostic ]]; then
            if [[ -f "$RUNNER_TEMP/ci-routed-command.json" ]]; then commands=$(cat "$RUNNER_TEMP/ci-routed-command.json"); else commands='[]'; fi
          fi
          jq -n --arg job "$JOB_ID" --arg sha "$TESTED_SHA" --arg tree "$TESTED_TREE" \
            --arg represented "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg ci_class "$CI_CLASS" \
            --arg result "$JOB_RESULT" --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg runner_os "$RUNNER_OS" --arg runner_arch "$RUNNER_ARCH" \
            --argjson commands "$commands" --argjson steps "$STEPS_JSON" --slurpfile environment "$RUNNER_TEMP/ci-environment.json" \
            '{schema:"fak.ci-provenance.v1",workflow:"ci",job:$job,tested_sha:$sha,tested_tree:$tree,represented_sha:$represented,event:$event,ref:$ref,run_id:$run,run_attempt:$attempt,ci_class:$ci_class,result:$result,release_eligible:false,source_scope:"git-commit-tree",effective_inputs_verified:false,workflow_ref:$workflow_ref,workflow_sha:$workflow_sha,runner:{os:$runner_os,arch:$runner_arch},commands:$commands,coverage:{scope:"core-verification-commands",job:$job},environment:$environment[0],steps:($steps | with_entries(.value |= {outcome,conclusion}))}' \
            > "$RUNNER_TEMP/ci-$JOB_ID.json"
          cat "$RUNNER_TEMP/ci-$JOB_ID.json" >> "$GITHUB_STEP_SUMMARY"
      - name: upload job provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-${{ github.run_id }}-${{ github.run_attempt }}-race-detector-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-race-detector.json
          if-no-files-found: error

  # head-snapshot-build (#966): the build-vet-test job above builds the TIP of a
  # push. On this high-churn shared trunk a single push often carries SEVERAL
  # commits from a fast session, and a peer who pulls and lands on an INTERMEDIATE
  # commit gets whatever that commit's tree compiles to — not the tip's. The escape
  # #966 names (a path-scoped commit that referenced a symbol whose definition was
  # only in the author's uncommitted working tree) is exactly this class: the tip
  # built, an earlier commit did not. This job builds EACH committed snapshot in the
  # pushed range in isolation (a clean checkout per commit, no working-tree extras),
  # so a non-compiling intermediate commit fails CI instead of silently reaching a
  # peer's pull. Bounded to the last 25 commits of the range (logged if truncated)
  # so a force-rebuild or a first push can't run unbounded.
  head-snapshot-build:
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
    name: per-commit build · every pushed snapshot compiles
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      GOTOOLCHAIN: auto
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the full pushed range, not a shallow tip

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: bind pushed snapshot source and attempt
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          printf 'sha=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\n' "$sha" "$tree" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          [[ "$sha" == "$GITHUB_SHA" ]]

      - name: build each committed snapshot in the pushed range
        id: snapshots
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Resolve the commit range. On the first push to a ref, BEFORE is all-zeros;
          # fall back to just the tip so a new branch doesn't try to build all of history.
          if [ -z "${BEFORE:-}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${AFTER}~1..${AFTER}"
            git cat-file -e "${AFTER}~1^{commit}" 2>/dev/null || range="${AFTER}"
          else
            range="${BEFORE}..${AFTER}"
          fi
          # Oldest-first, so a break is reported at the first bad commit. If the range
          # resolves to nothing (e.g. a tag push with no new commits), fall back to the tip.
          mapfile -t commits < <(git rev-list --reverse "$range" 2>/dev/null || true)
          if [ "${#commits[@]}" -eq 0 ]; then
            commits=("${AFTER}")
          fi
          total=${#commits[@]}
          cap=25
          if [ "$total" -gt "$cap" ]; then
            echo "::notice::pushed range has $total commits; building the last $cap (older commits in this push are not per-commit-built)"
            commits=("${commits[@]: -$cap}")
          fi
          echo "building ${#commits[@]} committed snapshot(s) from range $range"
          work="$(mktemp -d)"
          git worktree add --detach "$work" "${AFTER}" >/dev/null
          trap 'git worktree remove --force "$work" >/dev/null 2>&1 || true' EXIT
          for sha in "${commits[@]}"; do
            git -C "$work" checkout --quiet --detach "$sha"
            if ! ( cd "$work" && go build ./... ); then
              echo "::error::commit $sha does not compile in isolation (go build ./... failed). A path-scoped commit likely referenced a symbol defined only in an uncommitted/later file."
              exit 1
            fi
            echo "  ok  $sha"
          done
          echo "all pushed snapshots compile"

  ci-provenance:
    name: verify CI evidence class and fixed job set
    needs: [testroute-ci-only, build-vet-test, race-detector, head-snapshot-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: qualify the exact executed CI class
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # ci-provenance: verify-full-begin
          set -euo pipefail
          # Outputs name actual checked-out commits; GitHub success alone is insufficient.
          jq -ne --argjson jobs "$NEEDS_JSON" --arg sha "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
            (if $event == "workflow_dispatch" then ["testroute-ci-only"] elif $event == "push" then ["build-vet-test","race-detector","head-snapshot-build"] else ["build-vet-test","race-detector"] end) as $required |
            ($jobs[$required[0]].outputs.tree // "") as $tree |
            (($sha | test("^[0-9a-f]{40}$")) and ($tree | test("^[0-9a-f]{40}$")) and
              ($run | test("^[1-9][0-9]*$")) and ($attempt | test("^[1-9][0-9]*$")) and
              all($required[]; $jobs[.].result == "success" and $jobs[.].outputs.sha == $sha and $jobs[.].outputs.tree == $tree and $jobs[.].outputs.run_id == $run and $jobs[.].outputs.run_attempt == $attempt) and
              (if $event == "workflow_dispatch" then $jobs["build-vet-test"].result == "skipped" and $jobs["race-detector"].result == "skipped" and $jobs["head-snapshot-build"].result == "skipped"
               elif $event == "push" then $jobs["testroute-ci-only"].result == "skipped" and $jobs["head-snapshot-build"].result == "success"
               elif $event == "pull_request" then $jobs["testroute-ci-only"].result == "skipped" and $jobs["head-snapshot-build"].result == "skipped"
               else false end)) as $verified |
            {schema:"fak.ci-provenance.v1",workflow:"ci",ci_class:(if $event == "workflow_dispatch" then "diagnostic" else "full" end),tested_sha:$sha,tested_tree:$tree,represented_sha:$sha,event:$event,ref:$ref,run_id:$run,run_attempt:$attempt,required_jobs:$required,jobs:$jobs,verified:$verified,release_eligible:false,source_scope:"git-commit-tree",effective_inputs_verified:false,release_ineligibility_reason:(if $event == "workflow_dispatch" then "diagnostic-run" elif $verified then "effective-input-identity-not-sealed" else "incomplete-evidence" end)}' \
            > "$RUNNER_TEMP/ci-provenance.json"
          cat "$RUNNER_TEMP/ci-provenance.json" >> "$GITHUB_STEP_SUMMARY"
          # Prior-attempt jobs cannot be silently re-dated by a partial rerun.
          if ! jq -e '.verified == true' "$RUNNER_TEMP/ci-provenance.json" > /dev/null; then
            echo "::error::CI provenance incomplete or mismatched. Re-run all jobs to produce one complete run attempt."
            exit 1
          fi
          # ci-provenance: verify-full-end
      - name: upload aggregate provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-provenance.json
          if-no-files-found: error
