name: loop-audit-signal

# Turn a DARK background loop (a rostered loop not observed ticking) into a specific,
# deduped GitHub issue the dispatch loop can resolve — the LOOP-FLEET sibling of
# score-/bench-/gate-/dispatch-session-signal (child of the operator epic #4954, filed
# as #5151). The fleet already has a rich READ: `fak loop health --json` folds the loop
# ledger + registry into a per-loop `dark` verdict (with the #4989 OS-scheduler rung
# that distinguishes a genuinely-dark loop from one whose mapped OS task fired but wrote
# no ledger row). What was missing is the FEED: nothing turned that verdict into a
# tracked ticket. This job is that feed. The pure plan/dedup core is proven by
# tools/loop_audit_signal_test.py (run FIRST below), so a filed issue is a real signal,
# not a tool that always fires.
#
# ── THE EVIDENCE-SOURCE SEAM (named per the dispatch-session-audit-feed spine) ──────
# The loop-health fold reads HOST-LOCAL runtime ledgers — `.fak/loops.jsonl`,
# `.dispatch-runs/progress.jsonl` — that are gitignored and NOT committed. A stock
# `ubuntu-latest` runner therefore has NO live loop state: folding `fak loop health`
# there would read the registry against an empty ledger and report EVERY rostered loop
# as false-DARK — a guaranteed issue storm. We resolve the seam exactly the way the
# dispatch-session sibling does — stock runner over a NAMED evidence source, never a
# self-hosted fleet runner — in two rungs:
#
#   (a) CHOSEN — consume a pre-folded `fak loop health --json` SOURCE named by the
#       `health_json` input. On a bare cloud run no source is provided, so the workflow
#       audits an EMPTY all-clear payload: the pure plan reports 0 candidates / nothing
#       to file — a safe green that still proves the feeder end-to-end (the honest dual
#       of blockers-feed's "0 blocked -> quiet green"). The DURABLE cloud source is a
#       fleet-host-published `fak loop health --json` ARTIFACT downloaded into
#       `health_json` before the plan; that publisher is the fan-out follow-on. An
#       operator can already point `health_json` at a downloaded artifact today, and the
#       live arm files from whatever it resolves to.
#
#   (b) REJECTED — a `runs-on: self-hosted` fleet runner folding the host's live loop
#       ledgers directly. No sibling signal feeder takes a self-hosted runner; doing so
#       would fork the fleet's trust boundary and the sibling idiom. Option (a) keeps
#       this workflow a stock-runner peer of its siblings.
#
# SAFE BY DEFAULT: the scheduled run is DRY-RUN — it plans, surfaces the plan to the
# step summary + an artifact, and files NOTHING. Filing is an explicit operator arm:
# `workflow_dispatch` with live=true (the dispatch-session-/bench-/gate-signal contract;
# score-signal's autonomous-on-schedule posture (#980) is a LATER graduation this feeder
# earns only after it soaks). The `issues: write` scope is exercised ONLY by the armed
# file step (gated on the live `if:`).
on:
  schedule:
    # Daily 09:29 UTC — an off-the-hour minute clear of the other scheduled jobs
    # (score-signal 07:41, gate-signal 07:53, bench-signal 08:03, blockers 09:07,
    # trajctl 09:13, dispatch-session-audit 09:43).
    - cron: "29 9 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually CREATE the issues (default: dry-run plan only)"
        type: boolean
        default: false
      max_issues:
        description: "Hard cap on issues filed per run (worst-first anti-storm bound)"
        type: string
        default: "5"
      include_spin:
        description: "Also file SPINNING loops (live but unwitnessed, #4956). Off by default (v1 files DARK only)."
        type: boolean
        default: false
      health_json:
        description: "Path to a pre-folded `fak loop health --json` evidence source (default: an empty all-clear on a bare cloud run)"
        type: string
        default: ""

# Minimal scope: read the tree, write issues. `issues: write` is required because the
# armed file step files gh issues in this same job — but it is exercised ONLY on the
# live arm (the file step's live `if:` gate). The scheduled dry-run never mutates.
permissions:
  contents: read
  issues: write

concurrency:
  group: loop-audit-signal
  cancel-in-progress: false

jobs:
  loop-audit-signal:
    name: dark loop -> issue
    if: github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_ISSUES: ${{ github.event.inputs.max_issues || '5' }}
      HEALTH_JSON: ${{ github.event.inputs.health_json || '' }}
      INCLUDE_SPIN: ${{ github.event.inputs.include_spin || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The plan/dedup logic FIRST: a planned issue below is only meaningful if the
      # pure core that produced it is itself proven correct.
      - name: loop-audit-signal self-test
        run: python tools/loop_audit_signal_test.py

      # Resolve the health evidence source (the spine seam). When no `health_json`
      # input is given, a bare cloud run has NO live loop ledgers — so instead of
      # folding a false-DARK stateless checkout, write an EMPTY all-clear payload and
      # audit that: a clean 0-candidate green that still proves the feeder end-to-end.
      # (Future: download the fleet-host-published `fak loop health --json` artifact
      # into $HEALTH_JSON here before the plan.)
      - name: resolve loop-health evidence source
        run: |
          if [ -n "$HEALTH_JSON" ] && [ -s "$HEALTH_JSON" ]; then
            echo "auditing supplied loop-health source: $HEALTH_JSON"
            cp "$HEALTH_JSON" health.json
          else
            echo "no live loop-health source on this runner -> empty all-clear (see header seam note)"
            printf '%s' '{"schema":"fak-loop-health/1","ts_unix_nano":0,"rows":[],"rollup":{"loops":0,"live":0,"stale":0,"dark":0,"os_fired_no_ledger_row":0,"witness_collapse":0}}' > health.json
          fi
          cat health.json

      # Plan the issues (dry-run) — always, so the step summary shows what WOULD be
      # filed even on an armed run. Operator inputs are bound to env (not spliced into
      # the script body) so an input value can't break out into shell.
      - name: plan loop-audit issues
        run: |
          spin_flag=""
          [ "$INCLUDE_SPIN" = "true" ] && spin_flag="--include-spin"
          python tools/loop_audit_signal.py --from health.json --max-issues "$MAX_ISSUES" \
            $spin_flag --json > loop-audit-plan.json
          python tools/loop_audit_signal.py --from health.json --max-issues "$MAX_ISSUES" \
            $spin_flag > loop-audit-plan.txt
          cat loop-audit-plan.txt

      # File the issues — ONLY on an explicit workflow_dispatch arm with live=true.
      # This is the SOLE step that exercises the issues:write scope; the worst-first
      # --max-issues cap + label-scoped marker dedup bound a storm on the first pass.
      - name: file loop-audit issues (armed)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live == 'true' }}
        run: |
          spin_flag=""
          [ "$INCLUDE_SPIN" = "true" ] && spin_flag="--include-spin"
          python tools/loop_audit_signal.py --from health.json --max-issues "$MAX_ISSUES" \
            $spin_flag --live

      - name: payload -> step summary
        if: always()
        run: |
          {
            echo "## loop-audit-signal plan"
            armed="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live == 'true' && 'LIVE (issues filed)' || 'dry-run (nothing filed)' }}"
            echo "_Mode: ${armed}. Scheduled runs are dry-run; arm via workflow_dispatch with live=true. Evidence source: host-local loop ledgers are not committed, so a bare cloud run is a clean all-clear (see the header seam note); point \`health_json\` at a fleet-host-published fold to audit real loop state._"
            echo '```'
            cat loop-audit-plan.txt 2>/dev/null || echo "(no plan)"
            echo '```'
            echo '<details><summary>machine plan (JSON)</summary>'
            echo
            echo '```json'
            cat loop-audit-plan.json 2>/dev/null || echo "{}"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-audit-plan
          path: |
            loop-audit-plan.json
            loop-audit-plan.txt
            health.json
          if-no-files-found: ignore
