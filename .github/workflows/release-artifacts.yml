# Release artifacts — cross-compiled `fak` binaries attached to the GitHub release.
#
# The release CADENCE workflow (release-cadence.yml) cuts the version commit, pushes
# main, tags `vX.Y.Z` after green CI, and creates the GitHub release PAGE from the
# committed note. It ships no binaries. THIS workflow decorates that release: on the
# `v*` tag push it cross-compiles the five supported targets and uploads them (plus
# checksums) as release assets, so an external adopter can `curl | sh` (install.sh) or
# download a prebuilt binary WITHOUT cloning the monorepo (issue #133).
#
# `cmd/fak` is pure Go (no cgo — the Vulkan backend is behind a build tag and absent
# from the default binary), so every target builds static with CGO_ENABLED=0. A binary
# shipped without a VERSION file alongside resolves its version from the BuildVersion
# ldflag stamped here (internal/appversion.Current precedence).
#
# linux/arm64 is a first-class published target: it is the constrained end of the
# deployment spectrum (Raspberry Pi / Jetson / arm64 edge gateway), the same kernel
# binary that runs on a datacenter host. CGO_ENABLED=0 proves there is nothing to port
# — the arm64 NEON Q8 path is the same one Apple-silicon ships — so this is a published
# binary, not a new build (the gap the mobile/edge strategy note flagged highest-leverage).
# See docs/explainers/cross-platform-spine.md.
#
# After the aggregate checksum asset lands, the announce job renders a release status
# card for the scoreboard workspace's #releases channel. #releases has a built-in
# default channel id (C0BGHS7HFV1) — the public sink every release report lands in,
# exactly like the other feeders (#blockers, #bench, …); override it with the
# FAK_RELEASES_CHANNEL repo variable. Posting is gated on the FAK_SCOREBOARD_TOKEN
# secret alone; without it the job dry-runs into GITHUB_STEP_SUMMARY so forks and
# unprovisioned repos stay green.
name: release-artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)build and upload assets for"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Key on the tag being operated on, not the git ref: a workflow_dispatch runs on a
  # BRANCH ref (ref_name=main) while re-uploading assets for its `tag` input, so keying
  # on ref_name alone let a manual re-run race the tag-push run on the same release's
  # assets (#3130, witnessed v0.37.0). Mirrors the checkout step's inputs.tag || ref.
  group: release-artifacts-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload
      id-token: write # SLSA build-provenance attestation (#1372)
      attestations: write # write the attestation to the repo's attestation store
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      GOTOOLCHAIN: auto
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag ref on push; the dispatch input when re-running by hand.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # zero external deps -> no go.sum to key a cache on

      - name: Build, package, checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          NAME="fak_${VERSION}_${GOOS}_${GOARCH}"
          OUT="fak"; [ "$GOOS" = "windows" ] && OUT="fak.exe"

          mkdir -p dist/pkg
          # Build through the one canonical release recipe (scripts/build.sh, #3709);
          # the job env (GOOS/GOARCH/CGO_ENABLED/GOTOOLCHAIN) passes through unchanged.
          OUT="dist/pkg/${OUT}" VERSION="${VERSION}" sh scripts/build.sh

          # Bundle the binary with the license and the getting-started guide so a
          # downloaded archive is self-explanatory.
          cp LICENSE dist/pkg/LICENSE
          cp GETTING-STARTED.md dist/pkg/GETTING-STARTED.md

          cd dist
          if [ "$GOOS" = "windows" ]; then
            ARCHIVE="${NAME}.zip"
            ( cd pkg && zip -q -r "../${ARCHIVE}" . )
          else
            ARCHIVE="${NAME}.tar.gz"
            tar -C pkg -czf "${ARCHIVE}" .
          fi
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "built ${ARCHIVE}"
          cat "${ARCHIVE}.sha256"
          # Hand the exact pair this leg produced to the upload step. Globbing for
          # every extension (`dist/*.zip` on a linux leg) fails under `set -u`
          # because the unmatched pattern stays literal and `gh` 404s on it.
          echo "ARCHIVE=dist/${ARCHIVE}" >> "$GITHUB_ENV"
          echo "ARCHIVE_SUM=dist/${ARCHIVE}.sha256" >> "$GITHUB_ENV"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # The tag push that triggered us ALSO fires release-cadence's
          # `release_publish.py` step, which creates the release PAGE. We race it:
          # without waiting, `gh release upload` 404s with "release not found"
          # (issue #369). Wait up to ~2 min for the page to appear, then fail loud.
          for i in $(seq 1 24); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "release $TAG not visible yet (attempt $i/24); waiting 5s..."
            sleep 5
          done
          gh release view "$TAG" >/dev/null
          # Upload only the one archive (+ its checksum) this matrix leg built.
          # --clobber makes a re-run (dispatch backfill, retried matrix leg) idempotent.
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE_SUM" --clobber

      - name: Attest build provenance (SLSA)
        # Cryptographic, machine-verifiable proof that THIS archive was built by THIS
        # workflow from THIS commit — the supply-chain guarantee a sha256 sidecar
        # can't give (#1372, epic #1354). A consumer verifies with:
        #   gh attestation verify <archive> --repo anthony-chaudhary/fak
        # Best-effort: skip on a fork / unprovisioned repo where id-token isn't
        # available, so the release stays green rather than failing on a perms gap.
        if: ${{ !github.event.repository.fork }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ env.ARCHIVE }}

  vulkan-build:
    name: linux/amd64 Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload
      id-token: write # SLSA build-provenance attestation
      attestations: write
    env:
      GOTOOLCHAIN: auto
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Vulkan build and software-device dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils ca-certificates curl g++ jq libvulkan-dev mesa-vulkan-drivers xz-utils

      - name: Build and validate Vulkan archive
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          ARCHIVE="fak_${VERSION}_linux_amd64_vulkan.tar.gz"
          SDK_VERSION="1.4.350.0"
          SDK_SHA256="b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2"
          SDK_ARCHIVE="$RUNNER_TEMP/vulkansdk-linux-x86_64-${SDK_VERSION}.tar.xz"
          SDK_ROOT="$RUNNER_TEMP/vulkansdk-${SDK_VERSION}"
          mapfile -t LVP_ICDS < <(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print | sort)
          if [ "${#LVP_ICDS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Lavapipe ICD, found ${#LVP_ICDS[@]}"
            exit 1
          fi
          LVP_ICD="${LVP_ICDS[0]}"

          curl --fail --location --retry 3 \
            "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkan_sdk.tar.xz" \
            --output "$SDK_ARCHIVE"
          echo "${SDK_SHA256}  ${SDK_ARCHIVE}" | sha256sum --check --strict
          mkdir -p "$SDK_ROOT"
          tar -xJf "$SDK_ARCHIVE" -C "$SDK_ROOT"
          mapfile -t PINNED_GLSLCS < <(find "$SDK_ROOT" -type f -path '*/x86_64/bin/glslc' -print | sort)
          if [ "${#PINNED_GLSLCS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one pinned LunarG glslc, found ${#PINNED_GLSLCS[@]}"
            exit 1
          fi
          PINNED_GLSLC="${PINNED_GLSLCS[0]}"
          "$PINNED_GLSLC" --version

          mkdir -p dist/pkg
          go run ./cmd/fak-dev build-vulkan shaders \
            --commit "$(git rev-parse HEAD)" \
            --glslc "$PINNED_GLSLC" \
            --receipt dist/vulkan-shaders-build.json
          go run ./cmd/fak-dev build-vulkan lib \
            --commit "$(git rev-parse HEAD)" \
            --glslc "$PINNED_GLSLC" \
            --receipt dist/vulkan-shim-build.json
          CGO_LDFLAGS="-L$PWD/internal/compute" \
            go run ./cmd/fak-dev build \
              --profile release \
              --out dist/pkg/fak \
              --receipt dist/vulkan-release-build.json \
              --version "$VERSION" \
              --tags vulkan

          mkdir -p dist/pkg/spirv
          cp internal/compute/spirv/*.spv dist/pkg/spirv/
          cp LICENSE GETTING-STARTED.md dist/pkg/

          test "$(find dist/pkg/spirv -maxdepth 1 -type f -name '*.spv' | wc -l)" -gt 0

          tar -C dist/pkg -czf "dist/${ARCHIVE}" .
          tar -tzf "dist/${ARCHIVE}" > dist/vulkan-archive.list
          grep -Fxq './fak' dist/vulkan-archive.list
          grep -Eq '^\./spirv/.+\.spv$' dist/vulkan-archive.list
          ( cd dist && sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256" )

          # Validate a fresh extraction, including executable-relative shader
          # discovery, on a software Vulkan device before publishing it. This is
          # a build/registration witness only; physical Halo qualification remains
          # a separate hardware gate.
          mkdir -p dist/vulkan-validate
          tar -xzf "dist/${ARCHIVE}" -C dist/vulkan-validate
          unset FAK_VULKAN_SPIRV
          export VK_ICD_FILENAMES="$LVP_ICD"
          version_json="$(dist/vulkan-validate/fak version --json)"
          got_version="$(jq -er '.app_version | select(type == "string")' <<<"$version_json")"
          [ "$got_version" = "$VERSION" ]
          dist/vulkan-validate/fak backends | tee dist/vulkan-backends.txt
          grep -Fxq vulkan dist/vulkan-backends.txt
          ldd dist/vulkan-validate/fak | grep -F 'libvulkan.so' >/dev/null
          echo "VULKAN_ARCHIVE=dist/${ARCHIVE}" >> "$GITHUB_ENV"
          echo "VULKAN_ARCHIVE_SUM=dist/${ARCHIVE}.sha256" >> "$GITHUB_ENV"

      - name: Upload validated Vulkan archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          for i in $(seq 1 24); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "release $TAG not visible yet (attempt $i/24); waiting 5s..."
            sleep 5
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "$VULKAN_ARCHIVE" "$VULKAN_ARCHIVE_SUM" --clobber

      - name: Attest Vulkan build provenance (SLSA)
        if: ${{ !github.event.repository.fork }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ env.VULKAN_ARCHIVE }}

  checksums:
    name: aggregate SHA256SUMS
    needs: [build, vulkan-build]
    outputs:
      cpu_digest: ${{ steps.fold.outputs.cpu_digest }}
      cuda_digest: ${{ steps.fold.outputs.cuda_digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
      packages: read # verify the same-tag CUDA image before release promotion
      id-token: write # SLSA build-provenance attestation of the aggregate SHA256SUMS (#1372)
      attestations: write # write the attestation to the repo's attestation store
    steps:
      - name: Fold per-asset sums into one SHA256SUMS
        id: fold
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so `gh` cannot infer the repo from a git
          # remote — it failed with "fatal: not a git repository" (issue #369).
          # Pin the repo explicitly instead of paying for a full checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          CUDA_IMAGE="ghcr.io/${OWNER}/fak:${VERSION}-cuda"
          CPU_IMAGE="ghcr.io/${OWNER}/fak:${VERSION}"
          CPU_VARIANT_IMAGE="ghcr.io/${OWNER}/fak:${VERSION}-cpu"
          # `needs: build` means the page should already exist, but guard anyway so
          # a manual workflow_dispatch re-run can't race a freshly created release.
          for i in $(seq 1 24); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "release $TAG not visible yet (attempt $i/24); waiting 5s..."
            sleep 5
          done
          gh release view "$TAG" >/dev/null
          tmp="$(mktemp -d)"
          # Pull the per-asset .sha256 files back down and concatenate them. Each line
          # is already in `<hash>  <archive>` form, which the installer verifies against.
          #
          # GPU artifacts are uploaded by separate platform workflows, which race
          # this fold: on v0.53.0 the published SHA256SUMS went
          # out with the universal line MISSING entirely. Platform workflows can
          # take 30+ minutes, so poll for up to one hour before folding. Missing GPU
          # assets fail closed: checksums are not uploaded and Latest cannot advance.
          fold_attempt=1
          fold_max=120
          fold_ok=0
          while [ "$fold_attempt" -le "$fold_max" ]; do
            gh release download "$TAG" --dir "$tmp" --pattern '*.sha256' --clobber
            if [ -e "$tmp/fak_${VERSION}_darwin_universal.tar.gz.sha256" ] && \
               [ -e "$tmp/fak_${VERSION}_darwin_arm64_metal.tar.gz.sha256" ] && \
               [ -e "$tmp/fak_${VERSION}_linux_amd64_vulkan.tar.gz.sha256" ] && \
               docker manifest inspect "$CUDA_IMAGE" >/dev/null 2>&1 && \
               docker manifest inspect "$CPU_IMAGE" >/dev/null 2>&1 && \
               docker manifest inspect "$CPU_VARIANT_IMAGE" >/dev/null 2>&1; then
              fold_ok=1
              echo "required platform and GPU sidecars present (fold attempt ${fold_attempt}/${fold_max})"
              break
            fi
            if [ "$fold_attempt" -eq "$fold_max" ]; then
              break
            fi
            echo "required platform/GPU artifacts not up yet (attempt ${fold_attempt}/${fold_max}); waiting 30s for platform workflows..."
            sleep 30
            fold_attempt=$((fold_attempt + 1))
          done
          if [ "$fold_ok" -ne 1 ]; then
            echo "::error::required platform/GPU artifacts missing after ${fold_max} attempts; refusing to publish incomplete SHA256SUMS"
            exit 1
          fi
          # Do not accept mere tag visibility: reproduce the CUDA workflow's
          # post-push build/link assertions against the exact versioned image.
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$CUDA_IMAGE"
          docker pull "$CPU_IMAGE"
          docker pull "$CPU_VARIANT_IMAGE"
          cuda_digest="$(docker image inspect "$CUDA_IMAGE" --format '{{ index .RepoDigests 0 }}')"
          cpu_digest="$(docker image inspect "$CPU_IMAGE" --format '{{ index .RepoDigests 0 }}')"
          cpu_variant_digest="$(docker image inspect "$CPU_VARIANT_IMAGE" --format '{{ index .RepoDigests 0 }}')"
          if [ "${cpu_digest#*@}" != "${cpu_variant_digest#*@}" ]; then
            echo "::error::CPU compatibility and explicit reference tags resolve to different digests"
            exit 1
          fi
          cuda_caps="$(docker run --rm --entrypoint fak "$cuda_digest" runtime-capabilities)"
          echo "$cuda_caps" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if "cuda" in (d.get("build_tags") or []) else 1)'
          cuda_version="$(docker run --rm --entrypoint fak "$cuda_digest" version 2>/dev/null | head -1)"
          if [ "$cuda_version" != "$VERSION" ]; then
            echo "::error::CUDA image version mismatch: got '$cuda_version', want '$VERSION'"
            exit 1
          fi
          docker run --rm --entrypoint sh "$cuda_digest" -c 'ldd /usr/local/bin/fak | grep -q libcudart'
          echo "cpu_digest=${cpu_digest}" >> "$GITHUB_OUTPUT"
          echo "cuda_digest=${cuda_digest}" >> "$GITHUB_OUTPUT"
          cat "$tmp"/*.sha256 | sort -k2 > "$tmp/SHA256SUMS"
          echo "== SHA256SUMS =="
          cat "$tmp/SHA256SUMS"
          gh release upload "$TAG" "$tmp/SHA256SUMS" --clobber
          # Hand the aggregate's on-runner path to the attestation step below. The
          # mktemp dir persists across steps of the same job, so this path resolves.
          echo "SHA256SUMS_PATH=$tmp/SHA256SUMS" >> "$GITHUB_ENV"

      - name: Attest build provenance (SHA256SUMS)
        # The issue's exact gap: a consumer "cannot verify the checksum itself wasn't
        # tampered" (#1372). The build job attests each ARCHIVE, but install.sh trusts
        # the aggregate SHA256SUMS as its PRIMARY checksum anchor (the per-asset .sha256
        # is only a fallback) and verifies with sha256 alone — so without this the
        # installer's trust chain bottoms out at an unsigned file. Attest it too, giving
        # the aggregate the same machine-verifiable provenance the archives get. Verify:
        #   gh attestation verify SHA256SUMS --repo anthony-chaudhary/fak
        # Best-effort: skip on a fork / unprovisioned repo where id-token isn't
        # available, so the release stays green rather than failing on a perms gap.
        if: ${{ !github.event.repository.fork }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ env.SHA256SUMS_PATH }}

  verify-release:
    # Post-publish verification (#1369, epic #1354). A release that "succeeded" (tag +
    # page + assets present) can still be unusable — a corrupt archive, a binary that
    # prints the wrong version, or an `@latest` that won't resolve. At agentic cadence
    # we cut more often, so an unverified publish ships breakage that costs far more to
    # recover than the speed it bought. This job proves the published release is good
    # against ground truth: re-download every asset, verify its sha256, extract, and
    # run the binary to assert it reports the tag's version. It runs the PUBLISHED
    # artifact (not the source tree) on purpose — that is what a consumer gets.
    name: verify published artifacts
    needs: checksums
    # Run even when aggregation fails so this job can quarantine a release whose
    # required GPU artifact never arrived. Without always(), GitHub skips the job
    # and leaves the release page eligible for Latest despite the failed gate.
    if: ${{ always() }}
    concurrency:
      group: release-promotion-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # quarantine a release that fails post-publish verification
      packages: write # assign verified mutable OCI aliases by digest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GOTOOLCHAIN: auto
    steps:
      - name: require complete artifact aggregation
        if: ${{ needs.checksums.result != 'success' }}
        run: |
          echo "::error::artifact aggregation failed; required CPU/GPU release set is incomplete"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Vulkan software-device verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libvulkan1 mesa-vulkan-drivers

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: verify published archives and checksums
        id: verify_published_assets
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          tmp="$(mktemp -d)"
          assets="${tmp}/assets"
          unpacked="${tmp}/unpacked"
          mkdir -p "$assets" "$unpacked"

          # darwin universal is built+uploaded by release-macos.yml, not this
          # workflow's matrix; it belongs to the same published release, so it
          # must be re-verified here too (its absence let v0.55.0's broken
          # universal sidecar ship unnoticed).
          expected_archives=(
            "fak_${VERSION}_linux_amd64.tar.gz"
            "fak_${VERSION}_linux_arm64.tar.gz"
            "fak_${VERSION}_darwin_amd64.tar.gz"
            "fak_${VERSION}_darwin_arm64.tar.gz"
            "fak_${VERSION}_windows_amd64.zip"
            "fak_${VERSION}_darwin_universal.tar.gz"
            "fak_${VERSION}_darwin_arm64_metal.tar.gz"
            "fak_${VERSION}_linux_amd64_vulkan.tar.gz"
          )

          # Settle asset propagation before judging completeness. `needs: checksums`
          # guarantees every upload CALL returned, but GitHub's release-asset store is
          # not read-your-writes: a `gh release download` moments later can still fetch
          # a truncated/absent asset while the CDN catches up. Verifying against that
          # partial snapshot quarantines a perfectly good release — the false-positive
          # that demoted a stable cut to prerelease and left @latest lagging HEAD
          # (v0.37.0: arm64 read "FAILED open or read" though its sha256 matched on the
          # very next fetch). Re-download until every expected archive + its sidecar +
          # the aggregate SHA256SUMS is present and non-empty, up to ~2 min, THEN verify.
          # A genuinely missing/corrupt asset still fails: the loop times out and the
          # completeness check below flags it. This settles a race; it never masks a
          # real defect.
          settle_ok=0
          for attempt in $(seq 1 24); do
            rm -rf "$assets"; mkdir -p "$assets"
            gh release download "$TAG" --dir "$assets" --clobber >/dev/null 2>&1 || true
            missing=0
            for archive in "${expected_archives[@]}"; do
              [ -s "${assets}/${archive}" ] || { missing=1; break; }
              [ -s "${assets}/${archive}.sha256" ] || { missing=1; break; }
            done
            [ -s "${assets}/SHA256SUMS" ] || missing=1
            if [ "$missing" -eq 0 ]; then
              settle_ok=1
              echo "all release assets present and non-empty (attempt ${attempt})"
              break
            fi
            echo "release assets not fully propagated yet (attempt ${attempt}/24); waiting 5s..."
            sleep 5
          done
          if [ "$settle_ok" -ne 1 ]; then
            echo "::warning::release assets did not fully settle within timeout; verifying the last snapshot so a real gap still fails loud"
          fi
          cd "$assets"

          fail=0

          echo "== checking required release assets =="
          for archive in "${expected_archives[@]}"; do
            if [ ! -f "$archive" ]; then
              echo "::error::expected release archive missing: $archive"; fail=1
              continue
            fi
            if [ ! -f "${archive}.sha256" ]; then
              echo "::error::expected checksum sidecar missing: ${archive}.sha256"; fail=1
            fi
          done
          if [ ! -f SHA256SUMS ]; then
            echo "::error::aggregate SHA256SUMS asset missing"; fail=1
          fi

          # Checksum checks live in a standalone, unit-tested script
          # (.github/scripts/verify-release-checksums_test.sh proves it
          # actually fails on a corrupted asset) so this property is
          # verified on every PR, not just on a real tag push (#1369).
          #
          # The script strips a leading dist/ from every checksum-line name
          # before `sha256sum -c`, so PRE-FIX sidecars/SHA256SUMS whose content
          # reads `<hash>  dist/...` (how release-macos.yml emitted the universal
          # sidecar, red-ing this whole job on v0.55.0) verify here too. The
          # release-macos.yml fix landing in the same wave emits the sidecar
          # content with the BARE filename already; normalization is the
          # belt-and-suspenders readability layer under it.
          bash "${GITHUB_WORKSPACE}/.github/scripts/verify-release-checksums.sh" "$assets" || fail=1

          echo "== extracting published archives =="
          for archive in "${expected_archives[@]}"; do
            [ -f "$archive" ] || continue
            dest="${unpacked}/${archive}"
            mkdir -p "$dest"
            case "$archive" in
              *.tar.gz) tar -xzf "${PWD}/${archive}" -C "$dest" ;;
              *.zip) unzip -q "${PWD}/${archive}" -d "$dest" ;;
              *) echo "::error::unknown archive format: $archive"; fail=1; continue ;;
            esac
            bin="fak"
            case "$archive" in
              *windows*) bin="fak.exe" ;;
            esac
            if [ ! -f "${dest}/${bin}" ]; then
              echo "::error::${archive} did not contain ${bin} at archive root"; fail=1
            fi
          done

          # Verify the linux/amd64 binary actually runs and reports the right version.
          lin="${unpacked}/fak_${VERSION}_linux_amd64.tar.gz/fak"
          if [ -f "$lin" ]; then
            chmod +x "$lin"
            got="$("$lin" version 2>/dev/null | head -1 || true)"
            echo "linux_amd64 fak version -> ${got}"
            case "$got" in
              *"$VERSION"*) echo "ok: binary reports $VERSION" ;;
              *) echo "::error::published linux_amd64 binary version mismatch: got '$got', want '$VERSION'"; fail=1 ;;
            esac
          else
            echo "::error::linux/amd64 archive did not extract a runnable fak binary"; fail=1
          fi
          # Backend-presence probe: run the same extracted linux/amd64 binary as
          # `fak backends` and assert the compute registry is ALIVE in the shipped
          # asset — non-empty and containing the cpu-ref Reference floor, which
          # self-registers in EVERY build. These 5 default assets are CGO0/pure-Go
          # by design, so the assertion is presence + non-empty, NOT GPU
          # completeness; the darwin metal legs and the cuda container assert
          # their richer backend sets in their own workflows.
          if [ -f "$lin" ]; then
            bl="$("$lin" backends 2>/dev/null || true)"
            echo "linux_amd64 fak backends -> $(echo "$bl" | tr '\n' ' ')"
            if [ -z "$bl" ]; then
              echo "::error::published linux_amd64 binary reports NO registered backends (registry is not alive)"; fail=1
            elif ! echo "$bl" | grep -qx "cpu-ref"; then
              echo "::error::published linux_amd64 binary backends output lacks cpu-ref: '$bl'"; fail=1
            else
              echo "ok: binary reports a live backend registry including cpu-ref"
            fi
            bj="$("$lin" backends --json 2>/dev/null || true)"
            if ! echo "$bj" | python3 -c 'import json,sys; a=json.load(sys.stdin); sys.exit(0 if isinstance(a,list) and a and "cpu-ref" in a else 1)' 2>/dev/null; then
              echo "::error::published linux_amd64 binary 'backends --json' is not a non-empty JSON array containing cpu-ref: '$bj'"; fail=1
            else
              echo "ok: binary backends --json is a live JSON array including cpu-ref"
            fi
          fi

          # Exercise the published Vulkan binary from its extracted archive with
          # the environment override absent. Lavapipe makes this a deterministic
          # software-only build/registration gate; physical Halo qualification is
          # recorded separately and is never inferred from this check.
          vulkan_dir="${unpacked}/fak_${VERSION}_linux_amd64_vulkan.tar.gz"
          vulkan_bin="${vulkan_dir}/fak"
          mapfile -t lvp_icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print | sort)
          if [ ! -x "$vulkan_bin" ]; then
            echo "::error::published Vulkan archive did not extract a runnable fak binary"; fail=1
          elif [ "${#lvp_icds[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Lavapipe ICD, found ${#lvp_icds[@]}"; fail=1
          elif [ ! -d "${vulkan_dir}/spirv" ] || \
               [ "$(find "${vulkan_dir}/spirv" -maxdepth 1 -type f -name '*.spv' | wc -l)" -eq 0 ]; then
            echo "::error::published Vulkan archive lacks bundled SPIR-V assets"; fail=1
          else
            lvp_icd="${lvp_icds[0]}"
            unset FAK_VULKAN_SPIRV
            if ! vulkan_version_json="$(VK_ICD_FILENAMES="$lvp_icd" "$vulkan_bin" version --json)"; then
              echo "::error::published Vulkan binary version command failed"; fail=1
            elif ! vulkan_version="$(jq -er '.app_version | select(type == "string")' <<<"$vulkan_version_json")"; then
              echo "::error::published Vulkan binary returned invalid version JSON"; fail=1
            elif [ "$vulkan_version" = "$VERSION" ]; then
              echo "ok: Vulkan binary reports $VERSION"
            else
              echo "::error::published Vulkan binary version mismatch: got '$vulkan_version', want '$VERSION'"; fail=1
            fi
            vulkan_backends="$(VK_ICD_FILENAMES="$lvp_icd" "$vulkan_bin" backends 2>/dev/null || true)"
            echo "linux_amd64_vulkan fak backends -> $(echo "$vulkan_backends" | tr '\n' ' ')"
            if ! echo "$vulkan_backends" | grep -Fxq vulkan; then
              echo "::error::published Vulkan binary does not register vulkan with bundled assets: '$vulkan_backends'"; fail=1
            fi
            if ! ldd "$vulkan_bin" | grep -Fq 'libvulkan.so'; then
              echo "::error::published Vulkan binary is not linked to libvulkan"; fail=1
            fi
          fi
          {
            echo "## verify published artifacts — ${TAG}"
            echo "Required archives: ${#expected_archives[@]}"
            echo "Checksum sidecars, SHA256SUMS, extraction, linux/amd64 binary-version verification, backend-registry presence, and Vulkan bundled-asset registration under Lavapipe ran."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

      # CI spec impact (#5947): adds only this release-gate assertion; existing
      # inputs, consumers, required checks, artifacts, and job names are unchanged.
      - name: verify nested modules and root dependency quarantine
        run: go test ./internal/dependencyquarantine

      - name: verify go install resolves and runs the tag
        id: verify_go_install
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          install_dir="$(mktemp -d)"
          mod_cache="$(mktemp -d)"
          build_cache="$(mktemp -d)"
          env \
            GOBIN="$install_dir" \
            GOMODCACHE="$mod_cache" \
            GOCACHE="$build_cache" \
            GOPROXY=direct \
            go install "github.com/anthony-chaudhary/fak/cmd/fak@${TAG}"
          got="$("${install_dir}/fak" version 2>/dev/null | head -1 || true)"
          echo "go install fak version -> ${got}"
          case "$got" in
            *"$VERSION"*) echo "ok: go install ...@${TAG} resolved, built, and reports ${VERSION}" ;;
            *) echo "::error::go-installed fak version mismatch: got '$got', want '$VERSION'"; exit 1 ;;
          esac
          {
            echo "## verify go install — ${TAG}"
            echo "go install github.com/anthony-chaudhary/fak/cmd/fak@${TAG} resolved, built, and reported ${VERSION}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Promote verified release to Latest
        # Symmetric with the quarantine step below: verification demotes a bad
        # release, so it must PROMOTE a good one. Without this the front door
        # (github.com/.../releases) can lag HEAD — the release page created by
        # release_publish.py, a prior verify pass that quarantined on a transient
        # asset race, or GitHub's implicit highest-semver heuristic can each leave
        # the newest stable cut sitting as a prerelease while an older tag keeps the
        # "Latest" badge (v0.37.0 did exactly this). Once every published artifact is
        # proven good, assert the invariant the user wants: the latest verified
        # release IS the default the front door shows. Idempotent — a release already
        # stable+Latest is re-PATCHed to the same state.
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          CURRENT_LATEST="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$CURRENT_LATEST" ]; then
            NEWEST="$(printf '%s\n%s\n' "$CURRENT_LATEST" "$TAG" | sort -V | tail -n1)"
            if [ "$NEWEST" != "$TAG" ]; then
              echo "release $TAG verified but is older than current Latest $CURRENT_LATEST; preserving the newer default"
              gh api -X PATCH "repos/${GH_REPO}/releases/${release_id}" \
                -F prerelease=false \
                -f make_latest=false \
                --silent
              exit 0
            fi
          fi
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/fak"
          CPU_DIGEST="${{ needs.checksums.outputs.cpu_digest }}"
          CUDA_DIGEST="${{ needs.checksums.outputs.cuda_digest }}"
          [ -n "$CPU_DIGEST" ] && [ -n "$CUDA_DIGEST" ]
          docker buildx imagetools create --tag "${IMAGE}:cpu-latest" "$CPU_DIGEST"
          docker buildx imagetools create --tag "${IMAGE}:cuda-latest" "$CUDA_DIGEST"
          docker buildx imagetools create --tag "${IMAGE}:latest" "$CUDA_DIGEST"
          gh api -X PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F prerelease=false \
            -f make_latest=true \
            --silent
          {
            echo "## promoted verified release to Latest - ${TAG}"
            echo "Post-publish verification passed; marked the GitHub release stable (prerelease=false) and make_latest=true so the front door defaults to it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Quarantine failed release
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          gh api -X PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F prerelease=true \
            -f make_latest=false \
            --silent
          {
            echo "## quarantined failed release - ${TAG}"
            echo "Marked the GitHub release as a prerelease and make_latest=false after post-publish verification failed."
          } >> "$GITHUB_STEP_SUMMARY"

  announce:
    name: announce release to #releases
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: auto
      FAK_SCOREBOARD_TOKEN: ${{ secrets.FAK_SCOREBOARD_TOKEN }}
      FAK_RELEASES_CHANNEL: ${{ vars.FAK_RELEASES_CHANNEL || vars.FAK_CICD_REPORT_CHANNEL || 'C0BGQ411TCJ' }}
      FAK_SCOREBOARD_SOURCE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: render release card (dry-run)
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          go run ./cmd/fak scoreboard post \
            --channel "$FAK_RELEASES_CHANNEL" \
            --kpi release \
            --value "$TAG" \
            --grade A \
            --verdict OK \
            --detail "$NOTES_URL" \
            --source ci \
            --dry-run | tee release-card.txt
          {
            echo "## release-artifacts — ${TAG}"
            echo '```'
            cat release-card.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: post to #releases
        if: ${{ env.FAK_SCOREBOARD_TOKEN != '' }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          go run ./cmd/fak scoreboard post \
            --channel "$FAK_RELEASES_CHANNEL" \
            --kpi release \
            --value "$TAG" \
            --grade A \
            --verdict OK \
            --detail "$NOTES_URL" \
            --source ci

      - name: note when posting was skipped
        if: ${{ env.FAK_SCOREBOARD_TOKEN == '' }}
        run: |
          {
            echo "Release announcement SKIPPED — ran in dry-run, nothing posted."
            echo "- FAK_SCOREBOARD_TOKEN secret not set (add it under Settings -> Secrets and variables -> Actions -> Secrets)."
            echo "- #releases target defaults to C0BGHS7HFV1; override with the FAK_RELEASES_CHANNEL repo variable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload card artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-card
          path: release-card.txt
          if-no-files-found: ignore
