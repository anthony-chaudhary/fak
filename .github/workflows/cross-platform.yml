# Cross-platform build + vet smoke for the fak module — the multi-platform leg of
# the CI/CD pipeline (#199, G-001 "CI on all platforms"). The authoritative `ci`
# workflow runs the full build+vet+test+claims-lint gate on ubuntu-latest only,
# because native-Windows `go test` is blocked by an OS Application-Control policy
# (see fak/CLAUDE.md / AGENTS.md) and the full suite is therefore Linux-authoritative.
# This workflow adds the platform coverage `ci` cannot: it compiles (`go build ./...`)
# and statically checks (`go vet ./...`) the whole module on Linux, macOS, AND Windows,
# so a change that breaks the build or vet on a non-Linux host is caught in CI rather
# than by a user on that host. Build+vet (not the full test suite) keeps it fast and
# sidesteps the Windows test quirk while still proving the module compiles and passes
# static analysis everywhere fak claims to run.
name: cross-platform

on:
  push:
    branches: [main, master, fak-v0.1]
  pull_request:

permissions:
  contents: read

# Queue control (CI/CD run-speed): cancel a PR's superseded in-flight runs on a
# re-push/force-push. On main — and on schedule/workflow_dispatch — github.head_ref
# is empty, so the group key falls back to the unique commit SHA: every trunk commit
# runs its own per-OS build+vet matrix in parallel, uncancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  build-vet:
    name: build · vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result — one OS failing must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The exact toolchain comes from go.mod (go 1.26); GOTOOLCHAIN=auto lets `go`
      # fetch it if the runner's Go is older. Job-level so every step sees it.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # zero external deps -> no go.sum to key a cache on

      # The whole module must compile on this OS. Default tags / default CGO — the
      # same invocation an end user runs after `go install ...@latest`.
      # The launchshim acceptance is stdlib-only and safe on native Windows.
      # It witnesses both provider identities and lossless config lifecycle on every
      # claimed OS family instead of relying on compile-only evidence (#5810).
      - name: launchshim acceptance (Claude + Codex)
        run: go test ./internal/launchshim -run 'TestProviderAcceptanceMatrix|TestConcurrentSaveNeverTearsConfig|TestCanonicalCommand|TestActivationLifecyclePreservesUserBytesAndConverges|TestActivationBlocksResolveShimFirst' -count=1

      # The Windows-only launch race in #9847 crossed process replacement, Git ref movement,
      # receipt parsing, and inherited-environment semantics. Keep its narrow acceptance live
      # on the platform where the production failure occurred.
      - name: self-update freshness linearization (Windows)
        if: runner.os == 'Windows'
        run: go test ./cmd/fak -run 'TestSelfUpdateAttemptPinsSelectionAcrossMovingOrigin|TestSelfUpdateAttemptRealGitPinsSelectionAcrossMovingOrigin|TestRunCodexFreshnessAdmissionReexecAdmitsSelectedCommitAfterRefAdvances|TestCodexFreshnessInstalledRevisionRequiresChangedPrimaryReceipt|TestCodexFreshnessReexecEnvironmentScrubsInheritedMarkersCaseInsensitively|TestCodexFreshnessReexecHelperRoundTrip' -count=1 -timeout=3m

      - name: self-update replacement boundary (Windows)
        if: runner.os == 'Windows'
        run: go test ./internal/selfinstall -run '^TestLaunchTransactionHoldsPriorAtReplacementBoundary$' -count=1 -timeout=2m

      - name: build (whole module compiles)
        run: go build ./...

      # Static checks must pass on this OS too (catches platform-specific vet findings
      # such as bad printf verbs or struct-tag issues that only surface per-GOOS).
      - name: vet (static checks pass)
        run: go vet ./...
