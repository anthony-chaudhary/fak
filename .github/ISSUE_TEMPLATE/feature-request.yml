name: Feature request
description: Propose an improvement to fak or the DOS trust kernel.
title: "[feature] "
body:
  - type: markdown
    attributes:
      value: |
        A clear problem statement is the valuable part — a proposed design is
        optional. "This refusal was confusing" or "I wanted X and had to
        hand-roll it" are both great starts.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does it hurt today?
    validations:
      required: true
  - type: checkboxes
    id: problems_touched
    attributes:
      label: Which fak problems does this touch?
      description: >-
        Optional, and not a single-choice — the problems are a connected cluster,
        so tick every row this plausibly advances. See docs/problems-we-solve.md.
      options:
        - label: P1 — Managed context (sessions rebuild setup, lose state, or resend context that could have been retained)
        - label: P2 — Net-true efficiency (an optimization looks cheaper in isolation while the real workflow gets worse)
        - label: P3 — Fast, bounded adaptation (workloads change faster than static infrastructure; broad rewrites are too slow)
        - label: P4 — Integrated operations (operators cannot discover, run, observe, recover, or govern it through the real path)
  - type: textarea
    id: problem_frame
    attributes:
      label: Problem frame
      description: >-
        Classify this as Core, Enabling (name the Core outcome), Stewardship
        (name the obligation), or Peripheral. For each P1-P4 row, write
        advanced, preserved, or N/A plus a concrete reason; short answers are fine.
      placeholder: |-
        Centrality: Enabling (named Core outcome)
        P1 Context: preserved - reason
        P2 Net value: advanced - reason
        P3 Adaptation: N/A - concrete reason
        P4 Operations: preserved - reason
    validations:
      required: true
  - type: textarea
    id: operator_value
    attributes:
      label: Today → better → witness
      description: Name the real next-best alternative, the observable operator step/decision/cost that disappears, and the artifact that would prove it.
      placeholder: "Today: …\nBetter because: …\nWitness: …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: If you have a shape in mind, sketch it. Alternatives welcome too.
    validations:
      required: false
