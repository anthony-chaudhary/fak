name: Bug report
description: Something broke, refused, or behaved differently than documented.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! A one-line bug with a command to reproduce it
        is a great issue — you don't need to fill in more than that.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did you see?
      placeholder: "Example: `fak serve --addr 127.0.0.1:8080 --base-url http://localhost:11434/v1 --model qwen2.5:1.5b` started, but every tool call came back DENY even though the tool is on my policy's allow-list."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: "The commit lands, or the refusal names a reason I can act on."
    validations:
      required: false
  - type: textarea
    id: problem_frame
    attributes:
      label: Problem frame
      description: >-
        Classify this as Core, Enabling (name the Core outcome), Stewardship
        (name the obligation), or Peripheral. For each P1-P4 row, write
        advanced, preserved, or N/A plus a concrete reason; short answers are fine.
      placeholder: |-
        Centrality: Enabling (named Core outcome)
        P1 Context: preserved - reason
        P2 Net value: advanced - reason
        P3 Adaptation: N/A - concrete reason
        P4 Operations: preserved - reason
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / environment
      description: Output of `fak --version` (or the commit SHA), plus OS if relevant.
      placeholder: "Example: fak 0.41.0, Windows 11 / WSL2"
    validations:
      required: false
