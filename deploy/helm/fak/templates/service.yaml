apiVersion: v1
kind: Service
metadata:
  name: {{ include "fak.fullname" . }}
  labels:
    {{- include "fak.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "fak.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.service.targetPort | default 8080 }}
