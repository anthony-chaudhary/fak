{{- $mode := include "fak.mode" . -}}
{{- $gw := .Values.secrets.gatewayKey -}}
{{- $prov := .Values.secrets.providerKey -}}
{{- if or $gw (and (eq $mode "proxy") $prov) }}
# Gateway + provider keys. The Deployment's env points at THIS Secret via
# secretKeyRef; pods refuse to start until it exists (fail-closed — an empty
# $FAK_GATEWAY_KEY would otherwise start the gateway UNAUTHENTICATED).
#
# STRONG-KEY WARNING: generate the gateway key with `openssl rand -hex 32`. In
# production prefer `kubectl create secret generic ...` or an external secret
# manager over committing a filled value. NEVER commit a filled key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fak.secretsName" . }}
  labels:
    {{- include "fak.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $gw }}
  # Generate with: openssl rand -hex 32
  gateway-key: {{ $gw | quote }}
  {{- end }}
  {{- if and (eq $mode "proxy") $prov }}
  # Upstream provider key, if fronting a hosted model:
  {{ include "fak.providerSecretKey" . }}: {{ $prov | quote }}
  {{- end }}
{{- end }}
