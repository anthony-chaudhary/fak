# The reversibility preview-confirm gate (#3306, #2776): an irreversible or
# outward-facing tool call is HELD (REQUIRE_WITNESS/ESCALATE) pending an echoed
# confirm token or a switch to a compiled sidestep. The gate surfaces the token
# `REQUIRE_WITNESS` in-band; declaring it here makes `dos_check_reason REQUIRE_WITNESS`
# classify it as a known OPERATOR_GATE pause instead of UNCLASSIFIED drift. It is a
# pause, not a terminal denial: a compiled sidestep (e.g. `fak sync push`) clears it
# outright, and the confirm-token re-propose is the fallback for the raw gated call.
[reasons.REQUIRE_WITNESS]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A reversibility preview-confirm gate paused an irreversible or outward-facing call, pending an echoed confirm token or a switch to a compiled sidestep. A pause, not a terminal denial."
fix      = "Prefer the sanctioned compiled sidestep the refusal names (e.g. `fak sync push` for a gated `git push`) -- it avoids the gate entirely and needs no token. Otherwise re-propose the same call byte-identical with only the `_fak_confirm` key added (the command text binds the token; the free-text description does not)."
see_also = ["internal/adjudicator/reversibility.go", "internal/gateway/reversibility_note.go", "docs/notes/CONFIRM-GATE-DEADLOCK-2026-07-04.md"]

# Blast-radius containment W4 (#2716, epic #2712): the dispatch router scope-holds an
# issue whose declared paths intersect a LIVE known-bad signature (the internal/knownbad
# ledger, #2713), so a worker is not sent to walk straight into a shared bug. This is the
# structured refusal the skip carries, verifiable with
# `dos man wedge BLOCKED_BY_KNOWN_BAD --explain`. It is DISTINCT from
# BLOCKED_BY_HUMAN: dynamic (clears when the signature is released, not by a human action)
# and it holds ONLY the intersecting subset -- disjoint issues keep dispatching, so the
# fleet makes progress instead of a global stall.
[reasons.BLOCKED_BY_KNOWN_BAD]
category = "OPERATOR_GATE"
refusal  = true
summary  = "An issue was held back from dispatch because its declared paths intersect a live fleet known-bad signature; dispatching it would send a worker into a known shared failure. Holds only the intersecting subset -- disjoint work keeps dispatching."
fix      = "Wait for the known-bad signature to clear (auto-release, W6) or land the elected fixer (W5); an issue disjoint from every live signature dispatches normally. Floor: `fak dispatch route` / `fak dispatch skipped` known-bad hold over the internal/knownbad ledger."
see_also = ["internal/knownbad", "fak dispatch route", "fak dispatch skipped", "docs/blast-radius-containment-cohort.md"]

# Dependency soft-hold: an issue was held from dispatch because a prerequisite it named in its
# body ("depends-on:/blocked-by: #N") is still an OPEN candidate this tick. Self-clearing (the
# tick refetches the backlog, so the hold lifts the tick after the prerequisite closes) and
# fail-open (a closed/absent prerequisite never holds). DISTINCT from BLOCKED_BY_KNOWN_BAD (a
# live-ledger tree intersection) and BLOCKED_BY_HUMAN (a static router label): this is a
# body-declared inter-issue edge, honored as a SOFT hold, never a hard ban.
[reasons.BLOCKED_BY_OPEN_PREREQ]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A dispatchable leaf was held from dispatch because a prerequisite it declared (\"depends-on:/blocked-by: #N\") is still an open candidate this tick; dispatching it would run work ahead of its dependency. Holds only the dependent -- every leaf with no open prerequisite keeps dispatching."
fix      = "Let the named prerequisite close (the hold self-clears the next tick, since the backlog is refetched) or break the dependency edge in the issue body; a leaf whose prerequisites are all closed dispatches normally. Floor: `fak dispatch route` / `fak dispatch graph` prereq hold over the internal/dispatchorder engine."
see_also = ["internal/dispatchorder", "internal/dispatchtick", "fak dispatch route", "fak dispatch graph"]

# Blast-radius containment W5 (#2717, epic #2712): a SECOND `fak knownbad claim` on a
# signature already owned by a fixer is refused with this token and the WINNER's identity,
# so the losing agent gets a pointer to the elected fixer instead of racing a second edit to
# the shared tree. Exactly-one is enforced by the EXCLUSIVE dos lease
# (refs/fak/locks/knownbad-<sig>), not by ledger bookkeeping; this is the structured,
# verifiable form of that refusal (`dos man wedge KNOWN_BAD_ALREADY_CLAIMED --explain`).
# DISTINCT from BLOCKED_BY_KNOWN_BAD:
# that holds a DISPATCH candidate off an intersecting tree; this elects the single agent that
# OWNS the fix (so the held issues have a nameable owner to park behind).
[reasons.KNOWN_BAD_ALREADY_CLAIMED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A `fak knownbad claim` lost the fixer election: a different agent already holds the exclusive lease electing it as this known-bad signature's sole fixer. The refusal returns the current fixer's identity so the loser parks behind them instead of racing a second edit to the shared tree."
fix      = "Park behind the named fixer (the W4 scope-hold points held issues at them) and wait for the witness-gated auto-release (W6); do not open a competing fix. Floor: `fak knownbad claim <signature>` over the exclusive-lease seam (internal/leaseref)."
see_also = ["internal/knownbad", "fak knownbad claim", "internal/leaseref", "docs/blast-radius-containment-cohort.md"]

# Blast-radius containment W6 (#2718, epic #2712): `fak knownbad resolve` refuses to close a
# signature that has NO independent witness of the fix. Clearing a known-bad on the fixer's
# self-report ("I fixed it") is exactly the failure this repo's witness discipline forbids --
# an unproven claim must not release the parked fleet. So resolve runs the witness FIRST (a
# green `go test`/`fak affected` over the broken tree, and/or a `dos verify` binding the
# fixer's commit to the signature's tree); a red or missing witness leaves the signature open
# and refuses with this token, naming the witness that failed. This is what makes the W4
# scope-hold safe to enter: parking is guaranteed to end on real evidence, never a claim.
[reasons.KNOWN_BAD_NOT_WITNESSED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A `fak knownbad resolve` was refused because the fix is not witnessed: the green test over the broken tree (and/or the `dos verify` binding the fixer's commit) did not pass, so the signature stays open and the parked fleet is NOT released. A self-report never clears a known-bad -- only an independent green/verify does."
fix      = "Land the real fix, then re-run `fak knownbad resolve <signature>` so the witness (a green `fak affected`/`go test` over the broken tree, or a `dos verify` on the fixer commit) passes; only a witnessed green flips open -> resolved and drops the fixer's lease. Floor: `fak knownbad resolve <signature> --witness tests|verify` over the internal/knownbad ledger."
see_also = ["internal/knownbad", "fak knownbad resolve", "internal/affectedtests", "docs/blast-radius-containment-cohort.md"]

# Blast-radius containment W8 (#2720, epic #2712): a `fak knownbad claim`/`resolve`/`revoke`
# was aimed at a signature that WAS recorded but is no longer live -- its bounded TTL lapsed
# (auto-expired), an operator revoked it, or it was already resolved. There is nothing left to
# act on: the signature already stopped matching, so the fleet is already released. This is the
# safety-valve's structured "you are chasing a phantom" signal -- distinct from a plain usage
# error for a signature that was NEVER recorded (a typo'd/made-up id, which stays a bare exit-2
# because there is nothing to point the caller at). W8 is what makes scope-hold trustworthy: a
# hold that cannot self-expire is a liability, so every signature carries a bounded TTL AND a
# revoke escape hatch, and this reason names the refusal a worker gets for acting on one that
# has already released. DISTINCT from KNOWN_BAD_NOT_WITNESSED (that is a LIVE signature whose
# resolve lacked a witness -- still held); this is a signature that is already GONE.
[reasons.KNOWN_BAD_EXPIRED_OR_REVOKED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A `fak knownbad claim`/`resolve`/`revoke` targeted a signature that is no longer live: its bounded TTL lapsed (auto-expired), an operator revoked it, or it was already resolved. The signature already stopped matching -- there is nothing left to claim, resolve, or revoke, and the parked fleet is already released."
fix      = "Stop chasing the aged-out/revoked signature -- the hold has already lifted, so the intersecting work is dispatchable again. If the failure is genuinely still live it re-fires and re-records a fresh signature (with a fresh TTL); act on THAT. Floor: `fak knownbad match --tree <tree>` returns matched:false for an expired/revoked signature over the internal/knownbad ledger."
see_also = ["internal/knownbad", "fak knownbad revoke", "fak knownbad match", "docs/blast-radius-containment-cohort.md"]

[reasons.GATE_LATENCY_REGRESSION]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A guard or DOS gate grew slow enough to threaten the loop's dev-ex latency budget, so the loop should not normalize the regression as healthy."
fix      = "Measure the gate with the relevant hook/status benchmark, fix or budget the added latency, and rerun before claiming the loop is healthy."
see_also = ["tools/dos_hook_bench.py", "docs/perf-dos-hook-cost.md", "dos status"]

[reasons.CRASH_RESTART_EXHAUSTED]
category = "OPERATOR_GATE"
summary = "The guarded harness crash-looped without shipping progress and exhausted its safe in-place restart runway."
fix = "Inspect the CHILD_CRASH rows with `fak guard restart-audit`, repair the systematic harness fault, then start a fresh guarded session; do not raise the limit to mask the loop."
source = "fak guard crash-restart no-progress reap (#4687)"
[reasons.HOST_CHURN_BACKOFF]
category = "OPERATOR_GATE"
refusal  = true
summary  = "the spawn preflight refused because a whole-host process-spawn STORM is the sole binding admission term -- several independent dispatchers (e.g. FleetIssueDispatchCodex + FleetIssueDispatchGlm + `accounts launch`) co-launched waves in the same window, so the fleet froze at its live count and admits no new concurrent load onto a saturated scheduler until the burst subsides. This is the CROSS-dispatcher gate the per-loop cadence floor (loopmgr MinIntervalSeconds) cannot see: each loop passes its own floor yet they still co-arrive and storm the kernel scheduler/memory-manager path while CPU/RAM read low (the soft-fault/spawn-churn lockup)."
fix      = "let the co-launched burst drain and stagger the dispatchers so they do not fire waves at the same instant; the preflight re-admits once host spawns in the last sample interval fall below the threshold. Tune with FAK_CHURN_BURST_THRESHOLD / FAK_CHURN_MIN_WORKERS (0/off disables). The fold abstains below the threshold, holds a cold-start probe, and never RAISES the cap. Floor: go test ./internal/dispatchtick -run TestApplyChurnBackpressure."
see_also = ["internal/dispatchtick/preflight_churn.go", "internal/stallscan/stallscan.go", "cmd/fak/stallscan.go", "RATE_LIMIT_BACKOFF", "GATE_PRESSURE"]

[reasons.RUN_STATUS_CLAIMED_FIELD]
category = "STALE_CLAIM"
refusal  = true
summary  = "`dos status` returned a run digest containing a `claimed` field, violating the witnessed-status contract that peers read liveness/progress from evidence only."
fix      = "Fix the status producer so the digest contains only liveness, ledger-verified progress, lease region, and resume evidence; do not consume claimed status."
see_also = ["dos status", "tools/dispatch_status.py"]

[reasons.PIN_EVICT_REFUSED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a compaction plan would have evicted a PINNED context page -- a system invariant, the active steer, or the continuation seed -- so the gateway forwarded the body UNCHANGED instead of compacting lossily. The survival class is assigned deterministically from the page's kind (ctxplan.ClassOf), never from model output, so no prose a model emits can pin itself into the protected set or talk a page out of it."
fix      = "raise --compact-history-budget above the pinned floor, or shed load elsewhere (fewer resident tools, a smaller steer). A refusal means the budget cannot hold the state the session needs to stay correct -- do NOT work around it by dropping the pin, which is the silent context loss the class exists to prevent. Floor: go test ./internal/gateway -run 'TestPinEvictRefused|TestPinnedPageSurvivesCompaction'"
see_also = ["internal/ctxplan/survival.go", "internal/gateway/pinsurvival.go", "internal/gateway/messages.go"]

[reasons.ARCH_LAYER_VIOLATION]
category = "OPERATOR_GATE"
refusal  = true
summary  = "change breaks the layered-DAG import contract (an upward/cross-tier import, or a new leaf with no declared tier)"
fix      = "invert the dependency through a registration seam or push the shared type down a layer; declare a new leaf's tier in internal/architest (or run `fak new-leaf`). Floor: `.\\fak\\test.ps1 ./internal/architest/`"
see_also = ["fak/internal/architest/architest_test.go", "fak/ARCHITECTURE.md", "fak/GROWTH.md"]

[reasons.NEVER_AMEND_SHARED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a git command would rewrite shared trunk history -- commit --amend, rebase, pull --rebase, or force-push -- risking permanent loss of a peer's witnessed commit."
fix      = "Make a new path-scoped commit, or fetch and merge the configured trunk in place, and push only with a plain fast-forward push -- never amend, rebase, or force-push in the shared tree. Floor: internal/gitgate refuses the argv-decidable shapes before the command runs."
see_also = ["internal/gitgate", "AGENTS.md", "tools/githooks/pre-push", "tools/githooks/reference-transaction"]

[reasons.OUT_OF_DIRECTION]
category = "OPERATOR_GATE"
refusal  = true
summary  = "request-path logic in an untyped language, or a non-Go package blank-imported into the kernel (DIRECTION.md)"
fix      = "keep the request path Go-only; a non-Go seam must be off-path and cross a typed, re-validated boundary. Floor: architest TestHotPathHasNoExec"
see_also = ["fak/DIRECTION.md", "fak/internal/architest/architest_test.go"]

# Trunk discipline: work lands directly on [branch_roles].development_branch as a
# SINGLE working tree, not on stray feature branches / per-issue worktrees. This is the cross-agent "stay on the trunk"
# policy turned into DOS vocabulary -- the same structured-reason discipline fak imposes
# on tool results, aimed at the fleet's own git workflow so Claude, Codex, and humans
# share ONE refusal instead of three doc sentences that only one of them reads. The named
# floor is the git hook (tools/githooks/reference-transaction), which fires below the
# agent layer; `python tools/install_trunk_guard.py` activates it per clone.
[reasons.OFF_TRUNK]
category = "OPERATOR_GATE"
refusal  = true
summary  = "work landed off the configured development trunk -- a new branch/worktree was created or an everyday commit targeted a branch other than [branch_roles].development_branch. Every worker MUST stay on the configured development branch in the shared worktree; creating a side branch/worktree to route around a dirty or diverged tree is the specific anti-pattern this reason names."
fix      = "commit directly to [branch_roles].development_branch with small, path-scoped commits; pull/merge frequently, preferring merge or pull --no-rebase when unrelated dirty files are present. `git commit -- <paths>` and merge never need a clean tree, so a worktree is never required to ship -- a dirty/diverged tree means WAIT or merge in place, never escape into a side tree; if you truly cannot proceed on the configured development branch, STOP and surface the blocker. Floor: tools/githooks/reference-transaction blocks off-trunk branch creation by default; set FLEET_TRUNK_GUARD=warn for advisory mode, or FLEET_ALLOW_BRANCH=1 to override once (release tooling only)."
see_also = ["CLAUDE.md", "AGENTS.md", "tools/githooks/reference-transaction", "tools/install_trunk_guard.py"]

# Stale-base deletion: a `git commit -- <path>` (or `fak commit`) stages the
# WORKING-TREE copy of exactly the named pathspec, so a stale whole-file base
# SILENTLY drops a peer's pushed block even on a pure-add change. The content-level
# merge-base guard in internal/safecommit (FAK_STALE_BASE_GUARD=block|warn|off)
# refuses with this reason when the committed blob would delete a contiguous
# peer-added run present on origin/<trunk> but absent from the working tree.
[reasons.STALE_BASE_DELETION]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a pathspec commit would silently drop a peer's pushed block -- the working-tree copy of the named path is stale relative to origin/<trunk>, so committing it deletes a contiguous peer-added run the local change never touched"
fix      = "fetch + rebase/merge origin/<trunk> so the working-tree base includes the peer's block, then re-commit; never escape into a side tree. FAK_STALE_BASE_GUARD=warn for advisory mode, =off to disable. Floor: internal/safecommit checkStaleBaseDeletion (fail-open on a fresh base / absent ref)."
see_also = ["fak/internal/safecommit/stalebase.go", "fak/CLAUDE.md", "fak/AGENTS.md"]

# Fresh deletion: a commit that deletes a path added only a few commits ago is a
# strong stale-snapshot signature unless the message names the deletion. The
# commit-msg hook sees both the staged deletion set and the proposed message, so
# it can distinguish an intentional prune from collateral loss of peer work.
[reasons.FRESH_DELETION]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a staged commit deletes a path added within the recent trunk window, but the commit message does not mention that path -- the shape of a stale-snapshot commit silently reverting peer work"
fix      = "restore the path if the deletion is collateral; if it is intentional, name the deleted path in the commit message or override once with FLEET_ALLOW_FRESH_DELETE=1. FLEET_FRESH_DELETE_GUARD=warn softens and =off disables. Floor: fak hooks commit-msg FreshDeletionFindings."
see_also = ["internal/hooks/gate_freshdeletion.go", "fak/AGENTS.md", "issue #2320"]

[reasons.MESSAGE_RACE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a safecommit operation created a commit whose landed subject/body does not match the requested message -- a concurrent writer or hook path mis-bound the witness message"
fix      = "Leave the commit intact for review and recover the intended message in a follow-up witnessed commit or operator maintenance path -- do not push it, and avoid raw git commit on the shared tree. Floor: internal/safecommit post-commit message assertion."
see_also = ["internal/safecommit/safecommit.go", "issue #2196"]

# Hard-self core-lock enforcement (#1683): the commit path refuses an in-agent edit
# to self-grading machinery unless an independent maintenance witness is confirmed.
# The class is declared in internal/corelocks; safecommit consumes only the hard-self
# rows and leaves ordinary leaves plus softer classes on the existing advisory path.
[reasons.CORE_SELF_MODIFY]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a pathspec commit touches hard-self core-lock machinery -- a surface that can weaken the admission, witness, or ship-grade machinery that would catch its own bad edit"
fix      = "Use an operator/release maintenance path, or rerun `fak commit` with `--core-lock-maintenance-witness <claim>` only after an independent witness resolver confirms the maintenance claim -- do not clear this by self-report. The accepted commit records the confirmed witness on refs/notes/fak/decisions."
see_also = ["internal/corelocks", "internal/corelockaudit", "internal/corelockgate", "internal/safecommit/corelock.go", "dos commit-audit"]

# FrontierSWE score-parity gate (#1717): the typed refusal emitted when a fak
# FrontierSWE arm tries to claim a time-to-solution win while its score
# distribution regresses the raw arm. The predicate lives in internal/frontierswe:
# fak Avg/Best gated score, full-correct trial count, and speedup distribution
# (when raw has full-correct speedup trials) must be >= raw within tolerance.
[reasons.FRONTIERSWE_SCORE_PARITY_FAILED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a FrontierSWE fak arm failed the score-parity gate -- it is faster only by losing quality, so no TTS-win claim may be emitted"
fix      = "rerun or fix the fak-routed arm until ScoreParity(raw_trials, fak_trials) passes: fak Avg/Best gated score, full-correct count, and speedup distribution must not regress raw. Floor: go test ./internal/frontierswe -run TestScoreParity."
see_also = ["internal/frontierswe/score_parity.go", "docs/benchmarks/FRONTIERSWE-SCORING-PARITY.md", "FRONTIERSWE_SCORE_PARITY_FAILED"]

# Public-copy leak scan: the private canonical repo is the source for every
# future public export, so the redact-needles listed in PUBLIC-SCRUB-POLICY.md
# (operator Tailscale IPs, SSH user, machine paths, the .claude-agent-*
# config dir, the Go-module codename, operator hostnames, sibling-repo
# working-copy paths) must never enter THIS history in the first place. The
# named floor is the git hook (tools/githooks/pre-commit), which fires below
# the agent layer; `python tools/install_trunk_guard.py` activates it alongside
# the trunk guard. The export-time scrubber (tools/scrub_public_copy.py) is
# defense-in-depth; this hook is the primary gate.
[reasons.PUBLIC_LEAK]
category = "OPERATOR_GATE"
refusal  = true
summary  = "staged content matches a redact-needle -- operator-private info would enter the repo's history (the source for every public export)"
fix      = "remove the needle from the staged change, or redact it per PUBLIC-SCRUB-POLICY.md. Floor: tools/githooks/pre-commit blocks the commit by default; set FLEET_SCRUB_GUARD=warn for advisory mode, or FLEET_ALLOW_LEAK=1 to override once (only for new fake adversarial fixtures that intentionally trip a needle)."
see_also = ["PUBLIC-SCRUB-POLICY.md", "tools/githooks/pre-commit", "tools/scrub_public_copy.py", "tools/install_trunk_guard.py", "tools/check_committed_files.py"]

# File-admission gate: a staged path is PRIVATE-ONLY content that must never enter the
# PUBLIC tree -- the operator's lab GPU-server connection subsystem (cmd//internal/ *dgx*
# packages, cmd/slackgc) lives ONLY in the fak-private companion repo -- or it is
# regenerable junk (caches, compiled binaries, logs, demo output) or an oversized blob a
# forever-history public tree should not carry. This is the COMMIT-TIME, content-placement
# sibling of PUBLIC_LEAK (and of the write-time OUT_OF_TREE_WRITE below): the SAME
# public/private boundary, enforced on WHAT a path is rather than WHERE it resolves. Named
# floor: the git hook tools/githooks/pre-commit -> tools/check_committed_files.py, which also
# runs tree-wide in CI (--audit-tree).
[reasons.FILE_ADMISSION]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a staged path must not enter the PUBLIC tree -- it is private-only content (the lab GPU-connection subsystem cmd//internal/ *dgx* / cmd/slackgc, which lives only in fak-private), an un-grandfathered random script (.ps1/.sh/.bat/.cmd -- prefer Go sub-modules/applications), regenerable junk (cache/compiled/log/demo-output), or an oversized blob"
fix      = "move private-only code to the fak-private companion repo; write new tooling or automation as Go sub-modules (nested modules under tools/<name>/) or cmd applications rather than shell/PowerShell scripts; drop regenerable junk (it rebuilds) or gitignore it; put real data under experiments/ or testdata/; trim an oversized blob or use Git LFS. Floor: tools/githooks/pre-commit blocks the commit by default; set FLEET_FILE_GUARD=warn for advisory mode, or ALLOW_STRAY_FILE=1 to override once."
see_also = ["tools/check_committed_files.py", "tools/githooks/pre-commit", "PUBLIC-SCRUB-POLICY.md", "tools/repo_guard.py"]

# Out-of-tree write guard: a destructive/write op that escapes the repo into a
# SIBLING tree. work/ holds many sibling repos (fak/, fak-private/, fleet/, dos/,
# tools/, ...); a tool resolving a path one level too high writes into ANOTHER
# project. Born 2026-06-21: a build script wrote fak.exe into the sibling
# anthony-chaudhary/tools repo, which was then rm -rf'd. The named floor is a
# PreToolUse hook (not a commit-time hook like the reasons above) -- it fires
# BELOW the agent, before the tool runs. tools/repo_guard.py resolves every
# destructive/write target against the repo root and denies the out-of-tree ones
# (allow-listing the OS temp dir + ~/.cache); the FAK regex twin is
# examples/repo-guard-policy.json. Like the others this is purely ADDITIVE data:
# the hook fires only on a target that lands outside the workspace, so no in-repo
# work is ever refused; soften with FAK_REPO_GUARD=warn or off.
[reasons.OUT_OF_TREE_WRITE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a destructive or write op targets a path OUTSIDE this repo -- it would create / delete / overwrite inside a SIBLING tree (another project or git repo) or the workspace's parent, not the workspace itself"
fix      = "operate inside the workspace; send scratch to a temp dir (/tmp, ~/.cache), never a sibling. Floor: tools/repo_guard.py (a Claude Code PreToolUse hook in .claude/settings.json) resolves each target against the repo root and denies out-of-tree ones; set FAK_REPO_GUARD=warn for advisory, off to disable. FAK regex twin: examples/repo-guard-policy.json."
see_also = ["tools/repo_guard.py", "examples/repo-guard-policy.json", ".claude/settings.json", "DOGFOOD-CLAUDE.md", "tools/check_committed_files.py"]

# Shared Go build-cache deletion race (#10074): `go clean -cache` removes
# archives from the ambient action graph while concurrent build/vet processes may
# still reference them. Three independent sessions performed this operation at
# the same timestamp before a freshness build failed on missing stdlib archives.
# The compiled PreToolUse hook denies the executed command shape by default; the
# embedded guard policy mirrors it across the host shell aliases.
[reasons.BUILD_CACHE_CLEAN_RACE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "an agent-issued go clean requests deletion of the ambient Go build cache while peer build or vet processes may still reference its entries"
fix      = "use the managed isolated paths: fak-dev buildcheck --vet or fak validate --mine <paths>. For raw work, set GOCACHE to an explicitly allocated OS-temp directory and move only that exact owned directory to the platform Trash/Recycle Bin afterward. Go creates and trims caches automatically; do not clear the ambient cache opportunistically. For coordinated host maintenance only, launch the guarded session with FAK_REPO_GUARD_SEVERITY=BUILD_CACHE_CLEAN_RACE=off."
see_also = ["internal/repoguard/build_cache_clean.go", "cmd/repoguard/main.go", "cmd/fak/guard-default-policy.json"]

# Would-hang interactive commands (#2080): an interactive invocation assumes a
# human is watching; under a headless agent harness it is a silent hang (`git
# commit` opening an editor, `git rebase -i`, `vim`, `gh auth login`) or a
# silently-EOF'd no-op (`git add -p` with a closed stdin) -- either way a pure
# wasted turn. The same PreToolUse floor as OUT_OF_TREE_WRITE (the compiled
# cmd/repoguard hook) refuses the curated hang-certain forms BEFORE execution;
# each finding carries a `fix` pre-filling the runnable non-interactive
# equivalent. Pagers (`less`, bare `git log`) are deliberately NOT refused --
# they detect the missing TTY and degrade to `cat`.
[reasons.INTERACTIVE_HANG]
category = "OPERATOR_GATE"
refusal  = true
summary  = "the command waits for a human (an editor, an interactive prompt, a device-code login) and the session has no TTY -- it would hang the turn or EOF into a silent no-op"
fix      = "re-run the non-interactive equivalent the finding pre-fills: git commit -s -m \"...\" (never bare), git add -- <paths> (never -i/-p), GIT_SEQUENCE_EDITOR=: for a scripted rebase, gh auth login --with-token, the harness Edit/Write tools instead of vi/vim/nano. Floor: cmd/repoguard (PreToolUse hook); soften with FAK_REPO_GUARD=warn or off."
see_also = ["internal/repoguard/interactive.go", "cmd/repoguard/main.go", ".claude/settings.json", "AGENTS.md"]

# Long foreground sleep timers (#2366): a foreground `sleep 1500` / `Start-Sleep
# -Seconds 300` (bare, chained, or inside a poll loop) holds an agent turn open
# doing nothing when background waits (Monitor, run_in_background, ScheduleWakeup)
# exist for exactly this -- one audited session burned ~75 minutes of held-open
# turns polling a remote bench. The same PreToolUse floor (cmd/repoguard) surfaces
# the curated forms; ADVISORY-ONLY (refusal = false): even in enforce mode the
# hook prints the structured pointer and ALLOWS -- a legitimate long wait stays
# possible. Unresolvable durations (`sleep $T`) and backgrounded timers
# (`sleep 300 &`) pass untouched; the guard never guesses.
[reasons.FOREGROUND_SLEEP]
category = "OPERATOR_GATE"
refusal  = false
summary  = "a single foreground sleep timer at or over 120s in a Bash/PowerShell tool call -- it holds the turn open doing nothing while background-wait primitives exist for exactly this"
fix      = "wait in the background instead: Bash run_in_background with an until-loop, the Monitor tool, or ScheduleWakeup. Floor: cmd/repoguard (PreToolUse hook, advisory even under enforce); soften with FAK_REPO_GUARD=warn or off."
see_also = ["internal/repoguard/sleepwait.go", "cmd/repoguard/main.go", ".claude/settings.json"]

# Live Monitor output-file polling (#2374): Bash background jobs materialize
# tasks/<id>.output at launch, but Monitor streams do not materialize that file
# until the stream ends. A bare Read ENOENT invites verbatim polling. The
# repoguard PreToolUse hook refuses a Read of tasks/<id>.output only when <id>
# matches a live Monitor in the toolproc journal, and points the agent at the
# pushed Monitor stream instead of filesystem polling.
[reasons.LIVE_MONITOR_OUTPUT_READ]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a Read targets tasks/<id>.output for a Monitor that is still live; Monitor output files are not materialized until the stream ends, so polling the path produces bare ENOENT loops"
fix      = "Consume the pushed Monitor events and wait for the completion notification instead of Read-polling the output file while the Monitor is live; tasks/<id>.output appears only after the stream ends. Floor: cmd/repoguard (PreToolUse hook) plus the live toolproc journal."
see_also = ["internal/repoguard/monitor_read.go", "cmd/repoguard/main.go", "internal/toolproc", ".claude/settings.json"]

# Drive-stripped workspace `cd` (worker path-mapping): a headless worker's shell
# already starts IN the workspace, but a model reconstructing the absolute path
# sometimes drops the Windows drive letter and emits `cd /work/fak` for a
# C:/work/fak checkout. On the git-bash/MSYS host that produced it the tree lives
# at /c/work/fak, so the drive-less /work/fak resolves nowhere: the cd fails with
# "No such file or directory" and, chained under &&, aborts the whole turn (a top
# recurring failure class in the 2026-07-09 trajectory audit, session d5b3ed57).
# The rung fires ONLY on the workspace root with its drive stripped -- a form that
# provably cannot resolve on a drive-lettered host and always means the same
# mistake; drive-ful (C:/work/fak), MSYS (/c/work/fak), relative, and every cd on
# a drive-less real-POSIX host pass untouched.
[reasons.WORKSPACE_PATH_UNMAPPED]
category = "OPERATOR_GATE"
refusal  = false
summary  = "a Bash `cd` targets the workspace root with its Windows drive letter dropped (cd /work/fak for a C:/work/fak checkout) -- it resolves nowhere on this host, so the command and any && chain after it fail as a wasted turn"
fix      = "the shell already starts in the workspace, so drop the redundant cd; or use the host path the finding pre-fills: cd 'C:/work/fak'. Floor: cmd/repoguard (PreToolUse hook, advisory even under enforce); soften with FAK_REPO_GUARD=warn or off."
see_also = ["internal/repoguard/cdmap.go", "cmd/repoguard/main.go", ".claude/settings.json"]

# L3 cross-tenant prefix-share gate (#57): the two typed REFUSE reasons the read-path
# admission gate (internal/gateway/l3share.go -> AdmitL3SharedPage) cites when it refuses
# a cross-tenant L3 page. fak rides the control/admission path in FRONT of the external L3
# store's `mget`: that store is semantics-free (trusts the client hash, no content verify,
# no tenancy notion), so fak supplies the two rungs it structurally cannot -- G1 full
# content-verify and G4 scope/capability. Declared here so the tokens are CLOSED
# (validateable via `dos_check_reason`), DISTINCT (a collision is distinguishable from an
# access denial), and refusable -- the issue's "two REFUSE reasons are distinct, closed
# tokens" acceptance. Floor: `go test ./internal/gateway -run TestL3Share`.
[reasons.L3_CROSS_TENANT_SCOPE_DENIED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "G4 scope rung: a cross-tenant reader asked for an L3 page whose ShareScope does not reach across the trust boundary -- a page private to one agent (ScopeAgent) or bound to the owner's tenant (ScopeTenant), fetched by a DIFFERENT tenant. A capability check, not a namespace-prefix match."
fix      = "the page is not shareable across tenants; only an owner-marked fleet/public (ScopeFleet) page crosses the boundary. Mark the prefix ScopeFleet at the producer if it is genuinely public, or serve the reader its own tenant-scoped page. Floor: go test ./internal/gateway -run TestL3Share_CrossTenant."
see_also = ["internal/gateway/l3share.go", "internal/abi/types.go", "L3-DISAGGREGATED-CACHE-REIMAGINED.md"]

[reasons.L3_PAGE_DIGEST_MISMATCH]
category = "OPERATOR_GATE"
refusal  = true
summary  = "G1 verify rung: the bytes the L3 get returned do not hash to the digest the page CLAIMS (Ref.Digest) -- a hash collision or a mis-tag the semantics-free store cannot detect. Refused for EVERY reader, same-tenant included: a corrupt/ambiguous page is served to no one. A full-content digest recompute, not a truncated locality hash."
fix      = "Re-fetch / re-key at the store, or re-mint the page so its Ref.Digest is the true hex(sha256) of its content -- do not admit the page as-is, since the content address does not match its bytes. Floor: go test ./internal/gateway -run TestL3Share_DigestMismatch."
see_also = ["internal/gateway/l3share.go", "internal/abi/types.go", "internal/model/evict_test.go"]

# L3 producer-side fleet-stamp gate (#2508): the read-side G1/G4 gates above trust the
# ShareScope a page ALREADY carries; this is the missing producer half named in
# l3share.go's HONEST LIMIT comment -- a mis-stamped ScopeFleet crosses tenants with
# every reader-side gate green. FleetShareRegistry.StampL3Scope refuses a ScopeFleet
# stamp for any prefix the registry has not explicitly declared fleet-shareable.
[reasons.L3_UNWITNESSED_FLEET_STAMP]
category = "OPERATOR_GATE"
refusal  = true
summary  = "producer-side stamp rung: a ScopeFleet stamp was requested for a prefix the fleet-share registry never declared fleet-shareable -- an unwitnessed boundary-crossing stamp, refused before it can become a silent reader-side hole. ScopeAgent/ScopeTenant stamping is unaffected (only the boundary-crossing stamp needs a witness)."
fix      = "declare the prefix fleet-shareable at the producer (FleetShareRegistry.DeclareFleetShareable) if it is genuinely public, or stamp the page ScopeAgent/ScopeTenant instead. Floor: go test ./internal/gateway -run TestL3Share_UnwitnessedFleetStampRefused."
see_also = ["internal/gateway/l3share.go", "internal/abi/types.go", "L3_CROSS_TENANT_SCOPE_DENIED"]

# Self-tax overhead budget breach (#1150, epic #1147 T2): the closed-vocabulary token a
# per-rung/per-method overhead breach names. The plane declares an EXPECTED overhead
# envelope per lifecycle rung (internal/turntaxmeter overheadbudget.go -- a generous,
# scope-stated ceiling, not a measured p99); a span over its declared ns/token envelope
# reads back as THIS token rather than free-text prose, reusing the same closed-set
# discipline as the refusal vocabulary so a breach is emittable, verifiable, and
# refusable. A budget is an envelope with a stated scope, NOT a promise of zero cost: a
# rung that costs more but SAVES more is a net win, so the gate's red/green is a
# net-of-savings decision (epic T6), not this single-rung breach alone.
# Floor: `go test ./internal/turntaxmeter -run TestOverBudgetSpanReadsBackAsBreach`.
[reasons.OVERHEAD_BUDGET_EXCEEDED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A lifecycle rung's measured overhead (elapsed ns or tokens added) exceeded its declared per-rung/per-method budget envelope -- the 'expected' baseline a breach is defined against. The witness gate is subprocess-bound (it spawns git) and carries a deliberately wide envelope so a slow disk does not read as a kernel regression."
fix      = "Confirm the breach against the rung's declared envelope (internal/turntaxmeter.DefaultBudget); if it is a real regression, fix or re-budget the added overhead; if the rung also SAVES more than it costs, the net line (epic T6) decides red/green, not this single breach. Floor: go test ./internal/turntaxmeter."
see_also = ["internal/turntaxmeter/overheadbudget.go", "docs/notes/self-tax-performance-assurance-tracking-1147.md", "GATE_LATENCY_REGRESSION"]

# Bottom-up admission backpressure (#2221, gap G3 / risk R4 of the dynamic-range epic
# #2218): the closed token the spawn preflight names when degraded gate health is the
# SOLE binding admission term. EvaluatePreflight's four cap terms (max-workers, dos
# target, host cap, seat cap) flow admission DOWN the band ladder and consult NO gate
# signal, so a fleet keeps admitting workers onto a kernel whose guard-hook p99 has
# breached its budget -- the fast inner loop saturates while the slow outer loop
# commands more load. The fifth term (internal/dispatchtick.ApplyGateBackpressure)
# folds the MEASURED hook-latency rollup (and a standing OVERHEAD_BUDGET_EXCEEDED
# breach) UP into the effective cap: degraded gate health freezes the fleet at its live
# count and refuses with THIS token so the sweep terminates on it like any other
# refusal. The signal is the measured rollup, never a worker self-report; a thin sample
# abstains exactly as hooklat does (MinHookAlarmSamples), and the fold never RAISES the
# cap. Floor: `go test ./internal/dispatchtick -run TestApplyGateBackpressure`.
[reasons.GATE_PRESSURE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "the spawn preflight refused because degraded gate health is the sole binding admission term -- a measured guard-hook p99 over budget (GATE_LATENCY_REGRESSION) or a standing overhead-budget breach (OVERHEAD_BUDGET_EXCEEDED) froze the fleet at its live count, admitting no new worker onto a slow kernel."
fix      = "let the fleet drain and re-measure: reduce the hook path taxing every tool call (#2073) or fix the over-budget lifecycle rung until the p99 recovers under budget, then the preflight admits again. The fold abstains on a thin sample and never RAISES the cap. Floor: go test ./internal/dispatchtick -run TestApplyGateBackpressure."
see_also = ["internal/dispatchtick/preflight_gate.go", "internal/turntaxmeter/hooklat.go", "GATE_LATENCY_REGRESSION", "OVERHEAD_BUDGET_EXCEEDED"]

# The rate_budget admission cap term (the fifth term in the documented effective-cap
# formula, docs/safe-to-raise-cap-checklist.md: min(max-workers, dos target, host cap,
# seats, RATE BUDGET)). EvaluatePreflight folds the first four and ApplyGateBackpressure
# adds gate health; internal/dispatchtick.ApplyRateLimitBackpressure adds this one. When a
# backend's recent worker exits show a BURST of GENUINE concurrency rate-limit walls
# (transient 429/529 overload -- reason=rate_limit in the .witness sidecar), the fleet is
# storming a throttled seat: each extra concurrent spawn 429s on its first request, exits
# banner-only, and lands 0 commits. The fold counts those exits within a recent window (per
# backend) and, at/above the threshold, freezes the backend at its live count and refuses
# with THIS token so the sweep terminates on it and the loop routes to a DIFFERENT
# provider/backend (GLM/opencode, codex, another Claude seat) instead of re-storming the
# throttled one. DISAMBIGUATION (load-bearing): ONLY reason=rate_limit counts. A weekly/
# usage cap (usage_cap), a model-specific cap (model_unknown), and a login/credit wall
# (auth_wall) are each a DISTINCT classifier reason and are DELIBERATELY EXCLUDED, because
# backing off concurrency does not clear them (they need a seat reset, a model downgrade, or
# a re-login) and are owned by the seat gate / Layer-2 downgrade / auth flow -- freezing the
# fleet on a weekly-cap "429" would starve the multi-account goal exactly when the other
# providers are healthy. The signal is the classifier's own verdict from the worker log
# tail, never a self-report; a sub-threshold count abstains, the fold never RAISES the cap,
# and it never freezes below a one-probe cold-start floor.
# Floor: `go test ./internal/dispatchtick -run TestApplyRateLimitBackpressure`.
[reasons.RATE_LIMIT_BACKOFF]
category = "OPERATOR_GATE"
refusal  = true
summary  = "the spawn preflight refused because a burst of GENUINE concurrency rate-limit walls (transient 429/529 overload, reason=rate_limit) on this backend is the sole binding admission term -- the fleet was storming a throttled seat, so it froze at its live count and admits no new concurrent load until the burst ages out. Weekly/usage caps (usage_cap), model caps (model_unknown), and login walls (auth_wall) are excluded -- they are not concurrency backoff."
fix      = "let the throttled backend drain and route new work to a DIFFERENT provider/backend (GLM/opencode, codex, another Claude seat) while the 429 burst ages out of the window; the preflight re-admits this backend once recent rate_limit exits fall below the threshold. Tune with FAK_RATELIMIT_WINDOW / FAK_RATELIMIT_MIN_429 (0/off disables). The fold abstains below the threshold and never RAISES the cap. Floor: go test ./internal/dispatchtick -run TestApplyRateLimitBackpressure."
see_also = ["internal/dispatchtick/preflight_ratelimit.go", "internal/dispatchtick/witness.go", "docs/safe-to-raise-cap-checklist.md", "GATE_PRESSURE"]

# Focus WIP-breadth backpressure (#3223, focus & priorities track #281/#2443): the dispatch
# tick folds the focusscore breadth signal (the count of ACTIVE trajectory-control objectives
# vs the pinned WIP cap, re-derived from docs/nightrun/trajctl.jsonl -- no new source of truth)
# into the spawn decision. When the fleet is at/over the WIP cap AND a spawn would OPEN a NEW
# concurrent objective, the tick emits this token so a loop/operator sees a focus hold/warn
# distinctly from a rate-limit (RATE_LIMIT_BACKOFF) or collision (COLLISION_RISK) hold. It is
# WARN-FIRST (advisory, still dispatches) by default -- refusal=false -- and only becomes a hard
# hold under the explicit --focus-hold / FLEET_DISPATCH_FOCUS_HOLD opt-in. It NEVER blocks work
# that CONTINUES an already-open objective: it bounds fan-out, not convergence.
[reasons.FOCUS_WIP_SATURATED]
category = "OPERATOR_GATE"
refusal  = false
summary  = "A dispatch spawn would OPEN a new concurrent objective while fleet breadth is at/over the focusscore WIP cap (active objectives >= cap). Warn-first: advisory by default (still dispatches), upgraded to a hold that skips the new-objective spawn under --focus-hold / FLEET_DISPATCH_FOCUS_HOLD. Continuation of an already-open objective is never held -- this bounds fan-out, not convergence work."
fix      = "Converge before broadening: pause or meet an active objective to get back under the WIP cap, or continue an already-open objective (never held) instead of opening a new one. The signal is re-derived from the trajctl ledger -- lower it by converging, not by editing a file. Tune posture with --focus-hold / FLEET_DISPATCH_FOCUS_HOLD. Floor: go test ./internal/dispatchtick -run TestEvaluateFocusAdmission."
see_also = ["internal/dispatchtick/preflight_focus.go", "internal/focusscore/focusscore.go", "cmd/fak/dispatch_tick_focus.go", "RATE_LIMIT_BACKOFF", "COLLISION_RISK"]

# Depth gate (internal/depthadmit): the DEPTH mirror of FOCUS_WIP_SATURATED. The focus
# token above bounds fan-out -- it refuses OPENING another objective while the fleet is
# broad. Nothing bounded the other end: an objective whose Plan declares six phases could
# be closed `met` with one phase witnessed, and every downstream fold read it as a clean
# close, because trajctl's curve measures MOTION (HEALTHY/STALL/DRIFT) and focusscore
# measures BREADTH (active count vs cap) and neither can see a line that stopped short.
# So `fak trajctl close --status met` is now adjudicated against the declared plan: every
# phase needs a witness in the LATEST W3 witnessed-commit-progress row (the row whose
# evidence the commit scorer only writes for a phase whose commit resolved to
# EvidenceVerified). Latest row, not the union -- crediting every row a scoring pass ever
# wrote would keep crediting a phase whose commit later went dangling.
# An objective with NO plan is refused too: `met` with nothing declared claims a depth
# nobody can check, which is the shallow-close hole in its purest form. `abandoned` is
# NEVER refused -- it claims nothing, and refusing it would only trap dead objectives open
# -- but the depth reached is recorded on the way out.
# Floor: `go test ./internal/depthadmit` and `go test ./cmd/fak -run TrajctlDepth`.
[reasons.DEPTH_NOT_CARRIED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "a `met` closure claims an objective's goal was reached while its declared plan is NOT carried -- some declared phase has no witness in the latest W3 witnessed-commit-progress row, or no plan was declared at all (a met with nothing declared claims a depth nobody can check). This is the depth mirror of FOCUS_WIP_SATURATED: that token bounds fan-out, this one refuses a line of work that stopped short. `abandoned` is never refused, only recorded."
fix      = "carry the remaining phases: bind each landing commit with a `Trajctl-Phase: <phase-id>` trailer, then `fak trajctl score --objective <id>` to witness them, and re-close. `fak trajctl depth --id <id>` prints the frontier -- the first phase with no witness -- which is the concrete next step. If the line is genuinely dead, close it `--status abandoned` (never refused) instead of claiming it met. One-shot escape: `--force`, which closes shallow and says so on stderr. Floor: go test ./internal/depthadmit; go test ./cmd/fak -run TrajctlDepth."
see_also = ["internal/depthadmit/depthadmit.go", "cmd/fak/trajctl_depth.go", "internal/trajctl/commitscorer.go", "FOCUS_WIP_SATURATED", "LOOP_DONE_UNWITNESSED"]

# Deployment session-ceiling backpressure (#3425, epic #3256 Workstream E: the all-in-one
# deployment). The runtime-boundary projection of the fleet's admission machinery for the
# SINGLE deployment: an operator configures the maximum number of concurrent governed
# sessions the box holds (FAK_MAX_SESSIONS), the runtime publishes live saturation vs that
# ceiling as the /metrics gauge fak_gateway_session_saturation, and past the ceiling a NEW
# session's admission is shed at the served boundary with this closed reason — a 503 +
# Retry-After, before the model is consulted. A trace already RESIDENT in the session
# registry is always admitted, so an in-flight loop is never sacrificed to admit a new one.
# Doctrine: no silent caps — when the deployment bounds concurrency it SAYS so, with a
# reason, and fails closed under pressure rather than thrashing the loops in flight. Inert
# (never fires) when no ceiling is configured.
# Floor: `go test ./internal/gateway -run TestSessionCeiling`.
[reasons.SESSION_CEILING_SATURATED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "the all-in-one deployment is at its configured concurrent-governed-session ceiling (FAK_MAX_SESSIONS): a NEW session's admission is backpressured at the served boundary (503 + Retry-After) with this reason, before the model is consulted. Sessions already in flight are never refused — only the new session is shed — so saturation sheds new load instead of degrading the loops already running."
fix      = "let an in-flight session finish (headroom frees the next scrape) and retry the new session, or scale the deployment out / raise FAK_MAX_SESSIONS if the host genuinely has capacity. Size the ceiling from the sizing model in docs/fak/deployment-guide.md and watch the fak_gateway_session_saturation gauge to scale BEFORE saturation. A zero/unset ceiling never fires this. Floor: go test ./internal/gateway -run TestSessionCeiling."
see_also = ["internal/gateway/session_ceiling.go", "internal/gateway/session_admit.go", "docs/fak/deployment-guide.md", "RATE_LIMIT_BACKOFF", "GATE_PRESSURE"]

[reasons.COMPACTION_THRASH]
category = "OPERATOR_GATE"
refusal  = true
summary  = "the served session's context window refilled to the compaction limit on 3 consecutive turns (#2424): history compaction FIRED every one of those turns and bought no lasting headroom, so the session is spending a compaction per reply and making no progress against its window. Detection and the /metrics count are always on; the session STOP that carries this reason at the served boundary is armed only by FAK_COMPACTION_THRASH_STOP."
fix      = "restart the work in a FRESH window seeded from durable state (commit, plan, ledger) rather than letting the same transcript re-fill — tightening --compact-history-budget only compacts more often and changes nothing, because the binding constraint is the traffic, not the budget. Shrink the per-turn floor instead: window large reads, summarize bulky tool results, and drop tools the run does not use. Watch fak_gateway_compaction_thrash_sessions_total before arming the stop. Floor: go test ./internal/gateway -run TestCompactionThrashVerdict."
see_also = ["internal/gateway/ctxadvice.go", "internal/gateway/ctxvalue.go", "internal/gateway/session_admit.go", "SESSION_CEILING_SATURATED", "BUDGET_CONTEXT_EXHAUSTED"]

# Verification-ladder INDETERMINATE (#1210, C2/G2 of the agent-programming-grammar
# epic #1208): the first-class verdict the declarable verification ladder
# (docs/standards/verification-ladder-spec.md) folds to when a cheap rung could NOT
# conclusively decide and the ladder exhausted without a costlier rung resolving it.
# It is the kernel's shipped VerdictIndeterminate (internal/abi/types.go,
# FoldRank 15 between Defer and Transform in internal/abi/registry.go; the lazy fold
# in internal/kernel/kernel.go makes it non-committable -- a residual Indeterminate
# yields Deny) lifted into the closed REFUSAL vocabulary so a ladder's fail-closed
# deny carries a dos_check_reason-validatable token instead of free text. Distinct
# from a fail-open allow and from a bare DEFAULT_DENY abstention: it names "I could
# not decide cheaply; the costlier rung was unavailable, so fail closed -- escalate,
# never silently allow." Pure DATA: it introduces no spontaneous refusal, it only
# gives the ladder's existing fail-closed tail a checkable name.

[reasons.OBJECTIVE_SCORER_MISSING]
category = "OPERATOR_GATE"
summary = "A dispatch objective has no attached witnessed scorer."
fix = "Add a non-empty Witness section to the issue contract that names the independent progress evidence, then dispatch again."

[reasons.INDETERMINATE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "Verification-ladder rung could not CONCLUSIVELY decide the claim cheaply and the ladder exhausted with no costlier rung available -- the residual indeterminate folds to a fail-closed deny (escalate, never silently allow). The kernel-side VerdictIndeterminate (internal/abi/types.go) is non-committable by construction; this token names the ladder's fail-closed tail."
fix      = "Consult a costlier rung that can conclusively decide (require-witness / CI / git-evidence / isolated-worktree keep-bit / human ESCALATE), or accept the fail-closed deny. The ladder is DATA: declare a sufficient rung whose max_risk covers the claim's risk class in the dos.toml [ladder] (docs/standards/verification-ladder-spec.md). Floor: go test ./internal/kernel (the shipped lazy fold + residual-Indeterminate-fails-closed)."
see_also = ["docs/standards/verification-ladder-spec.md", "docs/notes/verification-ladder-doctrine.md", "internal/abi/types.go", "internal/kernel/kernel.go"]

# CHECKER_TAMPERED (checker-pin integrity, internal/safecommit/checkerpin.go): the grade-arm twin
# of STALE_RECALL. A run declares the checker/test file its grade is judged against and PinCheckers
# fingerprints it at declare-time; if those bytes move before grade-time, the grade is keyed on a
# checker that CHANGED -- the "grade the grader" hole where a red result is flipped green by editing
# the checker instead of the code. STALE_CLAIM, not OPERATOR_GATE: exactly like a stale recall, the
# pass claim is stale relative to its pinned witness, so a close arm refuses it rather than ratifies
# it. Declaring the token here makes `dos_check_reason CHECKER_TAMPERED` classify it as a known,
# refusable STALE_CLAIM (not UNCLASSIFIED prose-drift) and `dos_refuse_reasons` list it. Producer:
# safecommit.GuardCheckerPin, consulted by a witness/close arm; floor: go test ./internal/safecommit.
[reasons.CHECKER_TAMPERED]
category = "STALE_CLAIM"
refusal  = true
summary  = "A run's DECLARED checker/test file changed bytes between declare-time (when its content was pinned) and grade-time, so the grade is judged against a checker that MOVED and is not evidence: the 'grade the grader' hole where a red result is flipped green by editing the checker instead of the code. The pass claim is stale relative to its pinned witness."
fix      = "Restore the checker to its declared bytes and re-grade, or -- if the checker change was intentional -- re-declare the run so its baseline is re-pinned against the new checker before grading. Producer: safecommit.GuardCheckerPin(root, baseline); an unchanged checker passes through untouched. Floor: go test ./internal/safecommit (checkerpin_test.go: changed->refused, unchanged->pass-through)."
see_also = ["internal/safecommit/checkerpin.go", "internal/safecommit/checkerpin_test.go", "dos_refuse_reasons", "dos_check_reason"]

[reasons.TEST_TAMPER_REFUSED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "Tool call attempted to write or edit gating test files under an implementation lane."
fix      = "Modify only implementation files in your assigned lane; test modifications are forbidden."
see_also = ["internal/adjudicator", "internal/witness"]

[reasons.UNWITNESSED_NARRATION_CLAIM]
category = "STALE_CLAIM"
refusal  = true
summary  = "Turn asserted test completion or verification pass in assistant text without matching execution receipts in session trajectory."
fix      = "Run the tests or verification command using available tool calls so the session trajectory contains verifiable 3rd-party execution receipts before claiming done. Producer: loopgate.AdjudicateTurn."
see_also = ["internal/loopgate/narration_gate.go", "dos_refuse_reasons", "dos_check_reason"]

[reasons.UNWITNESSED_DENOMINATOR]
category = "STALE_CLAIM"
refusal  = true
summary  = "Benchmark evaluation report or census failed complete denominator accounting: dropped tasks, uncataloged tasks, duplicated tasks, or unpermitted simulated results in hardware census."
fix      = "Ensure all tasks in the frozen manifest domain are accounted for: N_total = N_pass + N_fail + N_timeout + N_crash + N_refused, with no dropped instances. Producer: bench.VerifyCensusDomain."
see_also = ["internal/bench/denominator_census.go", "dos_refuse_reasons", "dos_check_reason"]

# #2522 (integration follow-on of the spine-first + fan-out epic #2510): the
# issue fanout planner's own contract rejections (internal/issuefanout.Refusal,
# e.g. a missing spine_ref, a cap below MinFanout, an unknown area filter, or --
# since #2511 -- an expanded candidate that fails the issue-contract review)
# named as a dos_check_reason-resolvable token so a fleet loop can route/recover
# mechanically instead of pattern-matching the free-text message. Advisory, not
# a hard refusal: one malformed Build() call should not block the rest of a
# dispatch loop's work.
[reasons.ISSUEFANOUT_CONTRACT_REFUSED]
category = "MISROUTE"
refusal  = false
summary  = "The issue fanout planner (internal/issuefanout.Build) refused an input that violates its declared contract -- a missing title/leaf/spine_ref, a --max cap below the fan-out floor (MinFanout), an unknown --area filter, or an expanded candidate that fails the issue-contract review (issuecontract.ReviewCandidate: a leaf outside the marker-key alphabet, or a title/spine tripping the private-boundary screen)."
fix      = "Fix the caller's input and retry: supply spine_ref (the shipped spine's witness), keep --max at or above MinFanout, pass a known --area (see AreaNames()), and keep every leaf inside the marker-key alphabet with no private-boundary text in the title/spine. ClassifyOutcome distinguishes this deliberate refusal from an unexpected internal error."
see_also = ["internal/issuefanout/issuefanout.go", "internal/issuefanout/outcome_test.go", "internal/issuefanout/edge_adversarial_test.go", "fak issue fanout"]

# Out-of-band operator control refusals (#2766, epic #2753): the closed tokens a
# CONTROL op refuses with when it is illegal for the session's current state. Pure
# DATA -- the refusals already exist (a terminal session rejects every drive-state
# write; a stale --if-rev loses its CAS race; a redirect against a finished
# objective is not applicable); these entries give each one a look-up-able closed
# name so an operator/agent can dos_check_reason it instead of parsing free text
# or an unexplained 409. Producers: internal/session ControlRefusalFor (the
# drive-state verbs), internal/sessionctl EnqueueRedirect/ApplyPendingRedirect
# (the redirect op). Witness: the table-driven applied/refused test across all
# ops, internal/agent/loop_control_witness_test.go.
[reasons.CONTROL_SESSION_TERMINAL]
category = "OPERATOR_GATE"
refusal  = true
summary  = "An out-of-band control op (cancel/pause/resume/throttle/budget/pace/priority) targeted a TERMINAL (Stopped) session -- a stopped session rejects every drive-state write: you cannot cancel a Stopped session, and you do not un-stop one."
fix      = "Start a fresh continuation instead of reviving the terminal record (session.Table.Recontinue / a new session), or target the live trace you meant. Floor: internal/session ControlRefusalFor over every Table write verb's terminal guard."
see_also = ["internal/session/ctlrefuse.go", "internal/session/table.go", "internal/agent/loop_control_witness_test.go"]

[reasons.CONTROL_REV_STALE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "An optimistic-concurrency (--if-rev) control write lost its CAS race: the session's drive record moved to a newer Rev between the caller's read and its write, so applying it would silently clobber a newer transition."
fix      = "Re-read the session's current state (Rev included) and retry the control op against the live revision. Floor: internal/session Table.CompareAndSet + ControlRefusalFor."
see_also = ["internal/session/ctlrefuse.go", "internal/session/table.go"]

[reasons.REDIRECT_MALFORMED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "An out-of-band redirect / set-objective op had no applicable shape -- an empty goal (nothing to redirect TO) or an empty session trace -- and was refused synchronously at the enqueue edge, never entering the session's mailbox."
fix      = "Send the redirect with a non-empty goal (and the target session's trace id); freeform prose belongs on the demoted steer escape hatch, not the structured redirect. Floor: internal/sessionctl Redirect.Validate at EnqueueRedirect."
see_also = ["internal/sessionctl/redirect.go", "internal/agent/loop_redirect.go"]

[reasons.REDIRECT_NO_REDIRECTABLE_STATE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "An out-of-band redirect targeted a session whose current objective is TERMINAL (met/abandoned) -- there is no live objective to redirect; reopening a finished objective is a restart, not an out-of-band op."
fix      = "Start a new session/objective for the new goal instead of redirecting the finished one; redirect only an active or paused objective. Floor: internal/sessionctl EnqueueRedirect + ApplyPendingRedirect against the live objective."
see_also = ["internal/sessionctl/redirect.go", "internal/agent/loop_redirect_test.go"]

[reasons.BROADCAST_MALFORMED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A fleet/lane-scoped broadcast (issue #2764) had no applicable shape -- an empty selector (an unstated set never means 'every session'), a nil session table, an op outside the closed control vocabulary, or a non-lifecycle op (steer/redirect/budget/priority) that cannot be fanned without a payload -- and was refused whole at the edge, before any session was touched."
fix      = "State at least one selector axis (--lane / --wave / --label) and fan only a lifecycle op (pause|resume|cancel|terminate|throttle); per-session refusals inside an accepted broadcast surface the drive table's own CONTROL_* tokens. Floor: internal/sessionctl Broadcast edge validation."
see_also = ["internal/sessionctl/broadcast.go", "internal/sessionctl/broadcast_test.go"]

# #5600 (child of the centralized-fleet-control epic #5599): the closed refusal
# vocabulary of the CROSS-PROCESS fleet control bus (internal/fleetbus) -- the layer
# above BROADCAST_MALFORMED, which fans one op inside ONE gateway's session table.
# The bus carries a directive to every announced INSTANCE and folds an ack back, so a
# control point can say "4 of 4 applied" and have that be falsifiable. The bus itself
# declares no ops (it is tier 1 and cannot see sessionctl); op MEANING lives in the
# serve-side applier, which is why UNKNOWN_OP and APPLY_REFUSED are separate tokens:
# one is "the bus carried a word this instance does not speak", the other is "this
# instance spoke it and said no". Producers of record: internal/fleetbus/fleetbus.go
# (Reasons) and cmd/fak/serve_fleetbus.go (the applier's outcomes).
[reasons.FLEETBUS_MALFORMED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A fleet-bus envelope could not be trusted as WRITTEN -- a missing or wrong schema tag, an id outside the [A-Za-z0-9._-] token grammar (ids are path segments, so '.' / '..' / a separator would escape the bus directory), an empty selector (an unstated set never means 'every instance'), a selector that states both --all and a filter, or an ack claiming a non-applied status with no reason token."
fix      = "Fix the envelope at its producer, not at the reader: state at least one selector axis or an explicit --all (never both), keep every id a bare token, and give every non-applied ack a closed reason. Floor: go test ./internal/fleetbus -run 'Validate|Selector'."
see_also = ["internal/fleetbus/fleetbus.go", "internal/fleetbus/fleetbus_test.go"]

[reasons.FLEETBUS_EXPIRED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A directive reached an instance after its TTL had run out, so the instance ACKED it expired instead of applying it. A control directive is a statement about NOW ('restart, the account was just added'); replaying an hour-old one against an instance that was down for that hour is a fresh action wearing a stale intent."
fix      = "Re-issue the directive if it is still what you want (`fak fleet control send` re-publishes with a new id), or raise --ttl for an op whose intent genuinely outlives the window. --ttl 0 means never expires -- state it deliberately. Floor: go test ./internal/fleetbus -run Expire."
see_also = ["internal/fleetbus/drain.go", "internal/fleetbus/fleetbus.go"]

[reasons.FLEETBUS_NO_TARGET]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A send resolved to ZERO instances -- the roster held no fresh instance the selector addressed -- so it was refused at the edge rather than published. Publishing to nobody would return a report that is trivially 'complete' (0 of 0 applied) and read as success; the denominator is the whole point of the roster."
fix      = "Run `fak fleet control instances` to see who is actually announced and fresh, widen or correct the selector, or arm the instances first (`fak serve --fleet-bus`). An instance silent for longer than the TTL is stale and is not a target. Floor: go test ./cmd/fak -run FleetControl."
see_also = ["cmd/fak/fleet_control.go", "internal/fleetbus/fold.go"]

[reasons.FLEETBUS_UNKNOWN_OP]
category = "OPERATOR_GATE"
refusal  = true
summary  = "An instance received a directive whose op is outside ITS control vocabulary and acked it refused. The bus is deliberately op-agnostic (it carries an opaque token), so a mixed-version fleet is a real state: the token names the instance that cannot speak the word, rather than dropping the directive and leaving it forever OUTSTANDING."
fix      = "Send an op the instance advertises (`fak fleet control instances` prints each instance's ops), or upgrade the instances that refused. A refused ack is a completed round trip -- the directive is accounted for, not lost. Floor: go test ./cmd/fak -run FleetBusApplier."
see_also = ["cmd/fak/serve_fleetbus.go", "internal/fleetbus/drain.go"]

[reasons.FLEETBUS_APPLY_REFUSED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "An instance KNEW the op and refused to apply it -- no live session matched, none were tagged into the stated lane/wave/label, the op needs a per-session payload a bare fan cannot name (redirect/budget/priority), or the local route refused it outright (a steer at a serve that owns no session loop carries STEER_NO_OWNED_LOOP through in the detail). An instance that matched nothing refuses rather than acking a hollow 'applied', because a fleet-wide 'everybody applied, 0 affected' is the accepted-but-never-applied phantom wearing a success token."
fix      = "Read the ack's detail -- it names WHICH nothing this was and each is a different fix: start the serve with --native for steer, drop the session selector if the sessions are untagged, or use the single-session verb for a payload-carrying op. Floor: go test ./cmd/fak -run FleetBusApplier."
see_also = ["cmd/fak/serve_fleetbus.go", "internal/fleetbus/drain.go", "internal/gateway/http.go"]

# #3066 (child [GATE] of the TOON epic #3064): the closed skip-reason vocabulary
# the pure `toon.Decide(...)` governor returns instead of `Encode:true`. Each token
# names one checkable condition under which TOON auto-fire must NOT fire (keep JSON);
# the decision is expressed the way this repo expresses every decision — a single
# reason from a closed set, the dos_* / internal/ablate fail-loud posture. Registering
# them here is what makes `dos_check_reason` resolve each token (known, refusable) and
# `dos_refuse_reasons` list them, so a wiring/scorecard surface (#3067) can route on the
# token instead of parsing free text. Producer + closed set of record:
# internal/toon/decide.go (KnownSkipReasons).
[reasons.TABULAR_ELIGIBILITY_LOW]
category = "OPERATOR_GATE"
refusal  = true
summary  = "TOON auto-fire declined: TabularEligibility(payload) < τ. Nested / non-uniform data collapses TOON accuracy (independent nested-data benches rank TOON last) because the transform removes the repeated field-name anchors the model leans on -- an accuracy loss, not a saving."
fix      = "Keep JSON for this span -- it is not uniformly tabular. Only auto-fire TOON on flat, row-uniform payloads whose eligibility clears τ. Floor: go test ./internal/toon -run TestDecide."
see_also = ["internal/toon/decide.go", "internal/toon/score.go", "issue #3066"]

[reasons.PAYLOAD_TOO_SMALL]
category = "OPERATOR_GATE"
refusal  = true
summary  = "TOON auto-fire declined: rows < R_min or bytes < B_min. The fixed header (plus any primer) overhead is not amortized on a small payload, so the net token delta is <= 0."
fix      = "Keep JSON -- the payload is below the amortization floor. Auto-fire only once rows/bytes clear R_min/B_min so the fixed header cost is repaid. Floor: go test ./internal/toon -run TestDecide."
see_also = ["internal/toon/decide.go", "issue #3066"]

[reasons.NET_TOKENS_NONPOSITIVE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "TOON auto-fire declined: TOONTokens >= JSONTokens - margin, measured by the caller's real tokenizer (primer cost included). THE witness -- if the real tokenizer shows no win, there is no win; this gate makes 'never fire at a loss' a proof, not a hope."
fix      = "Keep JSON -- the measured token delta is non-positive. This is the safety invariant (never fire at a loss); do not override it with an estimate. Floor: go test ./internal/toon -run TestDecideNeverFiresAtALoss."
see_also = ["internal/toon/decide.go", "issue #3066"]

[reasons.CACHE_PREFIX_RESIDENT]
category = "OPERATOR_GATE"
refusal  = true
summary  = "TOON auto-fire declined: the span is already inside a cached prefix. Re-encoding turns a 0.1x cache read into a full-price recompute -- a cost-multiplier loss dressed up as a token saving. The cache-first kernel's dominant TOON hazard, distinct from an accuracy skip."
fix      = "Keep JSON -- the span is cache-resident, so re-encoding busts the prefix and costs more than it saves. Auto-fire TOON only on spans OUTSIDE the resident prefix. Signal wired by #3067. Floor: go test ./internal/toon -run TestDecide."
see_also = ["internal/toon/decide.go", "internal/agent/anthropic_cachebp.go", "issue #3066"]

[reasons.VOLATILE_SPAN]
category = "OPERATOR_GATE"
refusal  = true
summary  = "TOON auto-fire declined: the span head is volatile (the anthropic_cachebp.go headValueIsVolatile notion -- a per-turn-rewritten head). Encoding it thrashes the stable cache prefix."
fix      = "Keep JSON -- a per-turn-rewritten head must not enter the stable prefix as TOON. Auto-fire only on stable spans. Signal wired by #3067. Floor: go test ./internal/toon -run TestDecide."
see_also = ["internal/toon/decide.go", "internal/agent/anthropic_cachebp.go", "issue #3066"]

[reasons.MODEL_TOON_UNFIT]
category = "OPERATOR_GATE"
refusal  = true
summary  = "TOON auto-fire declined: the target model's TOON fitness is below phi and a primer will not close the gap within budget. Small/untrained models degrade on the format; the primer cost is counted against the saving."
fix      = "Keep JSON for this model -- its measured TOON fitness is below phi. Route TOON only to models whose fitness clears the bar (or where an in-budget primer closes it). Signal wired by #3067. Floor: go test ./internal/toon -run TestDecide."
see_also = ["internal/toon/decide.go", "internal/toon/score.go", "issue #3066"]

[reasons.ROUNDTRIP_LOSSY]
category = "OPERATOR_GATE"
refusal  = true
summary  = "TOON auto-fire declined: Decode(Encode(payload)) != payload. The correctness spine -- an encoding that cannot be proven reversible is never emitted."
fix      = "Keep JSON -- the round-trip is lossy, so the TOON encoding is not provably reversible. Fix the codec or leave the payload as JSON; never emit an unverifiable encoding. Floor: go test ./internal/toon -run TestDecide."
see_also = ["internal/toon/decide.go", "internal/toon/decode.go", "issue #3066"]

[reasons.OUTPUT_DIRECTION]
category = "OPERATOR_GATE"
refusal  = true
summary  = "TOON auto-fire declined: the payload is a response schema the model must PRODUCE. Model TOON *output* support is weak, so keep JSON -- TOON here is input-only."
fix      = "Keep JSON -- TOON auto-fire is input-only; a payload the model must emit stays JSON. Only encode inbound (model-consumed) spans. Floor: go test ./internal/toon -run TestDecide."
see_also = ["internal/toon/decide.go", "issue #3066"]

# The assumecheck outcome-class refusal bindings (#3822, epic #3818 C4): the pure
# kernel's three BLOCKING outcomes (internal/assumecheck Outcome.blocksReliance --
# everything except HOLDS) each resolve to ONE closed token here, so a caller refusing
# on a guarded assumption emits a reason `dos man wedge <TOKEN> --explain` resolves, instead of the
# per-assumption label (e.g. SEAT_NOT_LAUNCHABLE), which is folded into the verdict's
# reason text as detail. Bound to the Go floor by internal/assumecheck/dosreasons_test.go,
# mirroring toon's #3066 gate.
[reasons.ASSUMPTION_VIOLATED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A guarded assumption a caller relies on was checked and the declared witness REFUTED it: the assumed condition is provably false, so proceeding on it is refused."
fix      = "Fix the violated condition (or retire the assumption), re-witness with `fak assume check <id>` until the outcome is HOLDS, then retry the refused action. Floor: internal/assumecheck GuardAssumption."
see_also = ["internal/assumecheck/assumecheck.go", "internal/assumecheck", "dos man wedge ASSUMPTION_VIOLATED --explain", "fak assume check", "issue #3822"]

[reasons.ASSUMPTION_UNVERIFIABLE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A guarded assumption could not be witnessed either way -- the declared witness could not run, the evidence came from the wrong witness kind, or the only evidence is a self-report. Fail-closed: unverifiable is NOT holds."
fix      = "Wire or repair the assumption's declared witness so it can adjudicate, gather fresh evidence, then re-run `fak assume check <id>` until the outcome is HOLDS before relying on it. Floor: internal/assumecheck GuardAssumption."
see_also = ["internal/assumecheck/assumecheck.go", "internal/assumecheck", "dos man wedge ASSUMPTION_UNVERIFIABLE --explain", "fak assume check", "issue #3822"]

[reasons.ASSUMPTION_STALE]
category = "STALE_CLAIM"
refusal  = true
summary  = "A guarded assumption is about to be relied on, but its backing evidence has aged past its declared freshness bound relative to the witness's source of truth."
fix      = "Re-witness the assumption from its declared source (`fak assume check <id>` gathers fresh evidence), discard the stale evidence, then retry once the fresh witness confirms HOLDS. Floor: internal/assumecheck GuardAssumption."
see_also = ["internal/assumecheck/assumecheck.go", "internal/assumecheck", "dos man wedge ASSUMPTION_STALE --explain", "fak assume check", "issue #3822"]

# A2A push-notification delivery rides an admission floor before any dial: the webhook
# host must be allowlisted, the scheme must be http(s), and an SSRF-range IP literal is
# refused unless loopback delivery was explicitly enabled. A target that fails is refused
# with this closed reason and NEVER dialed (refuse, don't guess) -- the exfil-floor
# discipline the gateway uses everywhere else, projected onto the disconnected-consumer
# webhook seam.
[reasons.WEBHOOK_URL_NOT_ALLOWLISTED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "an A2A push-notification webhook target is not admissible -- a non-allowlisted host, a non-http(s) scheme, a malformed URL, or an SSRF-range IP literal that was not explicitly permitted -- so delivery is refused and the outbound client is never dialed."
fix      = "register the receiver's host on the delivery allowlist (Server.SetA2APushWebhookAllowlist); use an http(s) URL with a public host, or explicitly enable loopback delivery for a deliberately-internal receiver. Floor: internal/gateway a2aWebhookAdmit refuses before any dial."
see_also = ["internal/gateway/a2a_pushnotify.go", "internal/gateway/a2a.go", "dos man wedge WEBHOOK_URL_NOT_ALLOWLISTED --explain"]

[reasons.LESSON_OVERCLAIMS]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A distilled look-ahead Lesson asserted more authority than the witness rung its rollout evidence earned -- a FACT from below-W3 (structured-activity or weaker) evidence, or ANY lesson from a W1 (judge) / W0 (self-report) rollout. The kernel does not believe the supervisor's foresight either: opinion and self-report never masquerade as a witnessed fact."
fix      = "Emit the lesson at the authority its evidence proves: a W2 rollout may flag a RISK (not a FACT); a W1/W0 rollout may assert nothing (fold it as a hypothesis, not a steer). Earn W3 (a witnessed commit / green suite / benchmark row) before asserting a FACT. Floor: internal/lookahead DistillLesson."
see_also = ["internal/lookahead/lookahead.go", "internal/trajctl/trajctl.go", "docs/notes/CONCEPT-LOOKAHEAD-RESET-2026-07-17.md"]

# The read-mostly overlay fence (#5032, epic #5015): the steer/prplan overlay
# (internal/steerpr + `fak steer prs` + `fak release prplan`) rebuilds the operator's unit
# of ATTENTION over the PR-free trunk. Its entire thesis is that the PR's gate function and
# its observability/steering function are separable -- you can have the second without the
# first. As the overlay grows (a hook here, a --check there, a CI wiring), the pressure to
# "just fail the commit when it's RESIDUAL" is enormous and entirely natural; continuous
# merge would die by accretion, not decision. OVERLAY_WOULD_GATE names that regression
# CLASS so any wiring that would let the overlay block a merge or fail a commit is refused
# with a citable token instead of landing one instance at a time. The structural floor is
# the architest steer-overlay gate family (`go test ./internal/architest -run Overlay`),
# which pins the fold leaf pure/git-free, every overlay subprocess provably read-only, and
# the --check exit code reachable only from the operator CLI dispatch.
[reasons.OVERLAY_WOULD_GATE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A change would wire the read-mostly steer/prplan overlay into a blocking path: an overlay code path reaching a git mutation (commit/push/reset/revert/merge/rebase/force-push), an overlay call that can fail a commit, or a --check exit code consumed by a commit, hook, or promotion path. The overlay's contract is observability WITHOUT a merge gate; a gating overlay is refused as a class, not patched as an instance."
fix      = "Keep the overlay advisory: derive git state only through read-only verbs (log/rev-parse/show/...), let --check report RESIDUAL solely from an operator or CI reporting invocation, and keep commit/hook/promotion paths free of overlay references (fold/render helpers stay fair game -- rendering is the overlay's job). If a gate is genuinely wanted, build it in the kernel's witness path (dos commit-audit / shipgate), never in the overlay. Floor: `go test ./internal/architest -run Overlay`."
see_also = ["internal/steerpr", "internal/architest/steer_overlay_floor_test.go", "cmd/fak/steer_prs.go", "cmd/fak/release_prplan.go", "dos man wedge OVERLAY_WOULD_GATE --explain"]

# The SPINNING progress verdict (#4956): the superloop walk's liveness verdict answers
# "is the loop ticking?", never "is it PRODUCING?" -- a loop that fires on cadence while
# its ledger-verified progress advances by nothing used to read clean. The walk now folds
# a per-loop PROGRESS verdict alongside liveness (superloop.ClassifyProgress): "advanced"
# is the exact relay.NoProgressEscape.Advances rule (verified step count rose past the
# high-water mark) over a relay.ReadVerifiedProgress read of the intent ledger -- never a
# self-reported keep. Only a THROUGHPUT (issue-drain) member trips this token on zero
# advance; a report/calibration cadence is legitimately idle and takes the idle rule
# (RELAY_IDLE_PARKED below). The token is relay's own G6 escape constant
# (internal/relay/noprogress.go ReasonNoProgress) lifted into the declared vocabulary so
# the walk's SPINNING finding resolves through dos_check_reason instead of free text.
# Floor: go test ./internal/superloop -run 'Spinning|ClassifyProgress'.
[reasons.RELAY_NO_PROGRESS]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A relay/loop is SPINNING: ticking on cadence (live/stale) while its ledger-verified progress high-water mark did not advance -- legs/ticks are being spent with nothing a successor could re-verify. The read is relay.ReadVerifiedProgress over the intent ledger (never a self-reported keep) and 'advanced' is the exact NoProgressEscape.Advances rule; in the superloop walk only a throughput (issue-drain) member trips it, ranked as SPINNING debt worst-first."
fix      = "Escalate for a revive/redirect -- never auto-replan: point the loop at work that advances its verified ledger (the walk's worklist prints the revive/redirect entry per member), or stop paying for its ticks. If the loop believes it IS progressing, make its progress re-verifiable: record ledger rows with re-readable refs so ReadVerifiedProgress can see them. Floor: go test ./internal/superloop -run 'Spinning|ClassifyProgress'; go test ./internal/relay -run NoProgress."
see_also = ["internal/relay/noprogress.go", "internal/superloop/superloop.go", "cmd/fak/superloop.go", "RELAY_IDLE_PARKED"]

# The benign twin of RELAY_NO_PROGRESS (#4956): a watch/report member with no advance
# whose idleness is POSITIVELY proven -- the watched invariant HOLDS against a durable
# witness AND the ledger confirms zero admitted pending work (internal/relay/idle.go's
# IdleAwareEscape rule; relay's own vocabulary files this park under its true-drain
# family). Advisory, not a refusal: a correctly-idle watch loop parked on this token is
# healthy, and declaring it keeps the walk's benign park distinct from UNCLASSIFIED
# prose. Fail closed upstream: an UNPROVEN idle (unknown invariant, unread pending
# count, or pending work) never earns this token.
[reasons.RELAY_IDLE_PARKED]
category = "OPERATOR_GATE"
refusal  = false
summary  = "A watch/report relay or loop parked idle BENIGNLY: it made no verified progress this leg, but its watched invariant HOLDS against ground truth AND its ledger confirms zero admitted pending work (the positively-proven idle rule). Not a halt and not SPINNING -- a correctly-idle watch loop simply has nothing owed; it re-arms on a witnessed external event."
fix      = "Nothing to fix on a genuine park. If the member should NOT be idle, the park is disproven at the source: admit the pending work to its ledger (the nonzero pending count defeats the park) or record the invariant violation, and the next leg falls through to the ordinary no-progress path (RELAY_NO_PROGRESS). Floor: go test ./internal/relay -run Idle; go test ./internal/superloop -run ClassifyProgress."
see_also = ["internal/relay/idle.go", "internal/superloop/superloop.go", "RELAY_NO_PROGRESS"]

# The FOLLOW-ON sibling of RELAY_NO_PROGRESS (#4957): the progress verdict answers "is
# this loop producing at its OWN grain?"; this token answers "is anyone advancing what
# it PRODUCED?". A loop tick that emits downstream work (a durable relay.ArtifactIssue
# baton pointer, or the issue an a2achan.WorkerStatus names) reads as advancing even
# while the emitted issue sits OPEN with no advance past the cadence window -- progress
# at the loop grain, zero at the fleet grain. superloop.ClassifyFollowon folds the
# shell's emitted-refs-vs-live-issue-state join into the closed ORPHANED verdict and
# emits this token; fail-closed: an UNREADABLE emission is never fabricated into an
# orphan (FollowonUnknown, surface-only). The fleet meta-walk (#4958) weighs ORPHANED
# into its worst-first product (liveness x progress x follow-on) so an orphaned loop
# out-ranks every clean live leaf; the witness only surfaces the orphan -- the
# chase/redirect goes through the member's own front door, never a private re-dispatch.
# Floor: go test ./internal/superloop -run 'Followon|Orphaned'.
[reasons.RELAY_ORPHANED_FOLLOWON]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A member loop is ORPHANED-FOLLOWON: work it emitted (a durable baton issue ref) is OPEN with no advance within its cadence window -- the loop produces fine, but nobody advances its output, so its ticks buy nothing downstream. The verdict is superloop.ClassifyFollowon over durable issue/artifact state (never the member's own narration); the fleet meta-walk ranks it as ORPHANED debt worst-first."
fix      = "Chase or close the emitted work through the member's OWN front door (the walk's worklist prints the chase/redirect entry): route the orphaned issue to an owner who advances it, or stop emitting into the void. Never re-file or re-dispatch from the witness path. If the emission is genuinely being carried, make the advance visible: update/close the issue so the durable state shows it. Floor: go test ./internal/superloop -run 'Followon|Orphaned'; go test ./cmd/fak -run SuperloopFleet."
see_also = ["internal/relay/orphanfollowon.go", "internal/superloop/superloop.go", "internal/superloop/fleetwalk.go", "cmd/fak/superloop_fleet.go", "RELAY_NO_PROGRESS"]

# The resident skill-description ratchet (issue #5444, epic #3229): the userland twin of
# internal/mcpfootprint's MCP floor gates. #3234 shipped the MEASUREMENT (`fak skill
# footprint`) and closed; in the twenty days that followed, the measured resident floor grew
# 30.4% with nothing opposing it, because a number that cannot REFUSE a change is taste.
# internal/skillfootprint.CheckDescriptions is the refusal, and it is two-sided: growth is
# refused, and so is an unbanked trim -- otherwise recovered slack silently becomes headroom
# for the next skill and the ratchet stops ratcheting. Declaring both tokens here makes
# `dos_check_reason SKILL_DESC_BUDGET_EXCEEDED` classify them as known OPERATOR_GATEs an
# author clears by re-pinning the constant, not UNCLASSIFIED free-text drift. The floor under
# both is `go test ./internal/skillfootprint`, which prices the real `.claude/skills` tree.
[reasons.SKILL_DESC_BUDGET_EXCEEDED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The resident .claude/skills description floor -- the sum of every SKILL.md frontmatter `description`, held at rest and growing linearly with skill count -- rose above the committed ceiling skillfootprint.SkillDescriptionBudgetBytes. A new skill, or a fattened description on an existing one, added a per-session tax that no single author would otherwise see grow (issue #5444, the one-way ratchet over #3234's measurement)."
fix      = "Prefer trimming the description: the skill stays invocable by NAME, so the resident prose only has to say WHEN to load it, not what it does (the name-only floor is ~2% of the description floor). If the growth is justified, raise skillfootprint.SkillDescriptionBudgetBytes to the measured value in the SAME commit and re-pin the baseline block in docs/context-budget/skill-description-floor.md -- that diff line is the review the ratchet exists to force. Measure with `fak skill footprint --top 8`. Floor: `go test ./internal/skillfootprint`."
see_also = ["internal/skillfootprint/descbudget.go", "docs/context-budget/skill-description-floor.md", "fak skill footprint", "SKILL_DESC_BUDGET_STALE"]

[reasons.SKILL_DESC_BUDGET_STALE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The resident .claude/skills description floor fell materially below the committed ceiling skillfootprint.SkillDescriptionBudgetBytes -- a trim was won but never banked into the constant, so the recovered headroom would be silently refilled by the next skill added. Also the fail-closed reading of a broken probe: a skills tree that cannot be read folds to a zero floor and refuses here rather than greening on a measurement of nothing (issue #5444)."
fix      = "Re-pin skillfootprint.SkillDescriptionBudgetBytes DOWN to the newly measured floor and update docs/context-budget/skill-description-floor.md in the same commit, so the ratchet tightens. If instead the floor priced as zero or near-zero, the probe is broken, not the catalog: check that `.claude/skills` is present and readable from the working directory. Measure with `fak skill footprint --json`. Floor: `go test ./internal/skillfootprint`."
see_also = ["internal/skillfootprint/descbudget.go", "docs/context-budget/skill-description-floor.md", "fak skill footprint", "SKILL_DESC_BUDGET_EXCEEDED"]

# The bind-safety startup refusal (#5373, a child of #3279). `fak serve` refuses to bind a
# listener that is reachable from OFF THIS HOST while no inbound token door is configured --
# the shape the January 2026 internet-wide scan #3279 cites found 175,108 local-model servers
# in. The gate has shipped with its three-case test matrix since cmd/fak/serve_bind_safety.go
# landed, but the token it emits was never declared here, so `dos_check_reason
# UNAUTHENTICATED_OFF_HOST_BIND` classified fak's own structured refusal as UNCLASSIFIED prose
# drift -- exactly the failure the closed vocabulary exists to kill, on a security refusal.
# Declaring it completes that half of #5373's witness. Loopback binds and off-host binds that
# DO name a token door are never refused; the escape is deliberately verbose.
[reasons.UNAUTHENTICATED_OFF_HOST_BIND]
category = "OPERATOR_GATE"
refusal  = true
summary  = "`fak serve` was asked to bind an address reachable from off this host (0.0.0.0, ::, a bare :port, or a routable IP) while neither --require-key-env nor --key-principal configures an inbound token door, so every request the listener would serve is unauthenticated. Refused at startup rather than started silently. Loopback binds (the 127.0.0.1:8080 default, localhost, ::1), --stdio, and any off-host bind that DOES name a token door are unaffected."
fix      = "Arm a token door: `--require-key-env FAK_API_KEY` (single-tenant bearer) or `--key-principal <tenant>=<ENV_VAR>` (per-tenant keyset), with the named env var set. Or keep the listener local with `--addr 127.0.0.1:8080`. For the deliberate isolated-segment case where a host firewall does the work, pass --unsafe-allow-unauthenticated-bind, which binds anyway and prints a loud warning every boot."
see_also = ["cmd/fak/serve_bind_safety.go", "cmd/fak/serve_bind_safety_test.go", "docs/air-gapped-deployment-kit.md", "fak serve"]

# Bound the per-project `.dos/` scratch so a long-lived repo doesn't accrete audit
# reports without limit (the "never reap a live lease" floor is the collector's,
# independent of this number).
# Daily Git hygiene refusal vocabulary (#5589). These tokens are emitted by
# internal/gitdaily.Refusal when a scheduled tick cannot establish its serializer, safely
# clean proven-orphan locks, complete guarded maintenance, or persist its witness. TICK_BUSY
# is advisory because another live tick already owns the mutator; the remaining outcomes
# require operator recovery before the scheduler retries.
[reasons.INVALID_OPTIONS]
category = "MISROUTE"
refusal  = true
summary  = "fak git-daily was invoked without a complete repository identity, so the unattended tick cannot safely choose its Git common directory or ledger."
fix      = "Run fak git-daily from the target clone, or set RepoRoot from `git rev-parse --show-toplevel` and GitCommonDir from `git rev-parse --git-common-dir`, then retry."
see_also = ["fak git-daily --help", "internal/gitdaily/refusal.go"]

[reasons.TICK_BUSY]
category = "OPERATOR_GATE"
refusal  = false
summary  = "A live fak git-daily tick already owns this clone's serializer, so the overlapping scheduler fire was skipped without mutation."
fix      = "Wait for the active tick to finish, then read `fak git-daily status`; retry only if no fresh ledger row appears."
see_also = ["fak git-daily status", "internal/gitdaily/refusal.go"]

[reasons.TICK_LOCK_ERROR]
category = "OPERATOR_GATE"
refusal  = true
summary  = "fak git-daily could not open or inspect its per-clone serializer in the Git common directory."
fix      = "Check permissions and filesystem health for the Git common directory, confirm no unsupported lock object replaced the serializer path, then retry."
see_also = ["fak git-daily --json", "internal/gitdaily/refusal.go"]

[reasons.LOCK_CLEANUP_FAILED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The daily tick found a lock that its evidence-gated cleanup could not safely reclaim, so maintenance did not proceed as if the clone were clean."
fix      = "Inspect the lock sweep in `fak git-daily --json`; resolve the named live, ambiguous, or failed lock condition, then rerun the tick."
see_also = ["fak git-daily --json", "internal/gitdaily", "docs/cli-reference.md"]

[reasons.MAINTENANCE_INCIDENT]
category = "OPERATOR_GATE"
refusal  = true
summary  = "Daily object maintenance reached a guarded safety gate or failed command and recorded an incident instead of continuing unattended."
fix      = "Inspect the maintenance refusal in `fak git-daily --json`, correct the reported repository condition, and rerun only after the safety gate is satisfied."
see_also = ["fak git-daily --json", "internal/gitdaily", "fak buildcheck"]

[reasons.LEDGER_WRITE_FAILED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "Daily cleanup and maintenance completed, but fak could not append the bounded JSONL witness in the Git common directory."
fix      = "Make the Git common directory and ledger writable, then rerun `fak git-daily --force` so completion is independently recorded."
see_also = ["fak git-daily --force --json", "internal/gitdaily/refusal.go"]

[reasons.MICROCONTEXT_LEDGER_REFUSED]
category = "MISROUTE"
refusal  = true
summary  = "A micro-context witness, quality ledger, cache A/B, or health scorecard failed schema or accounting reconciliation, so fak refused to grade or publish it."
fix      = "Run the matching `microcontextdemo -verify-* <artifact>` command printed by the producing stage; regenerate the artifact from the source run rather than editing totals by hand."
see_also = ["cmd/microcontextdemo", "docs/research/README.md", "go run ./cmd/microcontextdemo -h"]

# Closed sync divergence refusal vocabulary (issue #10060).
# These tokens are emitted when a safe push or safe sync operation encounters non-fast-forward
# or diverged remote state, overlapping active working tree state, or unquiescent concurrency.
# BEHIND_FASTFORWARDABLE and TARGET_MOVED provide safe executable recovery; diverged, active peer
# merge, and dirty overlap conditions provide typed manual integration diagnostics.
[reasons.BEHIND_FASTFORWARDABLE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The local branch is behind the remote tracking ref, but local HEAD is an ancestor of the remote ref and all paths can be cleanly fast-forwarded."
fix      = "Run `fak sync apply --fetch --remote origin --branch <trunk>` to fast-forward cleanly before retrying push."
see_also = ["fak sync apply", "internal/safesync", "cmd/fak/recover.go", "BEHIND"]

[reasons.DIVERGED_DISJOINT]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The local branch and remote have diverged with distinct commit histories, but touch non-overlapping file trees that can be safely integrated."
fix      = "Run dry-run integration with `fak sync check --fetch --remote origin --branch <trunk>` to preview changes, then merge or rebase in place."
see_also = ["fak sync check", "internal/safesync", "DIVERGED_OVERLAP", "cmd/fak/recover.go"]

[reasons.DIVERGED_OVERLAP]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The local branch and remote have diverged and touch overlapping file paths, requiring manual resolution of content divergence."
fix      = "Inspect differences with `git diff origin/<trunk>...HEAD`, reconcile conflicting changes in place, verify tests, and commit."
see_also = ["fak sync check", "internal/safesync", "DIVERGED_DISJOINT", "cmd/fak/recover.go"]

[reasons.MERGE_ACTIVE_PEER_OWNED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A peer-owned merge or rebase is currently active (e.g. MERGE_HEAD is present) on the working tree."
fix      = "Inspect working tree status with `git status`, unstage any pending paths with `git restore --staged`, and wait for the peer merge to complete."
see_also = ["internal/safesync", "MERGE_IN_PROGRESS", "cmd/fak/recover.go"]

[reasons.DIRTY_WRITE_OVERLAP]
category = "OPERATOR_GATE"
refusal  = true
summary  = "Uncommitted dirty changes in the working tree overlap with incoming changes from the remote ref."
fix      = "Inspect dirty state with `git status`, checkpoint finished local work with `fak wip checkpoint`, and ensure working paths are clear before syncing."
see_also = ["fak wip checkpoint", "internal/safesync", "COLLISION_RISK", "cmd/fak/recover.go"]

[reasons.QUEUED_AWAITING_QUIESCENCE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The repository or trunk is under heavy concurrent update activity and sync operations are queued awaiting quiescence."
fix      = "Wait for concurrent activity to settle, or run `fak sync drain --remote origin --branch <trunk>` to flush once quiescent."
see_also = ["fak sync drain", "internal/safesync", "cmd/fak/recover.go"]

[reasons.TARGET_MOVED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The remote target ref moved concurrently between the pre-push check and execution."
fix      = "Refresh state and verify alignment with `fak sync check --fetch --remote origin --branch <trunk>`, then retry."
see_also = ["fak sync check", "internal/safesync", "BEHIND_FASTFORWARDABLE", "cmd/fak/recover.go"]

[reasons.LEASE_OWNER_UNAVAILABLE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "A writer or lane lease is held by an owner process that is unreachable or unresponsive."
fix      = "Inspect active leases and workers with `dos top`, determine if the holder has stalled or terminated, and reclaim if confirmed stale."
see_also = ["dos top", "internal/safesync", "LOCK_BUSY", "cmd/fak/recover.go"]

[reasons.BEHIND]
category = "OPERATOR_GATE"
refusal  = true
summary  = "Compatibility alias for sync divergence: the local branch is behind or diverged from remote. Superseded by typed reasons (BEHIND_FASTFORWARDABLE, DIVERGED_DISJOINT, DIVERGED_OVERLAP, TARGET_MOVED)."
fix      = "Run `fak sync check --fetch --remote origin --branch <trunk>` to classify divergence into typed reasons (such as BEHIND_FASTFORWARDABLE), then follow the typed recovery plan."
see_also = ["BEHIND_FASTFORWARDABLE", "DIVERGED_DISJOINT", "DIVERGED_OVERLAP", "TARGET_MOVED", "fak sync check"]

[reasons.PARENT_TOKEN_BUDGET_EXCEEDED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "Aggregate token consumption across all launched ultracode worker children exceeded the declared parent token budget envelope (issue #11469)."
fix      = "Increase the declared token budget envelope for the parent ultracode run, reduce the child worker count, or constrain individual child prompt and completion sizes. Floor: internal/orchestration."
see_also = ["PARENT_WALL_DEADLINE_EXCEEDED", "BUDGET_RECEIPT_INCOMPLETE", "internal/orchestration/ultracode_envelope.go", "cmd/fak/recover.go"]

[reasons.PARENT_WALL_DEADLINE_EXCEEDED]
category = "OPERATOR_GATE"
refusal  = true
summary  = "Elapsed wall-clock execution time of the ultracode run reached or exceeded the declared parent wall deadline envelope (issue #11469)."
fix      = "Extend the parent wall budget duration, optimize slow worker steps, or parallelize execution across more responsive fleet nodes. Floor: internal/orchestration."
see_also = ["PARENT_TOKEN_BUDGET_EXCEEDED", "BUDGET_RECEIPT_INCOMPLETE", "internal/orchestration/ultracode_envelope.go", "cmd/fak/recover.go"]

[reasons.BUDGET_RECEIPT_INCOMPLETE]
category = "OPERATOR_GATE"
refusal  = true
summary  = "The ultracode budget receipt is incomplete because one or more child workers did not return provider-authoritative token usage or coverage (issue #11469)."
fix      = "Ensure all launched child workers finish cleanly and report provider-authoritative token usage before admitting the aggregate envelope receipt. Floor: internal/orchestration."
see_also = ["PARENT_TOKEN_BUDGET_EXCEEDED", "PARENT_WALL_DEADLINE_EXCEEDED", "internal/orchestration/ultracode_envelope.go", "cmd/fak/recover.go"]

[reasons.NO_LEASE]
category = "OPERATOR_GATE"
refusal = true
summary = "no live lease exists for the requested id (expired, reaped, or displaced)"
fix = "reacquire the lease with fak leaseref acquire before attempting fenced operations"

[reasons.STALE_LEASE]
category = "OPERATOR_GATE"
refusal = true
summary = "presented lease generation or holder does not match live ref on disk"
fix = "fetch latest ref or reacquire lease if previous hold was displaced or expired"

[retention]
audits_keep_last = 30
