# DOS workspace config -- fleet's own governance, dogfooded.
#
# fak IS an OS-for-agents (a "DOS"); this file turns the SAME kernel on the repo
# that builds it. Until now `dos doctor` saw fleet through trivial defaults: one
# `**/*` lane (so `dos arbitrate` treated the whole repo as a single tree -> max
# concurrency 1), a plans glob that matched none of fleet's plans, and no fleet
# ship grammar. This file replaces those with fleet's real shape, so the DOS loops
# (arbitrate / verify / next-up / self-improve / goal-gate) operate on the truth
# instead of a stub. The mechanism stays in the installed `dos` package; this is
# the only policy that crosses into the tree.
#
# SAFETY (this is a LIVE multi-session fleet): every table only makes DOS smarter
# about fleet -- real lanes, fleet's ship anchor, fleet's own invariants as refusal
# vocabulary. None of it introduces a spontaneous refusal: the custom [reasons.*]
# are DATA that fire only at the opt-in `dos apply` surface / their named floor.
# Validated with `dos doctor`, `dos verify` (recognizes a `(fak <leaf>)` trailer / a
# `fak/<leaf>:` ship within dos's 50-commit grep window -- re-run for the live witness
# sha, which drifts as the window advances), and `dos arbitrate` (two disjoint leaf
# lanes co-acquire) before commit.
workspace = "."

[branch_roles]
# Current no-cutover regime. #1695 makes the branch-role contract executable;
# later cutover tickets change these values only after hooks, CI, prompts, and
# release promotion agree on the same roles.
development_branch = "main"
release_branch = "main"
release_source = "main"
public_front_door = "main"
# Shadow-cutover pilot lever (#1703, docs/branch-regime-shadow-cutover.md): the
# branch a NAMED pilot worker may treat as its development branch, opt-in per
# process via FLEET_BRANCH_PILOT=1. Inert for everyone else -- development_branch
# above stays the single accepted everyday branch until a recorded `proceed`
# cutover decision; the pilot value may never equal release_branch.
pilot_development_branch = "dev"

# Lane taxonomy -- a concurrent lane may run iff its file-tree is disjoint from
# every live lease; an exclusive lane runs alone. fak's architecture is a STAR of
# disjoint leaf trees (PARTITION.md: "dos-arbitrate takes one lease per tree"), and
# the arbiter keys concurrency on the LANE: two workers wanting the same named lane
# serialize even on disjoint sub-trees. So the honest partition is ONE LANE PER LEAF
# (matching the dos-kernel repo's own one-lane-per-dir convention) -- that is what
# lets the live fleet edit N leaves in parallel (e.g. a model-peer and an architest
# worker at once). The trees are prefix-based and pairwise disjoint by construction.
# `internal/abi` is the frozen, human-owned spine (PARTITION.md "wave-0, unleasable")
# -> EXCLUSIVE: an ABI change is the serial gate that every leaf imports.
#
# SUB-LANES (internal/laneadmit/lanetree.go). Every name below is a lane ROOT, not the
# whole vocabulary. A lane name is path-shaped, so `gateway/server` and
# `gateway/server.go` are addressable WITHOUT a row here: they derive their tree from
# the nearest declared ancestor (`gateway` -> `internal/gateway/**`, hence
# `internal/gateway/server/**` and `internal/gateway/server.go`). That is what takes the
# addressable space from the 543 names in this file to 13,678 over the tracked tree --
# measured, not projected, by TestRepoLaneSpaceMultiplier in internal/laneadmit. Keep
# declaring roots here; do NOT enumerate what is below them.
#
# Defaults, all chosen so nothing below this comment changes meaning:
#   * DEFAULT GRANULARITY IS THE LEAF. A surface that names `gateway` gets
#     `internal/gateway/**` exactly as before and serializes with every other `gateway`
#     holder. Narrowing is opt-in: a caller must name the sub-lane to get it.
#   * A SUB-LANE IS NEVER MORE PERMISSIVE THAN ITS ROOT. A parent's holder blocks every
#     descendant and vice versa (conflict kind `lane_ancestry`), `exclusive` below
#     INHERITS downward (no `abi/...` escapes the serial ABI gate), and a tail that
#     cannot be derived falls back to the ancestor's coarse tree.
#   * DIRECTORY granularity is the safe cut for CODE roots: siblings are separate Go
#     packages, so neither worker's half-finished edit can red the other's build. FILE
#     granularity is honest only where files do not co-compile (docs, visuals, examples,
#     testdata). Callers pick; the taxonomy does not force one.
#   * A lease id keeps ONE ref segment: `gateway/server` travels as
#     `<surface>-lane-docs_notes` because internal/leaseref's validID rejects `/`
#     (and git could not hold both refs/fak/locks/x and .../x/y). The encoding is
#     reversible for any real path -- see escapeLaneSegment.
