<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-labelledby="sw-title sw-desc">
  <title id="sw-title">fak — the agent kernel, the benchmark sweep</title>
  <desc id="sw-desc">An eight-panel benchmark sweep. Inkling-2-Mini on an RTX 5080: decode 118.1 vs 81.0 tok/s for stock llama.cpp in the same window, 119.9 vs 119.5 for the fastest llama.cpp fork (parity), opt-in speculative decode at depth 2 171.5 vs 119.7 plain, and NVFP4 W4A4 prefill 5861 vs 3012 tok/s for the fork on a 512-token prompt (1.95x, prompt rate only). On an M3 Pro, 32-token capitals prompt: decode 40.3 vs 37.5 for Splash and 23.4 for the fastest llama.cpp fork. Kernel: cache invalidation on an external write is bit-exact (max|delta|=0); an in-process guard decision costs 2.4 us against 6.9 ms for a spawned hook, 2,849x. Fence: at 1,946 tokens of context fak decodes 89.0 vs 113.8 tok/s for the fork.</desc>
