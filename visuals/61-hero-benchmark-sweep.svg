<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-labelledby="sw-title sw-desc">
  <title id="sw-title">fak — the agent kernel, the benchmark sweep</title>
  <desc id="sw-desc">An eight-panel benchmark sweep sorted from strongest leads to the honest fence. Inkling-2-Mini on an RTX 5080 16 GB: opt-in 128k all-resident prefill 1,190 vs 283 tok/s FP16 KV (4.21x); NVFP4 W4A4 pp512 prefill 5,861 vs 3,012 fork and 2,145 stock llama.cpp; served C4 2k TTFT 2.02 s vs 3.72 s fork and 4.68 s stock (1.84x faster); concurrent HTTP prefill 6,038 vs 3,337 tok/s fork; guard decision 2.4 us vs 6.9 ms spawned hook (2,849x); bit-exact external-write invalidation (max|delta|=0); served C4 2k E2E 130.4 vs 122.5 fork and 115.7 stock; fence: served C1 2k decode 93.2 vs 116.0 tok/s for the fork.</desc>
