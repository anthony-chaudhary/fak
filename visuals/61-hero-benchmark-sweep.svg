  <text x="56" y="58" class="k">BENCHMARK SWEEP · INKLING-2-MINI ON RTX 5080 AND M3 PRO · 2026-11-25</text>
  <text x="56" y="96" class="ti">fak by the benchmarks — Inkling-2-Mini, then the kernel</text>
  <text x="56" y="124" class="sub">Five inference axes for Inkling-2-Mini UD-Q3_K_XL on one RTX 5080 16 GB and one 36 GB M3 Pro, each fak figure (green) against the engine it</text>
  <text x="56" y="146" class="sub">has to beat on the same card and file, then two kernel axes measured without a model; the last panel is the fence where fak still trails.</text>
