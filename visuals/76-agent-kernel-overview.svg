<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">fak: one checkpoint for every agent tool call</title><desc id="desc">An agent sends every tool call through fak, which reuses setup, routes work, serves repeats, sheds old context, and enforces policy before tools and model providers run.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101d35"/></linearGradient><linearGradient id="accent" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="13"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><circle cx="600" cy="342" r="175" fill="#22d3ee" opacity=".07" filter="url(#glow)"/>
<text x="64" y="72" fill="#7dd3fc" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="3">THE AGENT KERNEL</text><text x="64" y="124" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="39" font-weight="750">One checkpoint. Every tool call.</text><text x="64" y="160" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="20">Keep the agent you already use. Put fak in front of what it can do.</text>
<g font-family="Inter,Segoe UI,sans-serif"><rect x="64" y="264" width="230" height="166" rx="22" fill="#111f37" stroke="#334155"/><circle cx="109" cy="309" r="20" fill="#1e293b" stroke="#38bdf8"/><path d="M100 309h18m-5-5 5 5-5 5" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="315" fill="#f8fafc" font-size="22" font-weight="700">Your agent</text><text x="92" y="358" fill="#94a3b8" font-size="17">Claude · Codex · custom</text><text x="92" y="389" fill="#64748b" font-size="15">same prompts · same tools</text>
<path d="M294 347h82" stroke="#38bdf8" stroke-width="3"/><path d="m366 339 12 8-12 8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="380" y="218" width="440" height="258" rx="28" fill="#0b172b" stroke="url(#accent)" stroke-width="2.5"/><text x="414" y="264" fill="#f8fafc" font-size="29" font-weight="800">fak</text><text x="469" y="263" fill="#7dd3fc" font-size="16" font-weight="700" letter-spacing="2">BEFORE EXECUTION</text>
<g font-size="16" font-weight="650"><rect x="414" y="292" width="176" height="48" rx="12" fill="#102a3b"/><text x="438" y="322" fill="#a5f3fc">↻  reuse setup</text><rect x="610" y="292" width="176" height="48" rx="12" fill="#18243d"/><text x="634" y="322" fill="#c4b5fd">⇢  route work</text><rect x="414" y="354" width="176" height="48" rx="12" fill="#102a3b"/><text x="438" y="384" fill="#a5f3fc">⚡  serve repeats</text><rect x="610" y="354" width="176" height="48" rx="12" fill="#18243d"/><text x="634" y="384" fill="#c4b5fd">≋  shed old turns</text></g><line x1="414" y1="424" x2="786" y2="424" stroke="#24364f"/><text x="414" y="454" fill="#fbbf24" font-size="15" font-weight="700">LOCKED FLOOR</text><text x="535" y="454" fill="#cbd5e1" font-size="15">default-deny policy at the same seam</text>
<path d="M820 347h82" stroke="#38bdf8" stroke-width="3"/><path d="m892 339 12 8-12 8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="906" y="240" width="230" height="214" rx="22" fill="#111f37" stroke="#334155"/><text x="938" y="286" fill="#f8fafc" font-size="21" font-weight="700">Tools + providers</text><rect x="938" y="310" width="166" height="42" rx="10" fill="#17263f"/><text x="959" y="337" fill="#bae6fd" font-size="15">APIs · shell · MCP</text><rect x="938" y="366" width="166" height="42" rx="10" fill="#17263f"/><text x="963" y="393" fill="#ddd6fe" font-size="15">models · gateways</text>
<rect x="64" y="540" width="1072" height="76" rx="18" fill="#0d1a2e" stroke="#20314a"/><text x="92" y="573" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="1.5">PERFORMANCE FIRST</text><text x="92" y="598" fill="#cbd5e1" font-size="16">Do shared work once, keep provider caches useful, and make long-running sessions cheaper.</text><text x="865" y="587" fill="#64748b" font-size="14">github.com/anthony-chaudhary/fak</text></g></svg>