<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three levels of evidence for fak</title><desc id="desc">Three cards show structural preflight without a model, an offline agent demonstration, and a live model serve as progressively stronger proofs.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#121a32"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="64" y="70" fill="#c4b5fd" font-size="17" font-weight="700" letter-spacing="3">PROOF, NOT PROMISES</text><text x="64" y="122" fill="#f8fafc" font-size="39" font-weight="750">Start in 60 seconds. Add reality when you need it.</text><text x="64" y="158" fill="#94a3b8" font-size="19">Each rung answers a different question; none borrows evidence from the next.</text>
<g><rect x="64" y="220" width="330" height="302" rx="22" fill="#0d1b30" stroke="#22d3ee" stroke-width="2"/><text x="90" y="261" fill="#67e8f9" font-size="14" font-weight="750" letter-spacing="2">01 · STRUCTURE</text><text x="90" y="300" fill="#f8fafc" font-size="25" font-weight="750">Preflight a call</text><text x="90" y="332" fill="#94a3b8" font-size="16">No key · no model · no GPU</text><rect x="90" y="362" width="278" height="84" rx="12" fill="#07111f"/><text x="108" y="391" fill="#64748b" font-family="Consolas,monospace" font-size="13">fak preflight --tool refund</text><text x="108" y="422" fill="#fbbf24" font-family="Consolas,monospace" font-size="17" font-weight="700">DENY · POLICY_BLOCK</text><text x="90" y="484" fill="#cbd5e1" font-size="15">Proves the locked policy floor.</text>
<rect x="435" y="220" width="330" height="302" rx="22" fill="#111b32" stroke="#8b5cf6" stroke-width="2"/><text x="461" y="261" fill="#c4b5fd" font-size="14" font-weight="750" letter-spacing="2">02 · BEHAVIOR</text><text x="461" y="300" fill="#f8fafc" font-size="25" font-weight="750">Run the offline agent</text><text x="461" y="332" fill="#94a3b8" font-size="16">Reproducible on a laptop</text><rect x="461" y="362" width="278" height="84" rx="12" fill="#07111f"/><text x="479" y="391" fill="#64748b" font-family="Consolas,monospace" font-size="13">fak agent --offline</text><text x="479" y="422" fill="#86efac" font-family="Consolas,monospace" font-size="17" font-weight="700">task still completed</text><text x="461" y="484" fill="#cbd5e1" font-size="15">Proves end-to-end control flow.</text>
<rect x="806" y="220" width="330" height="302" rx="22" fill="#101f36" stroke="#38bdf8" stroke-width="2"/><text x="832" y="261" fill="#7dd3fc" font-size="14" font-weight="750" letter-spacing="2">03 · LIVE SYSTEM</text><text x="832" y="300" fill="#f8fafc" font-size="25" font-weight="750">Serve a real model</text><text x="832" y="332" fill="#94a3b8" font-size="16">Provider + hardware witnesses</text><rect x="832" y="362" width="278" height="84" rx="12" fill="#07111f"/><text x="850" y="391" fill="#64748b" font-family="Consolas,monospace" font-size="13">fak serve --config ...</text><text x="850" y="422" fill="#7dd3fc" font-family="Consolas,monospace" font-size="17" font-weight="700">measure real effects</text><text x="832" y="484" fill="#cbd5e1" font-size="15">Proves claims in deployment.</text></g>
<path d="M394 371h41m-10-9 10 9-10 9M765 371h41m-10-9 10 9-10 9" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="584" fill="#64748b" font-size="14">Reproduce the smallest honest claim first. Escalate the witness—not the rhetoric.</text><text x="865" y="584" fill="#64748b" font-size="14">github.com/anthony-chaudhary/fak</text></g></svg>