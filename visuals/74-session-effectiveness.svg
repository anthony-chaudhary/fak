<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="se-title se-desc">
<title id="se-title">One guarded fak session: 1,720 hash-chained decisions over 7h 11m, 4 dangerous calls blocked, 0 chain breaks</title>
<desc id="se-desc">A live fak guard journal replayed. The kernel adjudicated 1,720 tool calls across a 7-hour unattended run, allowed 99.77% to proceed, blocked exactly the 4 dangerous ones, and chained every verdict into a tamper-evident record with zero breaks. Numbers computed from .dispatch-runs/guard-audit/interactive-37096-16daf1ca84d5.jsonl.</desc>
