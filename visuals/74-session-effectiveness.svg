<text x="56" y="66" class="kick">ONE GUARDED SESSION · CAPTURED LIVE · EVERY TOOL CALL ADJUDICATED</text>
<text x="56" y="112" class="ti">1,720 decisions. 4 stopped. 0 tampered.</text>
<text x="56" y="146" class="sub">One “fak guard” run drove an agent for 7 hours unattended — the kernel let the real work flow,</text>
<text x="56" y="172" class="sub">blocked only the dangerous calls, and hash-chained every verdict into an unbroken record.</text>
