<text x="66" y="1008" class="thH">WHERE EVERY SESSION IS GOING</text>
<text x="66" y="1038" class="thB">This isn’t a special run — it’s the default shape of any agent under fak guard. As agents run longer and more autonomously,</text>
<text x="66" y="1062" class="thB">a real-time verdict on every tool call and a tamper-evident record of every decision stop being nice-to-haves.</text>
<text x="66" y="1086" class="thL">A 7-hour unattended run that blocks only what’s dangerous and can prove what it did — that’s the floor every session is heading toward.</text>
<text x="40" y="1154" class="foot">Source: .dispatch-runs/guard-audit/interactive-37096-16daf1ca84d5.jsonl — 1,720 hash-chained DECIDE records, replayed.</text>
<text x="1400" y="1154" class="foot" text-anchor="end">Per-verdict kernel decide cost 362 ns → BENCHMARK-AUTHORITY.md.</text>
