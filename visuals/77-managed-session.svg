<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A managed fak session gets more useful over time</title><desc id="desc">A five-stage sequence shows setup becoming a reusable prefix, repeated calls served locally, lightweight work routed economically, context compacted, and useful work continuing.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111a31"/></linearGradient><linearGradient id="line"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="64" y="70" fill="#a5f3fc" font-size="17" font-weight="700" letter-spacing="3">ONE MANAGED SESSION</text><text x="64" y="122" fill="#f8fafc" font-size="39" font-weight="750">The session gets more useful—not just longer.</text><text x="64" y="158" fill="#94a3b8" font-size="19">fak manages repeated work, model choice, and context pressure as the trajectory grows.</text><line x1="125" y1="346" x2="1070" y2="346" stroke="url(#line)" stroke-width="4"/><g fill="#0b172b" stroke="#38bdf8" stroke-width="3"><circle cx="150" cy="346" r="13"/><circle cx="375" cy="346" r="13"/><circle cx="600" cy="346" r="13"/><circle cx="825" cy="346" r="13"/><circle cx="1050" cy="346" r="13"/></g>
<g font-size="15" font-weight="700" letter-spacing="1"><text x="91" y="218" fill="#64748b">01 · START</text><text x="310" y="218" fill="#64748b">02 · REPEAT</text><text x="538" y="218" fill="#64748b">03 · ROUTE</text><text x="758" y="218" fill="#64748b">04 · PRESSURE</text><text x="986" y="218" fill="#64748b">05 · CONTINUE</text></g>
<g><rect x="64" y="238" width="172" height="82" rx="16" fill="#101f36"/><text x="84" y="270" fill="#f8fafc" font-size="18" font-weight="700">Pin the prefix</text><text x="84" y="297" fill="#94a3b8" font-size="14">shared setup stays stable</text><rect x="289" y="372" width="172" height="82" rx="16" fill="#102a3b"/><text x="309" y="404" fill="#ecfeff" font-size="18" font-weight="700">Serve locally</text><text x="309" y="431" fill="#94a3b8" font-size="14">skip duplicate work</text><rect x="514" y="238" width="172" height="82" rx="16" fill="#18243d"/><text x="534" y="270" fill="#f5f3ff" font-size="18" font-weight="700">Match the model</text><text x="534" y="297" fill="#94a3b8" font-size="14">spend where it matters</text><rect x="739" y="372" width="172" height="82" rx="16" fill="#102a3b"/><text x="759" y="404" fill="#ecfeff" font-size="18" font-weight="700">Compact old turns</text><text x="759" y="431" fill="#94a3b8" font-size="14">preserve live invariants</text><rect x="964" y="238" width="172" height="82" rx="16" fill="#18243d"/><text x="984" y="270" fill="#f5f3ff" font-size="18" font-weight="700">Keep working</text><text x="984" y="297" fill="#94a3b8" font-size="14">without a cold restart</text></g>
<rect x="64" y="520" width="1072" height="92" rx="18" fill="#0d1a2e" stroke="#20314a"/><text x="91" y="555" fill="#fbbf24" font-size="14" font-weight="700" letter-spacing="1.5">ALWAYS ON THE PATH</text><text x="91" y="583" fill="#cbd5e1" font-size="17">Every tool call still crosses the structural policy floor before execution.</text><text x="863" y="573" fill="#64748b" font-size="14">fak · agent kernel</text></g></svg>