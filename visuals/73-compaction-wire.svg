<svg xmlns="http://www.w3.org/2000/svg" width="920" height="238" viewBox="0 0 920 238" font-size="12" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
<rect width="920" height="238" fill="#ffffff"/>
<text x="20" y="34" fill="#57606a" font-size="13" font-weight="700" letter-spacing="0.06em">COMPACTION: ONE FIRE, ON THE WIRE</text>
<rect x="331" y="22" width="184" height="17" rx="4" fill="none" stroke="#d0d7de"/>
<text x="423" y="34" fill="#6e7781" font-size="10" text-anchor="middle" letter-spacing="0.04em">OUTBOUND REQUEST BODY</text>
<rect x="20" y="50" width="11" height="11" rx="2" fill="#6366f1"/>
<text x="36" y="60" fill="#57606a" font-size="10">protected prefix (cache hit ~0.1x)</text>
<rect x="313" y="50" width="11" height="11" rx="2" fill="#bf8700"/>
<text x="329" y="60" fill="#57606a" font-size="10">stale middle (cache miss, full price)</text>
<rect x="606" y="50" width="11" height="11" rx="2" fill="#1a7f37"/>
<text x="622" y="60" fill="#57606a" font-size="10">recent window (working set)</text>
<rect x="20" y="68" width="11" height="11" rx="2" fill="#9aa5b1"/>
<text x="36" y="78" fill="#57606a" font-size="10">stub + restore handle</text>
<text x="98" y="111" fill="#57606a" font-size="11" text-anchor="end">before</text>
<clipPath id="clip0"><rect x="108" y="96" width="678" height="22" rx="6"/></clipPath>
<rect x="108" y="96" width="678" height="22" rx="6" fill="#f0f3f6" stroke="#d0d7de"/>
<g clip-path="url(#clip0)">
<rect x="108.00" y="96" width="153.10" height="22" fill="#6366f1" stroke="#0f1117" stroke-opacity="0.16" stroke-width="0.6"/>
<text x="184.55" y="111" fill="#ffffff" font-size="9" text-anchor="middle">protected prefix - cache hit</text>
<rect x="261.10" y="96" width="306.19" height="22" fill="#bf8700" stroke="#0f1117" stroke-opacity="0.16" stroke-width="0.6"/>
<text x="414.19" y="111" fill="#ffffff" font-size="9" text-anchor="middle">stale middle - re-billed every turn</text>
<rect x="567.29" y="96" width="218.71" height="22" fill="#1a7f37" stroke="#0f1117" stroke-opacity="0.16" stroke-width="0.6"/>
<text x="676.65" y="111" fill="#ffffff" font-size="9" text-anchor="middle">recent window</text>
</g>
<text x="900" y="111" fill="#6e7781" font-size="10" text-anchor="end">~62,000 tok  (over the 48K budget -&gt; fires)</text>
<text x="98" y="142" fill="#57606a" font-size="11" text-anchor="end">after</text>
<clipPath id="clip1"><rect x="108" y="127" width="678" height="22" rx="6"/></clipPath>
<rect x="108" y="127" width="678" height="22" rx="6" fill="#f0f3f6" stroke="#d0d7de"/>
<g clip-path="url(#clip1)">
<rect x="108.00" y="127" width="153.10" height="22" fill="#6366f1" stroke="#0f1117" stroke-opacity="0.16" stroke-width="0.6"/>
<text x="184.55" y="142" fill="#ffffff" font-size="9" text-anchor="middle">protected prefix - SAME cache hit</text>
<rect x="261.10" y="127" width="6.56" height="22" fill="#9aa5b1" stroke="#0f1117" stroke-opacity="0.16" stroke-width="0.6"/>
<rect x="267.66" y="127" width="218.71" height="22" fill="#1a7f37" stroke="#0f1117" stroke-opacity="0.16" stroke-width="0.6"/>
<text x="377.01" y="142" fill="#ffffff" font-size="9" text-anchor="middle">recent window - unchanged</text>
</g>
<text x="900" y="142" fill="#6e7781" font-size="10" text-anchor="end">~34,600 tok  (prefix + window untouched)</text>
<text x="20" y="172" fill="#57606a" font-size="11">One compaction fire on the outbound request body. The protected prefix (through the first cache breakpoint) is copied</text>
<text x="20" y="188" fill="#57606a" font-size="11">byte-for-byte, so its cache discount survives; the stale middle is dropped to a one-message stub carrying a restore handle;</text>
<text x="20" y="204" fill="#57606a" font-size="11">the recent window is untouched. Schematic - bands sized to illustrate, stub not to scale.</text>
</svg>